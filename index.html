يُبنى للمجهول؛ نحوّل الجملة الثانية فقط.","en":"My neighbour disappeared six months ago. I haven't seen him since then. (→ My neighbour disappeared six months ago. He hasn't been seen since then.)","src":"SB 32 ex.c #1","kind":"derived"}]},"signals":{"keywords":["be + past participle","by","with","every year","now","right now","recently","last week","years ago","since then","tomorrow"],"items":[{"ar":"نستعمل المجهول عندما لا نعرف الفاعل أو لا يهمنا.","en":"We use the passive vioce when we don't know or aren't interested in who or what does the action.","src":"WB 21","kind":"book"},{"ar":"by أو with قبل الفاعل الحقيقي علامة على المبني للمجهول.","en":"The basement has been flooded by the washing machine.","src":"WB 21","kind":"book"},{"ar":"كلمة الوقت تحدد زمن be: right now ← are being.","en":"…so they (send) back to the manufacturer right now. (→ are being sent)","src":"SB 32 ex.b #4","kind":"derived"},{"ar":"recently ← have been.","en":"Many offices of large companies (build) in the town centre recently. (→ have been built)","src":"SB 32 ex.b #3","kind":"derived"},{"ar":"last week ← were.","en":"Camera footage shows that illegal goods (smuggle) into the warehouse last week. (→ were smuggled)","src":"SB 32 ex.b #5","kind":"derived"},{"ar":"years ago مع should ← should have been.","en":"It (should / send) to the scrap years ago. (→ should have been sent)","src":"SB 32 ex.b #8","kind":"derived"}]}},"questions":[{"type":"mcq","q":"Many offices of large companies …..……. (build) in the town centre recently.","options":["have been built","were being built","are built"],"answer":0,"src":"SB 32 ex.b #3","origin":"adapted","explain_ar":"recently تدل على المضارع التام، ومجهوله have been + V3."},{"type":"mcq","q":"All the goods that were purchased yesterday have defects, so they ……………. (send) back to the manufacturer right now.","options":["are sent","have been sent","are being sent"],"answer":2,"src":"SB 32 ex.b #4","origin":"adapted","explain_ar":"right now تدل على المضارع المستمر، ومجهوله are being + V3."},{"type":"mcq","q":"Your car is a death trap. It ……………… (should / send) to the scrap years ago.","options":["should be sent","should have sent","should have been sent"],"answer":2,"src":"SB 32 ex.b #8","origin":"adapted","explain_ar":"years ago ماضٍ مع فعل ناقص ← should have been + V3، والسيارة لا ترسل نفسها فالجملة مجهول."},{"type":"tf","statement":"Only transitive verbs (verbs with an object) can be made passive.","answer":true,"src":"WB 21","origin":"book","explain_ar":"قاعدة الكتاب: الفعل الذي له مفعول فقط يُبنى للمجهول."},{"type":"tf","statement":"In the story, “It’s hoped he will be found in a few days” is an example of the present continuous passive.","answer":false,"src":"SB 31 ex.a","origin":"adapted","explain_ar":"will be found مستقبل مجهول (future passive). مثال المضارع المستمر في القصة: is being treated."},{"type":"tf","statement":"Sentences with verbs of two objects can have two different forms in the passive.","answer":true,"src":"WB 21","origin":"book","explain_ar":"مثال الكتاب: The students were given plenty of time… / Plenty of time was given to the students…"},{"type":"fill","q":"I'm sorry this office is so dirty, but it …………. (can’t / clean) until tomorrow morning.","answers":["can't be cleaned","cannot be cleaned"],"src":"SB 32 ex.b #1","origin":"book","explain_ar":"فعل ناقص في المجهول: modal + be + V3، والنفي بعد can."},{"type":"fill","q":"The hotel near our office was closed because it ………………. (renovate) by the owner.","answers":["was being renovated"],"src":"SB 32 ex.b #7","origin":"book","explain_ar":"الترميم كان جارياً وقت الإغلاق في الماضي ← was being + V3."},{"type":"fill","q":"Change into passive: Police officers were examining the evidence when the lights went out.","answers":["The evidence was being examined when the lights went out.","The evidence was being examined by police officers when the lights went out."],"src":"SB 32 ex.c #3","origin":"book","explain_ar":"الماضي المستمر في المجهول: was / were being + V3."},{"type":"fill","q":"Change into passive: Sami's parents must have brought him up to be more polite.","answers":["Sami must have been brought up to be more polite.","Sami must have been brought up by his parents to be more polite."],"src":"SB 32 ex.c #5","origin":"book","explain_ar":"فعل ناقص للماضي في المجهول: must have been + V3."},{"type":"fill","q":"Change into passive: The secretary has told the manager some bad news about the new project.","answers":["The manager has been told some bad news about the new project.","The manager has been told some bad news about the new project by the secretary.","Some bad news about the new project has been told to the manager.","Some bad news about the new project has been told to the manager by the secretary."],"src":"WB 22 ex.a #6","origin":"book","explain_ar":"فعل بمفعولين: نبدأ عادةً بالشخص (The manager)، والمضارع التام في المجهول has been + V3."},{"type":"fill","q":"Change into passive: How much do they spend on these activities?","answers":["How much is spent on these activities?"],"src":"WB 22 ex.b #2","origin":"book","explain_ar":"do تختفي في سؤال المجهول، ونضع is + spent لأن الفاعل الجديد مفرد غير معدود (how much)."}],"flags":[{"type":"book_typo","ar":"صندوق القاعدة: «passive vioce» والصحيح voice. تركنا نص الكتاب كما هو.","src":"WB 21"},{"type":"book_typo","ar":"مثال تمرين الأسئلة: «manufacurers» والصحيح manufacturers (الكتاب نفسه كتبها صح في الجواب).","src":"WB 22 ex.b e.g."},{"type":"book_typo","ar":"«1500 square kilometeres» والصحيح kilometres، و«schoolbell» تُكتب عادةً school bell. البندان ليسا في أسئلتنا.","src":"WB 22 ex.a #2, #7"}]}]},{"unit":4,"unit_title":"Engineering","grammar_title":"The Causative (Have something done)","pages":{"sb":[42,43,47,48],"wb":[29,30,34]},"rules":[{"id":"u4-causative","name_en":"The Causative (have / get something done)","name_ar":"السببية (have / get something done)","branches":{"form":{"summary_ar":"نستعمل have something done وget something done لأفعال تُعمل للفاعل لا بيده: الفاعل تسبّب في حدوث الفعل (دفع أو طلب أو أقنع شخصاً آخر) لكنه لم يقم به بنفسه. ونستعمل have something done أيضاً لشيء يحدث لشخص، غالباً شيء غير سار وخارج عن إرادته.","structure":"S + have / get (in the needed tense) + object + past participle (V3) (+ by + agent)","items":[{"ar":"التركيب كما في الكتاب.","en":"Form: have (get) + object + past participle","src":"WB 29","kind":"book"},{"ar":"الفعل يُعمل للفاعل لا بيده (أصلح السيارة في الكراج).","en":"I don´t know how to repair cars, so I´m having mine repaired at the garage.","src":"WB 29","kind":"book"},{"ar":"شيء غير سار حدث للشخص.","en":"I stood so close to the fire that I got my legs burnt.","src":"WB 29","kind":"book"},{"ar":"مثال الكتاب مع must.","en":"WE REPAIR ALL KINDS OF BOOTS AND SHOES. → That reminds me I must have my shoes repaired.","src":"SB 42 ex.b example","kind":"book"},{"ar":"مثال الكتاب بالماضي (شيء غير سار): نحوّل جملة المجهول إلى had + object + V3.","en":"(Huda’s bag was pulled off her shoulder.) → Huda had her bag pulled off her shoulder.","src":"SB 43 ex.c example","kind":"book"},{"ar":"مثال الكتاب بالماضي (خدمة).","en":"Tareq’s windows were dirty, but he didn’t have time to clean them himself. Last Sunday, Tareq had his windows cleaned.","src":"WB 30 example","kind":"book"},{"ar":"مثال الكتاب مع can.","en":"What can you have done if you go to a barber? I can have my hair cut.","src":"SB 43 ex.d example","kind":"book"},{"ar":"الزمن يظهر في have فقط، والفعل الأساسي يبقى V3، ويمكن وضع ضمير مكان المفعول.","en":"Lisa didn’t repair the hairdryer herself. She had it repaired.","src":"WB 34 Grammar b e.g.","kind":"book"}]},"negative":{"structure":"S + don't / doesn't / didn't + have + object + V3 | S + modal + not + have + object + V3","verb_change_ar":"have في السببية فعل أساسي، فننفيه مثل أي فعل عادي: نضيف don't / doesn't / didn't ويرجع have مصدراً، ويبقى الفعل الأساسي V3. ومع will / must وغيرها نضع not بعد الفعل الناقص.","items":[{"ar":"مثال الكتاب: لم يجعل أحداً يصلح السيارة.","en":"My father didn't have the car mended.","src":"SB 42 ex.a #4","kind":"book"},{"ar":"مقارنة الكتاب بين أربعة معانٍ.","en":"1 My father mended the car himself. 2 The car was mended by my father. 3 My father had the car mended. 4 My father didn't have the car mended.","src":"SB 42 ex.a","kind":"book"}]},"question":{"structure":"(Wh-) + do / does / did / existing auxiliary + S + have + object + V3 ?","aux_ar":"بما أن have فعل أساسي هنا، نضيف do / does / did في السؤال، أو نقدّم الفعل المساعد الموجود (can / have …) على الفاعل، ويبقى الفعل الأساسي V3.","items":[{"ar":"سؤال من الكتاب مع can.","en":"What can you have done if you go to a mechanic?","src":"SB 43 ex.d #1","kind":"book"},{"ar":"سؤال من الكتاب بالمضارع التام: have مساعد يتقدّم، وhad هي فعل السببية.","en":"How many times have you had your house broken into?","src":"SB 47 Review 1 ex.1 #10","kind":"derived"}],"notes":[{"ar":"have something done وget something done كلاهما لأفعال تُعمل للفاعل لا بيده.","en":"Have something done and Get something done are both used to refer to actions which are done for the subject rather than by the subject. It means that the subject caused the action to happen, but didn't do it themselves. Maybe they paid, or asked, or persuaded the other person to do it.","src":"WB 29","kind":"book"},{"ar":"نستعمل السببية بدل المبني للمجهول لنُظهر أن الفاعل هو من سبّب الفعل.","en":"Causative verbs are used instead of passive verbs to show that the subject causes the action to be done. e.g. My car is being repaired at the garage now.","src":"WB 29","kind":"book"},{"ar":"لشيء يحدث لشخص، غالباً غير سار وخارج عن إرادته.","en":"We use have something done to talk about something that happens to someone, usually something unpleasant and outside control. e.g. I stood so close to the fire that I got my legs burnt.","src":"WB 29","kind":"book"},{"ar":"يمكن ذكر من قام بالفعل بـ by في آخر الجملة.","en":"(Ali’s driving licence was taken away by the police.) → Ali had his driving licence taken away by the police.","src":"SB 43 ex.c #1","kind":"derived"}]},"signals":{"keywords":["have","get","himself / herself / myself","at the garage","barber","mechanic","carpenter","tailor","by + agent"],"items":[{"ar":"إذا قيل إن الشخص لم يفعل الشيء بنفسه (herself / himself) ← السببية.","en":"Lisa didn’t repair the hairdryer herself. She had it repaired.","src":"WB 34 Grammar b e.g.","kind":"book"},{"ar":"إذا فعلها الشخص بنفسه (himself) لا نستعمل السببية.","en":"My father mended the car himself.","src":"SB 42 ex.a #1","kind":"book"},{"ar":"لافتات المحلات (We repair / We mend) ← الزبون يجعل المحل يقوم بالعمل.","en":"WE MEND WATCHES AND CLOCKS → (That shop isn’t expensive. I/ my watch/ mend/ there last week)","src":"SB 42 ex.b #3","kind":"book"},{"ar":"أماكن الخدمة (barber, mechanic, carpenter, tailor).","en":"What can you have done if you go to a barber? I can have my hair cut.","src":"SB 43 ex.d","kind":"book"},{"ar":"شيء غير سار حدث لشخص (جملة مجهول بين قوسين) ← had + object + V3.","en":"Some unpleasant things happened to these people last week. Use the sentences in brackets to write a sentence with had something done.","src":"SB 43 ex.c","kind":"book"}]}},"questions":[{"type":"mcq","q":"How many times …………… you …………………. your house broken into?","options":["do/have","did/ have","have/ had"],"answer":2,"src":"SB 47 Review 1 ex.1 #10","origin":"book","explain_ar":"How many times بلا وقت ماضٍ منتهي = حتى الآن ← مضارع تام: have (مساعد) + had (فعل السببية) + your house + broken into. لو كان في وقت منتهي (last year) كان الماضي البسيط did … have."},{"type":"mcq","q":"Which sentence means that my father asked or paid someone else to mend the car?","options":["My father mended the car himself.","My father had the car mended.","My father didn't have the car mended."],"answer":1,"src":"SB 42 ex.a","origin":"adapted","explain_ar":"had + object + V3 يعني أن شخصاً آخر قام بالعمل لأجله."},{"type":"mcq","q":"Yesterday, the optician checked my mother’s eyes. → Yesterday, my mother ……………………… .","options":["had her eyes checked","had checked her eyes","has her eyes checked"],"answer":0,"src":"WB 30 #3","origin":"adapted","explain_ar":"Yesterday ← had، والمفعول (her eyes) يأتي قبل التصريف الثالث (checked)."},{"type":"tf","statement":"Have something done and Get something done are both used to refer to actions which are done for the subject rather than by the subject.","answer":true,"src":"WB 29","origin":"book","explain_ar":"قاعدة الكتاب: الفاعل يسبّب الفعل ولا يقوم به بنفسه."},{"type":"tf","statement":"In “My father had the car mended”, my father mended the car himself.","answer":false,"src":"SB 42 ex.a","origin":"adapted","explain_ar":"had the car mended يعني أن غيره أصلحها له؛ أما My father mended the car himself فتعني أنه أصلحها بنفسه."},{"type":"tf","statement":"We use have something done to talk about something that happens to someone, usually something unpleasant.","answer":true,"src":"WB 29","origin":"book","explain_ar":"مثال الكتاب: I got my legs burnt، وتمرين SB 43 ex.c: Huda had her bag pulled off her shoulder."},{"type":"fill","q":"LET US CLEAN YOUR CARPETS AND CURTAINS (My mother goes to that shop. She/ the carpets/ clean/ there) My mother goes to that shop. ____ .","answers":["She has the carpets cleaned there.","She has the carpets cleaned there"],"src":"SB 42 ex.b #1","origin":"book","explain_ar":"عادة (goes) ← مضارع بسيط: has + the carpets + cleaned."},{"type":"fill","q":"WE MEND WATCHES AND CLOCKS (That shop isn’t expensive. I/ my watch/ mend/ there last week) That shop isn’t expensive. ____ .","answers":["I had my watch mended there last week.","I had my watch mended there last week"],"src":"SB 42 ex.b #3","origin":"book","explain_ar":"last week ← had + my watch + mended."},{"type":"fill","q":"(Our electricity was cut off because we had forgotten to pay the bill) ____ .","answers":["We had our electricity cut off because we had forgotten to pay the bill.","We had our electricity cut off because we had forgotten to pay the bill"],"src":"SB 43 ex.c #3","origin":"book","explain_ar":"شيء غير سار حدث لنا في الماضي ← had + our electricity + cut off."},{"type":"fill","q":"Mrs. Hakim’s doctor says to her: “When you come to see me next week, I’ll check your heartbeat.” When Mrs. Hakim goes to see the doctor next week, she ____ .","answers":["will have her heartbeat checked","'ll have her heartbeat checked"],"src":"WB 30 #4","origin":"book","explain_ar":"next week ← will have + her heartbeat + checked."},{"type":"fill","q":"Rewrite using have or get in the correct tense: A decorator has repaired our house.","answers":["We have had our house repaired.","We have had our house repaired by a decorator.","We have got our house repaired.","We have got our house repaired by a decorator.","We've had our house repaired by a decorator."],"src":"SB 48 Review 1 ex.5 #5","origin":"book","explain_ar":"الجملة بالمضارع التام (has repaired) ← have had / have got + our house + repaired."},{"type":"fill","q":"Rewrite using a causative verb: My father hasn’t planted the trees himself. ____ .","answers":["He has had them planted.","He has had the trees planted.","He's had them planted."],"src":"WB 34 Progress Test 1 Grammar b #4","origin":"book","explain_ar":"لم يزرعها بنفسه، والزمن مضارع تام ← has had + them + planted (على نمط مثال الكتاب She had it repaired)."}],"flags":[{"type":"book_typo","ar":"صندوق القاعدة: «something unpleasant and outside control» والأوضح outside their control. تركنا نص الكتاب كما هو.","src":"WB 29"},{"type":"unsure","ar":"WB 30 #5 (We …… of our house): مكان الفراغ يفرض ترتيباً غير طبيعي (We are going to have the front door mended of our house)، والأصح We are going to have the front door of our house mended. البند ليس في أسئلتنا.","src":"WB 30 #5"},{"type":"unsure","ar":"WB 30 #6 (I repainted the house myself last month): الكتاب يطلب صيغة have something done، والفعل قام به الشخص بنفسه، فالجواب المحتمل نفي: I didn't have the house repainted. البند ليس في أسئلتنا.","src":"WB 30 #6"}]}]}]},{"module":3,"module_title":"Module 3 Politics","units":[{"unit":5,"unit_title":"Civil Rights","grammar_title":"Relative Clauses","pages":{"sb":[56,81],"wb":[39,40,41,66]},"rules":[{"id":"u5-people-who-whom-that","name_en":"Relative pronouns for people: who / whom / that","name_ar":"ضمائر الوصل للأشخاص: who / whom / that","branches":{"form":{"summary_ar":"الجملة الموصولة تعطي معلومة وصفية عن اسم قبلها. مع الأشخاص نستعمل who أو that عندما يكون الضمير فاعلاً، وwhom عندما يكون مفعولاً.","structure":"person + who / that + verb …  |  person + whom + subject + verb …  |  preposition + whom","items":[{"ar":"تعريف الجملة الموصولة والضمير الموصول","en":"Relative clauses provide descriptive information about a noun or noun phrase. Relative pronouns are used to connect relative clauses to the main clause in a sentence.","src":"WB 39","kind":"book"},{"ar":"who وwhom للأشخاص فقط: who فاعل الفعل، وwhom مفعول","en":"Who and whom refer only to people. Who is the subject of the action while whom is the object.","src":"WB 39","kind":"book"},{"ar":"who فاعل (girl = who = subject)","en":"The girl who is waving to us is my cousin.","src":"WB 39","kind":"book"},{"ar":"whom مفعول، ويأتي بعد حرف الجر (guest speaker = to whom)","en":"The guest speaker is the one to whom you should address the letter.","src":"WB 39","kind":"book"},{"ar":"قاعدة الكتاب: للأشخاص نستعمل who أو that","en":"The man who worked in a printing company visited me last night.","src":"SB 56 ex.a #3","kind":"book"}]},"negative":{"structure":"person + who / that + don't / doesn't / didn't / hadn't … + verb  (النفي داخل الجملة الموصولة أو في الجملة الرئيسية كالمعتاد)","verb_change_ar":"الضمير الموصول لا يتغير مع النفي. وعند دمج جملتين يحل الضمير الموصول محل الاسم المكرر، فيُحذف الضمير (him / her / them) من الجملة الثانية.","items":[{"ar":"نفي داخل الجملة الموصولة: who فاعل لفعل منفي","en":"What should be done to those who do not obey law?","src":"WB 73","kind":"book"},{"ar":"دمج جملة منفية: him حُذفت لأن whom حلّت محلها","en":"Yesterday I ran into an old friend. I hadn't seen him for years. → Yesterday I ran into an old friend whom I hadn't seen for years.","src":"WB 41 ex.b #6","kind":"derived"},{"ar":"النفي في الجملة الرئيسية، وthem حُذفت","en":"I don't know most of the people. You invited them to the party. → I don't know most of the people whom you invited to the party.","src":"WB 66 Progress Test 2 Grammar b #3","kind":"derived"}]},"question":{"structure":"(Wh-) + aux + S + … + person + who / whom … ?","aux_ar":"السؤال يكون في الجملة الرئيسية فقط: فعلها المساعد يتقدم على فاعلها، أما الجملة الموصولة فتبقى بترتيب الجملة الخبرية.","items":[{"ar":"سؤال في الجملة الرئيسية، والجملة الموصولة (who are going to…) بترتيب الخبر","en":"What advice can you give to other patients who are going to have an operation?","src":"WB 24","kind":"book"}],"notes":[{"ar":"تعليمات تمرين الدمج في الكتاب: احذف الكلمات المكررة","en":"Combine each sentence by using a relative pronoun and eliminate the repeated words.","src":"WB 40 ex.b","kind":"book"},{"ar":"that تُستعمل فقط في الجمل المحددة (بلا فواصل)","en":"Note: That can only be used in defining relative clauses.","src":"WB 40","kind":"book"}]},"signals":{"keywords":["a person","the man / the woman","people","students","to whom","WHO / WHOM (Rewrite)"],"items":[{"ar":"الاسم قبل الفراغ شخص وبعد الفراغ فعل مباشرة ← who / that","en":"A ...... is a person ...... protects important people from being attacked.","src":"SB 56 ex.b #2","kind":"book"},{"ar":"بعد الفراغ فاعل جديد + فعل (الشخص مفعول)، أو قبل الفراغ حرف جر ← whom","en":"The guest speaker is the one to whom you should address the letter.","src":"WB 39","kind":"book"},{"ar":"في تمارين إعادة الصياغة، الكلمة المعطاة يمين الجملة تحدد الضمير","en":"When the teacher asked, all the students gave correct answers. (WHOM)","src":"SB 81 Review 2 ex.1 #4","kind":"book"}]}},"questions":[{"type":"mcq","q":"We have a package for the man (who, which) stopped by today.","options":["who","which"],"answer":0,"src":"WB 40 ex.a #1","origin":"book","explain_ar":"the man شخص وبعد الفراغ فعل (stopped)، فنستعمل who."},{"type":"mcq","q":"The man ______ worked in a printing company visited me last night.","options":["which","whose","who"],"answer":2,"src":"SB 56 ex.a #3","origin":"adapted","explain_ar":"شخص والضمير فاعل لـ worked ← who."},{"type":"mcq","q":"The guest speaker is the one to ______ you should address the letter.","options":["whom","who","which"],"answer":0,"src":"WB 39","origin":"adapted","explain_ar":"بعد حرف الجر to ومع شخص مفعول نستعمل whom."},{"type":"tf","statement":"Who and whom refer only to people. Who is the subject of the action while whom is the object.","answer":true,"src":"WB 39","origin":"book","explain_ar":"هذا نص قاعدة الكتاب."},{"type":"tf","statement":"Whom is the subject of the action while who is the object.","answer":false,"src":"WB 39","origin":"adapted","explain_ar":"العكس: who فاعل وwhom مفعول."},{"type":"tf","statement":"Use who or that for people.","answer":true,"src":"SB 56 ex.a Rules 3-4","origin":"adapted","explain_ar":"قاعدة SB ص56: للأشخاص who أو that."},{"type":"fill","q":"A bodyguard is a person ______ protects important people from being attacked.","answers":["who","that"],"src":"SB 56 ex.b #2","origin":"adapted","explain_ar":"شخص والضمير فاعل لـ protects ← who أو that. (الاسم bodyguard من صندوق الكتاب)"},{"type":"fill","q":"The repair man saw the machine and fixed it. (WHO) → This is ______ .","answers":["the repair man who saw the machine and fixed it"],"src":"SB 81 Review 2 ex.1 #2","origin":"book","explain_ar":"who فاعل يحل محل the repair man في الجزء الثاني."},{"type":"fill","q":"When the teacher asked, all the students gave correct answers. (WHOM) → All students ______ .","answers":["whom the teacher asked gave correct answers"],"src":"SB 81 Review 2 ex.1 #4","origin":"book","explain_ar":"الطلاب مفعول لـ asked (the teacher asked them) ← whom."},{"type":"fill","q":"Combine: Yesterday I ran into an old friend. I hadn't seen him for years.","answers":["Yesterday I ran into an old friend whom I hadn't seen for years.","Yesterday I ran into an old friend who I hadn't seen for years.","Yesterday I ran into an old friend that I hadn't seen for years."],"src":"WB 41 ex.b #6","origin":"book","explain_ar":"him مفعول، فيحل محله whom (أو who/that) ويُحذف him."},{"type":"fill","q":"Combine: I don't know most of the people. You invited them to the party.","answers":["I don't know most of the people whom you invited to the party.","I don't know most of the people who you invited to the party.","I don't know most of the people that you invited to the party."],"src":"WB 66 Progress Test 2 Grammar b #3","origin":"book","explain_ar":"them مفعول لـ invited ← whom، وتُحذف them."}],"flags":[]},{"id":"u5-things-which-that","name_en":"Relative pronouns for things: which / that","name_ar":"ضمائر الوصل للأشياء: which / that","branches":{"form":{"summary_ar":"مع الأشياء نستعمل which أو that، فاعلاً كان الضمير أو مفعولاً.","structure":"thing + which / that + verb …  |  thing + which / that + subject + verb …","items":[{"ar":"which وthat للأشياء","en":"That and which are used with things. e.g. The bill that/ which you received last week needs to be paid tomorrow.","src":"WB 39","kind":"book"},{"ar":"which فاعل لـ is used","en":"A drill is a tool which is used to make a hole in something.","src":"SB 56 ex.a #1","kind":"book"},{"ar":"that مفعول (you can carry them)","en":"Mobile phones are phones that you can carry around in your pocket.","src":"SB 56 ex.a #2","kind":"book"}]},"negative":{"structure":"thing + which / that + negative verb …  (أو النفي في الجملة الرئيسية)","verb_change_ar":"which / that لا يتغيران مع النفي. عند الدمج يُحذف الضمير it أو الاسم المكرر لأن which / that حلّ محله.","items":[{"ar":"which تعود على الجملة كلها والفعل بعدها منفي","en":"It wasn't unusual for Hani to turn up late. → Hani turned up late which wasn't unusual.","src":"SB 81 Review 2 ex.1 #1 (example)","kind":"book"},{"ar":"عند الدمج حُذفت it بعد about","en":"The subject interested everyone. You wrote about it last week. → The subject which you wrote about last week interested everyone.","src":"WB 66 Progress Test 2 Grammar b #4","kind":"derived"}]},"question":{"structure":"(Wh-) + aux + S + … + thing + which / that … ?","aux_ar":"السؤال في الجملة الرئيسية فقط، والجملة الموصولة تبقى بترتيب الخبر.","items":[{"ar":"سؤال بالمستقبل المستمر وفيه جملة موصولة بـ which","en":"Will you be presenting the slides which you took in Canada last summer?","src":"WB 40 ex.a #4","kind":"book"},{"ar":"سؤال وفيه جملة موصولة بـ that","en":"Are there any jobs that suit men more than women?","src":"WB 7","kind":"book"}],"notes":[{"ar":"مع الفاصلة (جملة غير محددة) لا نستعمل that","en":"Note: That can only be used in defining relative clauses.","src":"WB 40","kind":"book"},{"ar":"وظيفة الجمل الموصولة حسب SB","en":"Rules: Relative clauses tell you: which thing, person or place we are talking about. / what a thing, person or place is or does.","src":"SB 56","kind":"book"}]},"signals":{"keywords":["a machine","a tool","the dress","the slides","it (repeated)","WHICH (Rewrite)"],"items":[{"ar":"الاسم قبل الفراغ شيء أو آلة ← which / that","en":"A ...... is a machine ...... makes copies of documents.","src":"SB 56 ex.b #1","kind":"book"},{"ar":"فاصلة قبل الفراغ (غير محددة) ← which فقط","en":"The income tax, (that, which) he paid last year, is accurate.","src":"WB 40 ex.a #3","kind":"book"}]}},"questions":[{"type":"mcq","q":"Will you be presenting the slides (whose, which) you took in Canada last summer?","options":["whose","which"],"answer":1,"src":"WB 40 ex.a #4","origin":"book","explain_ar":"the slides أشياء، وبعد الفراغ فاعل + فعل (you took) ← which."},{"type":"mcq","q":"A drill is a tool ______ is used to make a hole in something.","options":["who","which","where"],"answer":1,"src":"SB 56 ex.a #1","origin":"adapted","explain_ar":"a tool شيء ← which."},{"type":"mcq","q":"Mobile phones are phones ______ you can carry around in your pocket.","options":["who","whose","that"],"answer":2,"src":"SB 56 ex.a #2","origin":"adapted","explain_ar":"phones أشياء ← that (أو which)."},{"type":"tf","statement":"That and which are used with things.","answer":true,"src":"WB 39","origin":"book","explain_ar":"نص قاعدة الكتاب."},{"type":"tf","statement":"Use which or that for things.","answer":true,"src":"SB 56 ex.a Rules 1-2","origin":"adapted","explain_ar":"قاعدة SB ص56."},{"type":"tf","statement":"Will you be presenting the slides whose you took in Canada last summer?","answer":false,"src":"WB 40 ex.a #4","origin":"adapted","explain_ar":"whose للملكية ويأتي بعده اسم؛ هنا الصحيح which."},{"type":"fill","q":"A photocopier is a machine ______ makes copies of documents.","answers":["which","that"],"src":"SB 56 ex.b #1","origin":"adapted","explain_ar":"آلة (شيء) والضمير فاعل لـ makes. (الاسم من صندوق الكتاب)"},{"type":"fill","q":"A vacuum cleaner is a machine ______ you use to clean floors and carpets.","answers":["which","that"],"src":"SB 56 ex.b #5","origin":"adapted","explain_ar":"آلة والضمير مفعول لـ use ← which / that."},{"type":"fill","q":"Combine: We went to a café on Sunday. It was very nice.","answers":["The café which we went to on Sunday was very nice.","The café that we went to on Sunday was very nice.","We went to a café on Sunday which was very nice.","We went to a café on Sunday, which was very nice."],"src":"WB 41 ex.b #5","origin":"book","explain_ar":"it تعود على café، فيحل محلها which / that."},{"type":"fill","q":"Combine: The subject interested everyone. You wrote about it last week.","answers":["The subject which you wrote about last week interested everyone.","The subject that you wrote about last week interested everyone.","The subject about which you wrote last week interested everyone."],"src":"WB 66 Progress Test 2 Grammar b #4","origin":"book","explain_ar":"it مفعول لـ wrote about ← which / that، وتُحذف it."},{"type":"fill","q":"Combine: Lubna bought a dress. The dress cost $45. She had to return it.","answers":["Lubna bought a dress which cost $45. She had to return it.","Lubna bought a dress that cost $45. She had to return it.","The dress which Lubna bought cost $45. She had to return it.","Lubna had to return the dress which cost $45."],"src":"WB 40 ex.b #1","origin":"book","explain_ar":"the dress مكرر، فيحل محله which / that."}],"flags":[{"type":"book_typo","ar":"مثال الكتاب «Hani turned up late which wasn't unusual.» بلا فاصلة قبل which، مع أن which هنا تعود على الجملة كلها (غير محددة) والكتاب نفسه يقول إن الجمل غير المحددة تحتاج فواصل (WB 40). الصحيح: Hani turned up late, which wasn't unusual. نقلناه كما هو.","src":"SB 81 Review 2 ex.1 #1"},{"type":"unsure","ar":"بند لبنى ثلاث جمل، والكتاب لم يحدد أي جملتين تُدمجان؛ وضعنا أكثر من جواب مقبول.","src":"WB 40 ex.b #1"}]},{"id":"u5-whose-possession","name_en":"Possession: whose","name_ar":"الملكية: whose","branches":{"form":{"summary_ar":"whose تدل على الملكية: تربط الشخص (أو الكائن الحي) بشيء يخصه، ويأتي بعدها اسم مباشرة.","structure":"noun + whose + noun + verb …","items":[{"ar":"whose للملكية، وغالباً للأشخاص والكائنات الحية","en":"Whose shows possession and usually refers to people or other living things.","src":"WB 39","kind":"book"},{"ar":"مثال الكتاب","en":"The manager whose daughter is my friend spoke to us last night.","src":"WB 39","kind":"book"},{"ar":"car تخص the woman","en":"The woman whose car was stolen called the police.","src":"SB 56 ex.a #4","kind":"book"}]},"negative":{"structure":"noun + whose + noun + negative verb …","verb_change_ar":"whose لا تتغير. عند الدمج تحل محل صفة الملكية (his / her / their) أو الاسم مع 's في الجملة الثانية. الكتاب لم يعطِ جملة whose منفية؛ النفي يكون في الفعل بعد الاسم كالمعتاد.","items":[{"ar":"his حلّت محلها whose","en":"I know that doctor. His patients always talk highly about him. → That is the doctor whose patients always talk highly about him.","src":"SB 81 Review 2 ex.1 #7","kind":"derived"},{"ar":"The students' (ملكية بـ 's) حلّت محلها whose","en":"Mrs. Duncan is talking to her students. The students' projects are due on Friday. → Mrs. Duncan is talking to her students whose projects are due on Friday.","src":"WB 40 ex.b #2","kind":"derived"}]},"question":{"structure":"(Wh-) + aux + S + … + noun + whose + noun … ?","aux_ar":"السؤال في الجملة الرئيسية فقط، وwhose + الاسم يبقيان بترتيب الخبر. الكتاب لم يعطِ سؤالاً فيه whose موصولة.","items":[{"ar":"سؤال مشتق من جملة الكتاب","en":"Did you meet the author whose book is on the best-seller list?","src":"WB 40 ex.a #2","kind":"derived"}],"notes":[{"ar":"قاعدة SB: الملكية بـ whose","en":"Use 6 ______ for possession. (whose)","src":"SB 56 ex.a Rules","kind":"book"}]},"signals":{"keywords":["job","car","daughter","projects","his / her / their","'s","WHOSE (Rewrite)"],"items":[{"ar":"بعد الفراغ اسم يخص الشخص الذي قبله ← whose","en":"A ...... is a person ...... job is to mend central heating, taps, etc.","src":"SB 56 ex.b #4","kind":"book"},{"ar":"his / her / their أو 's في الجملة الثانية ← whose","en":"I know a man. His last name is Goose.","src":"WB 41 ex.b #7","kind":"book"}]}},"questions":[{"type":"mcq","q":"I met the author (who, whose) book is on the best-seller list.","options":["who","whose"],"answer":1,"src":"WB 40 ex.a #2","origin":"book","explain_ar":"book يخص the author وبعد الفراغ اسم ← whose."},{"type":"mcq","q":"The woman ______ car was stolen called the police.","options":["whose","who","which"],"answer":0,"src":"SB 56 ex.a #4","origin":"adapted","explain_ar":"السيارة تخص المرأة ← whose."},{"type":"mcq","q":"The manager ______ daughter is my friend spoke to us last night.","options":["whom","which","whose"],"answer":2,"src":"WB 39","origin":"adapted","explain_ar":"daughter تخص the manager ← whose."},{"type":"tf","statement":"Whose shows possession and usually refers to people or other living things.","answer":true,"src":"WB 39","origin":"book","explain_ar":"نص قاعدة الكتاب."},{"type":"tf","statement":"I met the author who book is on the best-seller list.","answer":false,"src":"WB 40 ex.a #2","origin":"adapted","explain_ar":"قبل اسم يدل على ملكية نستعمل whose لا who."},{"type":"fill","q":"A plumber is a person ______ job is to mend central heating, taps, etc.","answers":["whose"],"src":"SB 56 ex.b #4","origin":"adapted","explain_ar":"job تخص الشخص ← whose. (الاسم من صندوق الكتاب)"},{"type":"fill","q":"Combine: Mrs. Duncan is talking to her students. The students' projects are due on Friday.","answers":["Mrs. Duncan is talking to her students whose projects are due on Friday."],"src":"WB 40 ex.b #2","origin":"book","explain_ar":"The students' ملكية ← whose."},{"type":"fill","q":"Combine: I know a man. His last name is Goose.","answers":["I know a man whose last name is Goose."],"src":"WB 41 ex.b #7","origin":"book","explain_ar":"His ← whose."},{"type":"fill","q":"I know that doctor. His patients always talk highly about him. (WHOSE) → That is ______ .","answers":["the doctor whose patients always talk highly about him"],"src":"SB 81 Review 2 ex.1 #7","origin":"book","explain_ar":"His patients ← whose patients."},{"type":"fill","q":"Combine: I apologised to the woman. I spilled her coffee on her new dress.","answers":["I apologised to the woman whose coffee I spilled on her new dress."],"src":"WB 66 Progress Test 2 Grammar b #5","origin":"book","explain_ar":"her coffee ← whose coffee."}],"flags":[]},{"id":"u5-where-places","name_en":"Places: where / which, that + preposition","name_ar":"الأماكن: where أو which / that مع حرف جر","branches":{"form":{"summary_ar":"مع الأماكن نستعمل where، أو which / that مع حرف جر.","structure":"place + where + subject + verb …  =  place + which / that + subject + verb + preposition","items":[{"ar":"عنوان القاعدة في الكتاب","en":"4. Places (where, which/ that+ preposition)","src":"WB 40","kind":"book"},{"ar":"where = which/that + in","en":"This is the house where I grew up. / This is the house which/ that I grew up in.","src":"WB 40","kind":"book"},{"ar":"where في جملة غير محددة بين فاصلتين","en":"Lattakia, where I spent my last holiday, is a wonderful city.","src":"SB 56 ex.a #5","kind":"book"}]},"negative":{"structure":"place + where + S + negative verb …  (أو النفي في الجملة الرئيسية)","verb_change_ar":"where لا تتغير، وتحل محل there أو (in + المكان) في الجملة الثانية. إذا استعملت which / that فلا بد من بقاء حرف الجر (in) في آخر الجملة.","items":[{"ar":"النفي في الجملة الرئيسية (This isn't)","en":"I think the bus stopped outside a different building. → This isn't the building where the bus stopped.","src":"SB 81 Review 2 ex.1 #6","kind":"derived"}]},"question":{"structure":"(Wh-) + aux + S + … + place + where … ?","aux_ar":"السؤال في الجملة الرئيسية، والجملة الموصولة تبقى بترتيب الخبر. الكتاب لم يعطِ سؤالاً فيه where موصولة.","items":[{"ar":"سؤال مشتق من جملة الكتاب (حرف الجر قبل which)","en":"Is this the city in which Shakespeare was born?","src":"WB 40 ex.a #5","kind":"derived"}],"notes":[{"ar":"بعد حرف الجر نستعمل which لا where","en":"This is the city in (which, where) Shakespeare was born.","src":"WB 40 ex.a #5","kind":"derived"},{"ar":"قاعدة SB: للأماكن where","en":"Use 5 ______ for places. (where)","src":"SB 56 ex.a Rules","kind":"book"}]},"signals":{"keywords":["a place","city","village","house","building","there","in which","WHERE (Rewrite)"],"items":[{"ar":"الاسم مكان وبعده جملة كاملة (فاعل + فعل) ← where","en":"A ...... is a place with washing machines ...... you can wash your clothes.","src":"SB 56 ex.b #3","kind":"book"},{"ar":"there أو in that village في الجملة الثانية ← where","en":"My grandparents live in that village. (WHERE)","src":"SB 81 Review 2 ex.1 #3","kind":"book"}]}},"questions":[{"type":"mcq","q":"This is the city in (which, where) Shakespeare was born.","options":["which","where"],"answer":0,"src":"WB 40 ex.a #5","origin":"book","explain_ar":"قبل الفراغ حرف الجر in، فنستعمل which (in which = where)."},{"type":"mcq","q":"Lattakia, ______ I spent my last holiday, is a wonderful city.","options":["which","where","who"],"answer":1,"src":"SB 56 ex.a #5","origin":"adapted","explain_ar":"مكان وبعده جملة كاملة بلا حرف جر ← where."},{"type":"mcq","q":"This is the house ______ I grew up.","options":["which","whose","where"],"answer":2,"src":"WB 40","origin":"adapted","explain_ar":"لا يوجد in في آخر الجملة، فالصحيح where."},{"type":"tf","statement":"This is the house which I grew up in.","answer":true,"src":"WB 40","origin":"book","explain_ar":"which + حرف الجر in في آخر الجملة = where."},{"type":"tf","statement":"Use where for places.","answer":true,"src":"SB 56 ex.a Rules 5","origin":"adapted","explain_ar":"قاعدة SB ص56."},{"type":"tf","statement":"This is the city in where Shakespeare was born.","answer":false,"src":"WB 40 ex.a #5","origin":"adapted","explain_ar":"بعد حرف الجر in نستعمل which لا where."},{"type":"fill","q":"A launderette is a place with washing machines ______ you can wash your clothes.","answers":["where"],"src":"SB 56 ex.b #3","origin":"adapted","explain_ar":"مكان وبعده جملة كاملة ← where. (الاسم من صندوق الكتاب)"},{"type":"fill","q":"My grandparents live in that village. (WHERE) → That is ______ .","answers":["the village where my grandparents live"],"src":"SB 81 Review 2 ex.1 #3","origin":"book","explain_ar":"in that village ← where."},{"type":"fill","q":"I think the bus stopped outside a different building. (WHERE) → This isn't ______ .","answers":["the building where the bus stopped","the building where I think the bus stopped"],"src":"SB 81 Review 2 ex.1 #6","origin":"book","explain_ar":"outside the building ← where."},{"type":"fill","q":"Combine: We will spend our holiday in the same village. We have had a lot of joyful days there.","answers":["We will spend our holiday in the same village where we have had a lot of joyful days.","We will spend our holiday in the same village in which we have had a lot of joyful days."],"src":"WB 66 Progress Test 2 Grammar b #2","origin":"book","explain_ar":"there تعود على المكان ← where (أو in which)."}],"flags":[]},{"id":"u5-when-times","name_en":"Times: when","name_ar":"الزمن: when","branches":{"form":{"summary_ar":"مع الاسم الذي يدل على زمن (يوم، وقت، فصل) نستعمل when.","structure":"time noun + when + subject + verb …","items":[{"ar":"عنوان القاعدة ومثالها","en":"5. Times (when) e.g. Saturday's the day when I tidy the flat.","src":"WB 40","kind":"book"},{"ar":"a time + when","en":"The evening is a time when we can all relax.","src":"WB 40 ex.a #6","kind":"book"}]},"negative":{"structure":"time noun + when + S + negative verb …","verb_change_ar":"when لا تتغير، وتحل محل then في الجملة الثانية. الكتاب لم يعطِ جملة منفية بـ when؛ النفي يكون في الفعل كالمعتاد.","items":[{"ar":"then حُذفت وحلّت محلها when","en":"Summer is the time of year. The weather is the hottest then. → Summer is the time of year when the weather is the hottest.","src":"WB 41 ex.b #4","kind":"derived"}]},"question":{"structure":"(Wh-) + aux + S + … + time noun + when … ?","aux_ar":"السؤال في الجملة الرئيسية، والجملة بعد when تبقى بترتيب الخبر. الكتاب لم يعطِ سؤالاً بهذه الصيغة.","items":[{"ar":"سؤال مشتق من مثال الكتاب","en":"Is Saturday the day when you tidy the flat?","src":"WB 40","kind":"derived"}],"notes":[{"ar":"بند مفتوح في الكتاب: the day تتبعها when","en":"I will never forget the day ……………… .","src":"WB 41 ex.c #5","kind":"book"}]},"signals":{"keywords":["the day","a time","the time of year","the evening","then","WHEN (Rewrite)"],"items":[{"ar":"الاسم قبل الفراغ زمن ← when","en":"The evening is a time (when, where) we can all relax.","src":"WB 40 ex.a #6","kind":"book"},{"ar":"then في الجملة الثانية ← when","en":"I like February 7, because I met my best friend then. (WHEN)","src":"SB 81 Review 2 ex.1 #5","kind":"book"}]}},"questions":[{"type":"mcq","q":"The evening is a time (when, where) we can all relax.","options":["when","where"],"answer":0,"src":"WB 40 ex.a #6","origin":"book","explain_ar":"a time زمن ← when."},{"type":"mcq","q":"Saturday's the day ______ I tidy the flat.","options":["when","where","whose"],"answer":0,"src":"WB 40","origin":"adapted","explain_ar":"the day زمن ← when."},{"type":"tf","statement":"Saturday's the day when I tidy the flat.","answer":true,"src":"WB 40","origin":"book","explain_ar":"مثال الكتاب: when بعد اسم زمن."},{"type":"tf","statement":"The evening is a time where we can all relax.","answer":false,"src":"WB 40 ex.a #6","origin":"adapted","explain_ar":"a time زمن لا مكان، فالصحيح when."},{"type":"fill","q":"Combine: Summer is the time of year. The weather is the hottest then.","answers":["Summer is the time of year when the weather is the hottest."],"src":"WB 41 ex.b #4","origin":"book","explain_ar":"then ← when."},{"type":"fill","q":"I like February 7, because I met my best friend then. (WHEN) → February 7 is ______ .","answers":["the day when I met my best friend"],"src":"SB 81 Review 2 ex.1 #5","origin":"book","explain_ar":"then ← when بعد the day."}],"flags":[]},{"id":"u5-defining-non-defining","name_en":"Defining and Non-defining Clauses","name_ar":"الجمل الموصولة المحدِّدة وغير المحدِّدة","branches":{"form":{"summary_ar":"الجملة الموصولة إما ضرورية للمعنى (defining، بلا فواصل) أو معلومة إضافية (non-defining، بين فاصلتين).","structure":"Defining: noun + who / which / that … (no commas)  |  Non-defining: noun, who / which / where … , (commas, no that)","items":[{"ar":"نوعا الجملة الموصولة","en":"Relative clauses can either be essential to the sentence (defining clauses) or non-essential (non-defining clauses).","src":"WB 40","kind":"book"},{"ar":"المحددة: معلومة ضرورية وبلا فواصل","en":"Defining clauses are clauses carrying essential information. Without it, a main clause will fail to convey the full meaning. Because of the necessity of their information, defining clauses are not set apart by commas: e.g. Here is the website which my sister created.","src":"WB 40","kind":"book"},{"ar":"غير المحددة: معلومة إضافية وبين فاصلتين","en":"Non-defining clauses contain additional information to the main clause that, when taken away, doesn't affect the meaning of the sentence. Non-defining clauses require the use of commas to distinguish the additional information from the rest of the sentence. e.g. My cousin, who volunteers at a local homeless shelter, won the lottery.","src":"WB 40","kind":"book"},{"ar":"مثال غير محددة من SB","en":"Lattakia, where I spent my last holiday, is a wonderful city.","src":"SB 56 ex.a #5","kind":"book"}]},"negative":{"structure":"حذف الجملة: Non-defining ← المعنى يبقى كاملاً  |  Defining ← المعنى ينقص","verb_change_ar":"لا يوجد نفي خاص بهذه القاعدة، فالنفي في الفعل كالمعتاد. ما يتغير فعلاً هو أثر الحذف: إذا حذفت الجملة غير المحددة لا يتغير معنى الجملة، وإذا حذفت المحددة لا توصل الجملة الرئيسية المعنى الكامل.","items":[{"ar":"احذف ما بين الفاصلتين: My cousin won the lottery. والمعنى كامل","en":"My cousin, who volunteers at a local homeless shelter, won the lottery.","src":"WB 40","kind":"book"},{"ar":"جملة غير محددة بـ which بين فاصلتين","en":"The income tax, which he paid last year, is accurate.","src":"WB 40 ex.a #3","kind":"book"}]},"question":{"structure":"(Wh-) + aux + S + … + (defining / non-defining clause) … ?","aux_ar":"لا فعل مساعد خاص؛ فعل الجملة الرئيسية المساعد يتقدم على فاعلها، والجملة الموصولة تبقى كما هي بفواصلها.","items":[{"ar":"سؤال فيه جملة محددة بـ that (بلا فواصل)","en":"Are there any new gadgets that you really want to get?","src":"SB 115","kind":"book"}],"notes":[{"ar":"ملاحظة الكتاب","en":"Note: That can only be used in defining relative clauses.","src":"WB 40","kind":"book"},{"ar":"وظيفة الجمل الموصولة حسب SB","en":"Rules: Relative clauses tell you: which thing, person or place we are talking about. / what a thing, person or place is or does.","src":"SB 56","kind":"book"}]},"signals":{"keywords":["commas ( , … , )","that = defining only","my cousin / her sister","Lattakia"],"items":[{"ar":"فاصلة قبل الفراغ ← جملة غير محددة ← which / who لا that","en":"The income tax, (that, which) he paid last year, is accurate.","src":"WB 40 ex.a #3","kind":"book"},{"ar":"الاسم معروف بذاته والمعلومة إضافية ← جملة غير محددة بين فاصلتين","en":"Lattakia, where I spent my last holiday, is a wonderful city.","src":"SB 56 ex.a #5","kind":"derived"}]}},"questions":[{"type":"mcq","q":"The income tax, (that, which) he paid last year, is accurate.","options":["that","which"],"answer":1,"src":"WB 40 ex.a #3","origin":"book","explain_ar":"الفواصل تعني جملة غير محددة، وthat لا تُستعمل إلا في المحددة."},{"type":"mcq","q":"My cousin, ______ volunteers at a local homeless shelter, won the lottery.","options":["that","who","whose"],"answer":1,"src":"WB 40","origin":"adapted","explain_ar":"شخص في جملة غير محددة (بين فاصلتين) ← who لا that."},{"type":"tf","statement":"That can only be used in defining relative clauses.","answer":true,"src":"WB 40","origin":"book","explain_ar":"ملاحظة الكتاب."},{"type":"tf","statement":"Defining clauses are set apart by commas.","answer":false,"src":"WB 40","origin":"adapted","explain_ar":"الكتاب: defining clauses are not set apart by commas."},{"type":"tf","statement":"Non-defining clauses contain additional information; when taken away, it doesn't affect the meaning of the sentence.","answer":true,"src":"WB 40","origin":"adapted","explain_ar":"هذا تعريف الكتاب للجمل غير المحددة."},{"type":"tf","statement":"The income tax, that he paid last year, is accurate.","answer":false,"src":"WB 40 ex.a #3","origin":"adapted","explain_ar":"مع الفواصل لا نستعمل that؛ الصحيح which."},{"type":"fill","q":"Combine: Sally introduced me to her sister. Her sister is a civil engineer.","answers":["Sally introduced me to her sister, who is a civil engineer.","Sally introduced me to her sister who is a civil engineer."],"src":"WB 40 ex.b #3","origin":"book","explain_ar":"Her sister فاعل ← who؛ وإذا كانت المعلومة إضافية توضع بين فاصلتين."},{"type":"fill","q":"Combine: Bob travelled all over the world. He met a lot of famous people.","answers":["Bob, who travelled all over the world, met a lot of famous people.","Bob, who met a lot of famous people, travelled all over the world."],"src":"WB 66 Progress Test 2 Grammar b #1","origin":"book","explain_ar":"Bob اسم علم والمعلومة إضافية ← who بين فاصلتين."}],"flags":[{"type":"book_typo","ar":"مثال Review 2 «Hani turned up late which wasn't unusual.» جملة غير محددة بلا فاصلة، يخالف قاعدة WB 40. الصحيح بفاصلة قبل which.","src":"SB 81 Review 2 ex.1 #1"}]}]},{"unit":6,"unit_title":"United Nations","grammar_title":"Future Forms","pages":{"sb":[62,81,82],"wb":[46,47,48,65,66,111,112]},"rules":[{"id":"u6-will","name_en":"Will / won't","name_ar":"المستقبل بـ will","branches":{"form":{"summary_ar":"will + المصدر: للتنبؤ (برأينا أو خبرتنا)، وللقرار لحظة الكلام، وللعروض والوعود والاقتراحات، وللأحداث المستقبلية التي لم نرتبها بعد.","structure":"S + will ('ll) + V0","items":[{"ar":"للتنبؤ أو القرار الفوري","en":"We use will for predictions or an immediate decision. e.g. One day people will travel to Mars. / “Anything to drink, sir?” - “I'll just have a glass of water, please.”","src":"WB 46","kind":"book"},{"ar":"تنبؤ مبني على الرأي أو الخبرة السابقة","en":"to make predictions, usually based on our opinions or our past experience: e.g. I think it'll be extremely hot there.","src":"WB 111","kind":"book"},{"ar":"أحداث مستقبلية لم نرتبها بعد","en":"to talk about future events we haven't arranged yet: e.g. We'll probably stay in some sort of mountain lodge there.","src":"WB 111-112","kind":"book"},{"ar":"قرار لحظة الكلام","en":"to talk about something we decide to do at the time of speaking: e.g. Tell me all about it and I'll pass on the information to the rest of the team.","src":"WB 112","kind":"book"},{"ar":"العروض والوعود والاقتراحات","en":"to make offers, promises or suggestions: e.g. Don't worry, I'll let everyone know. (a promise)","src":"WB 112","kind":"book"},{"ar":"مثال تنبؤ من SB","en":"I think the weather will be too hot tomorrow.","src":"SB 62 ex.a #1","kind":"book"}]},"negative":{"structure":"S + won't (will not) + V0","verb_change_ar":"will لا تتغير مع الفاعل، والفعل بعدها مصدر بلا to وبلا s، في الإثبات والنفي.","items":[{"ar":"عنوان القاعدة في الكتاب: will ونفيها won't","en":"1. Will or won't","src":"WB 46","kind":"book"},{"ar":"won't + مصدر في وعد","en":"I assure you it won't happen again.","src":"SB 57","kind":"book"}]},"question":{"structure":"(Wh-) + will + S + V0 ?","aux_ar":"will نفسها هي الفعل المساعد: تتقدم على الفاعل بلا do.","items":[{"ar":"سؤال بـ What + will","en":"What will happen to the family if he loses all his money?","src":"SB 81 Review 2 ex.2 #7","kind":"book"},{"ar":"will داخل سؤال Do you think…?","en":"Do you think that students will study at home in the future instead of going to school?","src":"WB 30","kind":"book"}],"notes":[{"ar":"مقدمة الكتاب: أكثر من صيغة ممكنة حسب نظرتنا للحدث","en":"Many forms are used to talk about the future in English. In many cases, a number of different forms are possible, depending on how we see the event.","src":"WB 111","kind":"book"}]},"signals":{"keywords":["I think","probably","I'm sure","I hope","Don't worry","One day","if you like"],"items":[{"ar":"I think ← تنبؤ بالرأي","en":"I think the weather will be too hot tomorrow.","src":"SB 62 ex.a #1","kind":"book"},{"ar":"I hope / I'm sure ← will","en":"I really hope I …………. see you again. / I'm sure they ………… get married and live happily ever afterwards.","src":"SB 81-82 Review 2 ex.2 #6, #9","kind":"book"},{"ar":"عرض لحظة الكلام (if you like) ← will","en":"……… go if you like because I have to do some shopping.","src":"SB 81 Review 2 ex.2 #2","kind":"book"}]}},"questions":[{"type":"mcq","q":"…………. go if you like because I have to do some shopping.","options":["I'm","I'll","I'd"],"answer":1,"src":"SB 81 Review 2 ex.2 #2","origin":"book","explain_ar":"عرض وقرار لحظة الكلام ← will (I'll)."},{"type":"mcq","q":"I ………………… simply wait until she comes back.","options":["am","have","will"],"answer":2,"src":"SB 81 Review 2 ex.2 #3","origin":"book","explain_ar":"قرار لحظة الكلام ← will + مصدر (wait). وبعد until مضارع (comes)."},{"type":"mcq","q":"I really hope I …………. see you again.","options":["did","would","will"],"answer":2,"src":"SB 81 Review 2 ex.2 #6","origin":"book","explain_ar":"مستقبل بعد I hope ← will."},{"type":"mcq","q":"What ………….  happen to the family if he loses all his money?","options":["does","will","did"],"answer":1,"src":"SB 81 Review 2 ex.2 #7","origin":"book","explain_ar":"جواب شرط مستقبلي (if + loses) ← will."},{"type":"mcq","q":"I'm sure they ………… get married and live happily ever afterwards.","options":["shall","will","would"],"answer":1,"src":"SB 82 Review 2 ex.2 #9","origin":"book","explain_ar":"تنبؤ بعد I'm sure ← will."},{"type":"mcq","q":"He was quite definite about it and assured me he …………… come.","options":["would","shall","will"],"answer":0,"src":"SB 81 Review 2 ex.2 #4","origin":"book","explain_ar":"الفعل الرئيسي ماضٍ (assured)، فتصبح will في الكلام المنقول would. (will بتنقبل بالكلام المنقول بس إذا الوعد لسا قائم، وقاعدة الكتاب: الفعل الرئيسي ماضٍ ← would.)"},{"type":"mcq","q":"I think the weather ______ too hot tomorrow.","options":["is being","will have been","will be"],"answer":2,"src":"SB 62 ex.a #1","origin":"adapted","explain_ar":"I think ← تنبؤ بالرأي ← will + مصدر."},{"type":"tf","statement":"We use will for predictions or an immediate decision.","answer":true,"src":"WB 46","origin":"book","explain_ar":"نص قاعدة الكتاب."},{"type":"tf","statement":"We use will for a future event that is officially arranged. It is often used in news reports.","answer":false,"src":"WB 111","origin":"adapted","explain_ar":"هذا استعمال be to لا will."}],"flags":[{"type":"unsure","ar":"بند Review 2 #4 جوابه would (مستقبل في الماضي بعد assured)، وهذا من قواعد الكلام المنقول لا من صيغ المستقبل في Grammar Bank. وضعناه هنا لأنه في تمرين صيغ المستقبل.","src":"SB 81 Review 2 ex.2 #4"}]},{"id":"u6-going-to","name_en":"Be going to","name_ar":"المستقبل بـ be going to","branches":{"form":{"summary_ar":"be going to + المصدر: لشيء قررناه أو نوينا عليه قبل الكلام (ولم نرتبه نهائياً)، وللتنبؤ عندما يوجد دليل حاضر.","structure":"S + am / is / are + going to + V0","items":[{"ar":"قرار أو نية قبل الكلام","en":"We use be going to for actions that we have decided or intended to do before we speak: e.g. I'm going to clean my room this afternoon. (I decided to clean it this morning.)","src":"WB 47","kind":"book"},{"ar":"نية بلا ترتيب نهائي","en":"to talk about events in the future we have already thought about and intend to do: e.g. We're going to hire a bus. (We intend to go, but we haven't made the arrangements yet.)","src":"WB 112","kind":"book"},{"ar":"تنبؤ بدليل حاضر","en":"to make predictions when there is present evidence: e.g. We're going to have a varied trip (I'm judging this from what I know about the plans.)","src":"WB 112","kind":"book"},{"ar":"مثال من SB","en":"The two companies are going to provide very different experiences.","src":"SB 62 ex.a #2","kind":"book"}]},"negative":{"structure":"S + am / is / are + not + going to + V0","verb_change_ar":"be يتصرف مع الفاعل (am / is / are) ويحمل النفي not، والفعل الأساسي يبقى مصدراً بعد to.","items":[{"ar":"isn't going to + مصدر","en":"Ben isn't going to build that wall himself.","src":"WB 34","kind":"book"}]},"question":{"structure":"(Wh-) + am / is / are + S + going to + V0 ?","aux_ar":"be (am / is / are) هو الفعل المساعد: يتقدم على الفاعل بلا do.","items":[{"ar":"What + is + S + going to","en":"What's the weather going to be like next Saturday?","src":"SB 33","kind":"book"},{"ar":"Where + are + S + going to","en":"Where are you and your family going to live?","src":"WB 6","kind":"book"},{"ar":"How long + are + S + going to","en":"How long are you going to stay?","src":"WB 99","kind":"book"}],"notes":[{"ar":"الفرق مع will: going to قرار قبل الكلام، وwill قرار لحظة الكلام","en":"We use will for predictions or an immediate decision. / We use be going to for actions that we have decided or intended to do before we speak.","src":"WB 46-47","kind":"book"}]},"signals":{"keywords":["intend(s)","decided","plan","present evidence","this afternoon","next month"],"items":[{"ar":"intends ← going to","en":"David intends to get up early tomorrow.","src":"SB 62 ex.b #1","kind":"book"},{"ar":"خطة ناتجة عن موقف حاضر (ورث مالاً)","en":"Joe has inherited a lot of money. He ……...… (buy) a new villa next month.","src":"WB 65 Progress Test 2 Grammar a #1","kind":"book"}]}},"questions":[{"type":"fill","q":"David intends to get up early tomorrow. David: I ______ .","answers":["am going to get up early tomorrow","'m going to get up early tomorrow"],"src":"SB 62 ex.b #1","origin":"book","explain_ar":"intends = نية مقررة قبل الكلام ← be going to."},{"type":"fill","q":"Joe has inherited a lot of money. He ……...… (buy) a new villa next month.","answers":["is going to buy","'s going to buy"],"src":"WB 65 Progress Test 2 Grammar a #1","origin":"book","explain_ar":"خطة ونية بعد ما ورث المال، وما في ترتيب محجوز ← is going to buy."},{"type":"mcq","q":"Joe has inherited a lot of money. He ______ a new villa next month.","options":["is going to buy","bought","has bought"],"answer":0,"src":"WB 65 Progress Test 2 Grammar a #1","origin":"adapted","explain_ar":"next month مستقبل، والنية مقررة ← is going to buy."},{"type":"mcq","q":"“I'm going to clean my room this afternoon. (I decided to clean it this morning.)” This sentence talks about:","options":["something we decide to do at the time of speaking","a timetable","a decision made before speaking"],"answer":2,"src":"WB 47","origin":"adapted","explain_ar":"قرر صباحاً، أي قبل الكلام ← going to."},{"type":"tf","statement":"We use be going to for actions that we have decided or intended to do before we speak.","answer":true,"src":"WB 47","origin":"book","explain_ar":"نص قاعدة الكتاب."},{"type":"tf","statement":"We use going to to make predictions when there is present evidence.","answer":true,"src":"WB 112","origin":"adapted","explain_ar":"من استعمالات going to في Grammar Bank."},{"type":"tf","statement":"We use be going to for something we decide to do at the time of speaking.","answer":false,"src":"WB 46, 112","origin":"adapted","explain_ar":"القرار لحظة الكلام يكون بـ will."}],"flags":[{"type":"book_typo","ar":"عنوان الصيغة في Grammar Bank مكتوب «5. Going» والصحيح «Going to» (تحته مباشرة: We use going to).","src":"WB 112"},{"type":"unsure","ar":"شرح مثال الكتاب «We're going to hire a bus. (We intend to go, …)» يتكلم عن go لا hire؛ الشرح لا يطابق الجملة. نقلناه كما هو.","src":"WB 112"},{"type":"unsure","ar":"بند الاختبار Joe … next month: الكتاب لم يعطِ جواباً، وis going to buy هو الأقرب (نية)، وis buying مقبول نحوياً كترتيب.","src":"WB 65 Progress Test 2 Grammar a #1"}]},{"id":"u6-present-continuous-future","name_en":"Present Continuous for the future","name_ar":"المضارع المستمر بمعنى المستقبل","branches":{"form":{"summary_ar":"المضارع المستمر بمعنى مستقبل: لشيء رتبناه مسبقاً لنفعله في المستقبل (موعد أو ترتيب ثابت).","structure":"S + am / is / are + V-ing (+ future time)","items":[{"ar":"ترتيب مسبق","en":"We use the Present Continuous for what someone has arranged to do in the future. e.g. We're having a party tomorrow evening.","src":"WB 111","kind":"book"},{"ar":"رتبناه في الماضي لنفعله في المستقبل","en":"We use the Present Continuous to talk about things we have arranged in the past to do in the future. e.g. A bank wrote to Steven and asked him to start work next week. He's starting a new job next week.","src":"WB 47","kind":"book"},{"ar":"ترتيب ثابت من SB","en":"The team manager is holding a party on our return.","src":"SB 62 ex.a #3","kind":"book"}]},"negative":{"structure":"S + am / is / are + not + V-ing","verb_change_ar":"not بعد am / is / are، والفعل يبقى V-ing. الكتاب لم يعطِ جملة منفية بهذا الاستعمال.","items":[{"ar":"نفي مثال الكتاب","en":"We aren't having a party tomorrow evening.","src":"WB 111","kind":"derived"}]},"question":{"structure":"(Wh-) + am / is / are + S + V-ing … ?","aux_ar":"am / is / are يتقدم على الفاعل بلا do.","items":[{"ar":"سؤال عن ترتيب الليلة","en":"Are you going to the party tonight?","src":"SB 100","kind":"book"},{"ar":"سؤال بـ What time + is","en":"What time is your plane taking off tomorrow?","src":"WB 48 ex.1 #4","kind":"book"}],"notes":[{"ar":"سؤال الكتاب عن الترتيب الثابت (جوابه الجملة 3، والكتاب يطلب أكثر من جملة)","en":"Which statements talk about a fixed arrangement?","src":"SB 62 ex.a","kind":"book"}]},"signals":{"keywords":["arranged","has arranged","arrangement","tomorrow evening","next week","on our return"],"items":[{"ar":"arranged ← مضارع مستمر","en":"John has arranged to hold a meeting tomorrow.","src":"SB 62 ex.b #3","kind":"book"}]}},"questions":[{"type":"fill","q":"John has arranged to hold a meeting tomorrow. John: ______ .","answers":["I'm holding a meeting tomorrow","I am holding a meeting tomorrow"],"src":"SB 62 ex.b #3","origin":"book","explain_ar":"arranged = ترتيب مسبق ← Present Continuous."},{"type":"mcq","q":"John has arranged to hold a meeting tomorrow. John: I ______ a meeting tomorrow.","options":["hold","am holding","will have held"],"answer":1,"src":"SB 62 ex.b #3","origin":"adapted","explain_ar":"ترتيب شخصي مسبق ← am holding."},{"type":"mcq","q":"“The team manager is holding a party on our return.” This statement talks about:","options":["a prediction","events continuing over a period of time in the future","a fixed arrangement"],"answer":2,"src":"SB 62 ex.a #3","origin":"adapted","explain_ar":"is holding للمستقبل = ترتيب ثابت."},{"type":"tf","statement":"We use the Present Continuous for what someone has arranged to do in the future.","answer":true,"src":"WB 111","origin":"book","explain_ar":"نص قاعدة الكتاب."},{"type":"tf","statement":"“He's starting a new job next week.” talks about something arranged in the past to do in the future.","answer":true,"src":"WB 47","origin":"book","explain_ar":"مثال الكتاب نفسه للمضارع المستمر بمعنى المستقبل."}],"flags":[{"type":"unsure","ar":"سؤال SB 62 ex.a «Which statements talk about a fixed arrangement?» بالجمع، فالجواب حسب الكتاب الجملتان 2 و3، مع أن الجملة 2 بـ going to وGrammar Bank يقول إن going to نية بلا ترتيب. لم نضع هذا كسؤال.","src":"SB 62 ex.a"},{"type":"unsure","ar":"تمرين WB 48 ex.1 يقول إن في ست جمل خطأ؛ الأخطاء الواضحة خمسة (1، 3، 5، 8، 9)، فالسادس على الأرجح #4 (What time is your plane taking off → does your plane take off، لأنه جدول). المضارع المستمر هنا صحيح نحوياً كترتيب، لذلك لم نجعله سؤالاً.","src":"WB 48 ex.1 #4"}]},{"id":"u6-present-simple-future","name_en":"Present Simple for a timetable (and after time words)","name_ar":"المضارع البسيط بمعنى المستقبل: الجداول وبعد أدوات الزمن","branches":{"form":{"summary_ar":"المضارع البسيط بمعنى مستقبل: للجداول والمواعيد الرسمية، وبعد أدوات الربط الزمنية (when, as soon as, before…)، وبعد what / who / which / whatever / wherever.","structure":"S + V1 / V1 + s  |  time word + S + V1, S + will + V0","items":[{"ar":"للجداول (قطار، طيران)","en":"We can use the Present Simple for the future when we are talking about a timetable, usually a public one such as a train/ flight timetable. e.g. The train leaves at seven o'clock tomorrow morning.","src":"WB 111","kind":"book"},{"ar":"جدول أو برنامج","en":"to talk about timetable or schedules: e.g. The train to the airport leaves in 20 minutes.","src":"WB 47","kind":"book"},{"ar":"بعد أدوات الربط الزمنية","en":"We use the Present Simple for the future after these linking words of time: after, as, as soon as, before, by the time, until, when. e.g. I must get to the bank before it closes.","src":"WB 111","kind":"book"},{"ar":"بعد الأدوات لا نستعمل will","en":"after conjunctions such as when, as soon as, after, before, until, as long as: e.g. Can you write the report before we hold the meeting? (not before we will hold the meeting)","src":"WB 47","kind":"book"},{"ar":"بعد what / who / which / whatever / wherever","en":"in clauses following what/ who/ which and whatever and wherever. e.g. I don't care what happens next year.","src":"WB 111","kind":"book"}]},"negative":{"structure":"S + don't / doesn't + V0","verb_change_ar":"في النفي don't / doesn't والفعل يعود مصدراً. وبعد أدوات الزمن لا نستعمل won't بل don't / doesn't.","items":[{"ar":"جدول منفي (جملة صحيحة في تمرين تصحيح الأخطاء)","en":"The bus doesn't arrive until 7.30 in the evening.","src":"WB 48 ex.1 #7","kind":"book"},{"ar":"تصحيح: بعد as long as لا نستعمل won't","en":"I'll be fine in the interview as long as they won't ask me technical questions. → … as long as they don't ask me technical questions.","src":"WB 48 ex.1 #3","kind":"derived"}]},"question":{"structure":"(Wh-) + do / does + S + V0 ?","aux_ar":"يحتاج do / does مضافاً، والفعل يعود مصدراً.","items":[{"ar":"سؤال عن موعد في جدول","en":"And when does the boat leave?","src":"SB 33","kind":"book"},{"ar":"سؤال Yes/No عن جدول","en":"Does the train leave at five?","src":"SB 111","kind":"book"},{"ar":"في السؤال أيضاً: will في الجملة الرئيسية والمضارع بعد when","en":"What will happen when people depend on intelligent machines?","src":"WB 83","kind":"book"}],"notes":[{"ar":"الكتاب يصحح صراحة استعمال will بعد before","en":"(not before we will hold the meeting)","src":"WB 47","kind":"book"}]},"signals":{"keywords":["timetable","schedule","after","as","as soon as","before","by the time","until","when","as long as","the moment","whatever","wherever"],"items":[{"ar":"timetable ← مضارع بسيط","en":"Emily's plane timetable says “Arrival 9.30”.","src":"SB 62 ex.b #2","kind":"book"},{"ar":"the moment تعامل معاملة when (التمرين يعدّ will بعدها خطأ)","en":"The moment I'll receive my results, I'll phone you.","src":"WB 48 ex.1 #9","kind":"derived"}]}},"questions":[{"type":"fill","q":"Emily's plane timetable says “Arrival 9.30”. Emily: The plane ______ .","answers":["arrives at 9.30"],"src":"SB 62 ex.b #2","origin":"book","explain_ar":"timetable ← Present Simple."},{"type":"fill","q":"Correct the verb: I'll be fine in the interview as long as they won't ask me technical questions.","answers":["don't ask","they don't ask"],"src":"WB 48 ex.1 #3","origin":"book","explain_ar":"بعد as long as نستعمل المضارع لا will / won't."},{"type":"fill","q":"Correct the verb: I'll hand in my notice for this job after I'll get the contract for my new one.","answers":["I get","get"],"src":"WB 48 ex.1 #5","origin":"book","explain_ar":"بعد after مضارع بسيط."},{"type":"fill","q":"Correct the verb: The moment I'll receive my results, I'll phone you.","answers":["I receive","receive"],"src":"WB 48 ex.1 #9","origin":"book","explain_ar":"بعد The moment (أداة زمن) مضارع بسيط."},{"type":"fill","q":"Correct the verb: I've got my schedule for the Japan trip. We will have flown to Tokyo at 10 a.m. on Monday, and then travel by train to Kyoto for one night.","answers":["We fly","fly","We are flying","are flying"],"src":"WB 48 ex.1 #8","origin":"book","explain_ar":"برنامج رحلة (schedule) ← fly، ويتوازى مع and then travel. المستقبل التام خطأ لأنه لا يوجد by + وقت."},{"type":"tf","statement":"My exams finish on 27th June.","answer":true,"src":"WB 48 ex.1 #2","origin":"book","explain_ar":"جدول امتحانات ← Present Simple صحيح."},{"type":"tf","statement":"I'll text you before we set off.","answer":true,"src":"WB 48 ex.1 #6","origin":"book","explain_ar":"بعد before مضارع بسيط ← صحيحة."},{"type":"tf","statement":"When I'll find the answer, I'll let you know.","answer":false,"src":"WB 48 ex.1 #1","origin":"book","explain_ar":"مثال الكتاب: الصحيح When I find."},{"type":"mcq","q":"Can you write the report before we ______ the meeting?","options":["hold","will hold","are going to hold"],"answer":0,"src":"WB 47","origin":"adapted","explain_ar":"بعد before مضارع بسيط، والكتاب كتب: not before we will hold."},{"type":"mcq","q":"If they …………… arrive late, they will have to get their own meal.","options":["do","had","will"],"answer":0,"src":"SB 81 Review 2 ex.2 #5","origin":"book","explain_ar":"بعد if بمعنى مستقبل نستعمل المضارع لا will؛ do هنا للتوكيد مع arrive."},{"type":"mcq","q":"What ………………. to do when you leave school?","options":["do you intend","will you intend","could you intend"],"answer":0,"src":"SB 82 Review 2 ex.2 #10","origin":"book","explain_ar":"النية حاضرة (intend بالمضارع)، وبعد when المضارع (leave)."}],"flags":[]},{"id":"u6-be-to-be-about-to","name_en":"Be to and be about to","name_ar":"be to و be about to","branches":{"form":{"summary_ar":"be to + المصدر لحدث مستقبلي مرتب رسمياً (كثير في الأخبار)، وbe about to + المصدر للمستقبل القريب جداً.","structure":"S + am / is / are + to + V0  |  S + am / is / are + about to + V0","items":[{"ar":"be to: ترتيب رسمي، كثير في نشرات الأخبار","en":"We use be to for a future event that is officially arranged. It is often used in news reports. e.g. The Queen is to visit Portugal in December.","src":"WB 111","kind":"book"},{"ar":"be about to: المستقبل القريب جداً","en":"We use be about to for the very near future. e.g. The plane is at the end of the runway. It is about to take off.","src":"WB 111","kind":"book"}]},"negative":{"structure":"S + am / is / are + not + to / about to + V0","verb_change_ar":"be (am / is / are) يتصرف مع الفاعل ويحمل not، والفعل بعد to يبقى مصدراً.","items":[{"ar":"الكتاب لم يعطِ أي جملة منفية بـ be to أو be about to؛ القاعدة العامة: not بعد be.","en":"","src":"WB 111","kind":"derived"}]},"question":{"structure":"Am / Is / Are + S + to / about to + V0 ?","aux_ar":"be يتقدم على الفاعل بلا do.","items":[{"ar":"الكتاب لم يعطِ سؤالاً بهذه الصيغة؛ القاعدة العامة: be يتقدم على الفاعل.","en":"","src":"WB 111","kind":"derived"}],"notes":[{"ar":"هذه الصيغة في Grammar Bank فقط، وليست في صندوق قواعد الوحدة (WB 46-47)","en":"3. Be to and be about to","src":"WB 111","kind":"book"}]},"signals":{"keywords":["officially arranged","news reports","very near future","at the end of the runway"],"items":[{"ar":"very near future ← be about to","en":"Suzan will have a big party in the very near future.","src":"SB 62 ex.b #4","kind":"book"},{"ar":"خبر رسمي ← be to","en":"The Queen is to visit Portugal in December.","src":"WB 111","kind":"book"}]}},"questions":[{"type":"fill","q":"Suzan will have a big party in the very near future. Suzan: ______ .","answers":["I'm about to have a big party","I am about to have a big party"],"src":"SB 62 ex.b #4","origin":"book","explain_ar":"very near future ← be about to."},{"type":"mcq","q":"Suzan will have a big party in the very near future. Suzan: I ______ have a big party.","options":["have had","am about to","had"],"answer":1,"src":"SB 62 ex.b #4","origin":"adapted","explain_ar":"المستقبل القريب جداً ← am about to + مصدر."},{"type":"tf","statement":"We use be about to for the very near future.","answer":true,"src":"WB 111","origin":"book","explain_ar":"نص قاعدة الكتاب."},{"type":"tf","statement":"We use be to for a future event that is officially arranged. It is often used in news reports.","answer":true,"src":"WB 111","origin":"book","explain_ar":"نص قاعدة الكتاب."},{"type":"tf","statement":"We use be about to for a future event that is officially arranged.","answer":false,"src":"WB 111","origin":"adapted","explain_ar":"الترتيب الرسمي بـ be to؛ وbe about to للمستقبل القريب جداً."}],"flags":[{"type":"book_typo","ar":"في الكتاب «It is oftenused in news reports» (oftenused ملتصقة)، والصحيح often used. كتبناها مصححة هنا.","src":"WB 111"}]},{"id":"u6-future-continuous","name_en":"Future Continuous","name_ar":"المستقبل المستمر","branches":{"form":{"summary_ar":"will be + V-ing: لحدث مستمر في وقت محدد في المستقبل أو على فترة في المستقبل، وللسؤال بأدب عن خطط الآخرين.","structure":"S + will be + V-ing","items":[{"ar":"الصيغة، وحدث مستمر على فترة","en":"will / won't be + verb + -ing. We use the Future Continuous to decide or predict events continuing over a period of time in the future: e.g. I'll be working on the report all next week.","src":"WB 47","kind":"book"},{"ar":"حدث مستمر في وقت محدد في المستقبل","en":"to talk about an action in progress at a specific time in the future. e.g. This time next week, I'll be doing my exams.","src":"WB 112","kind":"book"},{"ar":"صندوق الكتاب: حدث مستمر يقطعه حدث مستقبلي آخر","en":"I will be studying when you arrive. (continuous future action will continue to happen when another future action occurs)","src":"WB 112","kind":"book"},{"ar":"مثال SB","en":"When it goes into orbit, the spacecraft will be carrying 25 kilos of plutonium.","src":"SB 62 ex.a #4","kind":"book"}]},"negative":{"structure":"S + won't (will not) + be + V-ing","verb_change_ar":"not بعد will (won't)، وbe تبقى be مع كل الفاعلين، والفعل V-ing.","items":[{"ar":"صيغة الكتاب للإثبات والنفي","en":"will / won't be + verb + -ing","src":"WB 47","kind":"book"}]},"question":{"structure":"(Wh-) + will + S + be + V-ing ?","aux_ar":"will تتقدم على الفاعل، وbe + V-ing يبقيان بعده.","items":[{"ar":"سؤال عن خطط شخص","en":"How long will you be using this computer?","src":"WB 47","kind":"book"},{"ar":"سؤال مهذب عن خطط مستقبلية","en":"Will you be using the computer later on?","src":"WB 112","kind":"book"},{"ar":"سؤال عن وقت محدد","en":"What will you be doing this time tomorrow?","src":"SB 81 Review 2 ex.2 #1","kind":"book"}],"notes":[{"ar":"للسؤال عن خطط الآخرين بأدب","en":"to ask about someone's plans (WB 47) / to ask politely about future plans (WB 112)","src":"WB 47, 112","kind":"book"}]},"signals":{"keywords":["this time next week","this time tomorrow","at 8:30 this evening","all next week","for the next two years","when you arrive","later on"],"items":[{"ar":"this time tomorrow ← will be + V-ing","en":"What ………………. be doing this time tomorrow?","src":"SB 81 Review 2 ex.2 #1","kind":"book"},{"ar":"ساعة محددة في المستقبل ← will be + V-ing","en":"At 8:30 this evening I …………………(meet) my friend Tom at Yooooj Café.","src":"WB 66 Progress Test 2 Grammar a #4","kind":"book"}]}},"questions":[{"type":"mcq","q":"What ………………. be doing this time tomorrow?","options":["were you","have you","will you"],"answer":2,"src":"SB 81 Review 2 ex.2 #1","origin":"book","explain_ar":"this time tomorrow + be doing ← will you be doing."},{"type":"mcq","q":"……………. be buying the house or haven't you decided yet?","options":["Did you","Were you","Will you"],"answer":2,"src":"SB 81 Review 2 ex.2 #8","origin":"book","explain_ar":"سؤال عن خطط شخص ← Will you be + V-ing."},{"type":"mcq","q":"“When it goes into orbit, the spacecraft will be carrying 25 kilos of plutonium.” This statement talks about:","options":["a fixed arrangement","a future event that will finish before a specific time","events continuing over a period of time in the future"],"answer":2,"src":"SB 62 ex.a #4","origin":"adapted","explain_ar":"will be carrying = حدث مستمر في المستقبل."},{"type":"fill","q":"(will be / will have) And I ……… (probably go out) with the same friends too!","answers":["will probably be going out","'ll probably be going out"],"src":"WB 48 ex.2 #3","origin":"book","explain_ar":"حدث مستمر في المستقبل ← will be + going out، وprobably بعد will."},{"type":"fill","q":"(will be / will have) By the time I'm sixty, … everyone ……… (try) their best to adapt to new circumstances.","answers":["will be trying"],"src":"WB 48 ex.2 #5","origin":"book","explain_ar":"محاولة مستمرة في ذلك الوقت ← will be trying."},{"type":"fill","q":"(will be / will have) For example, I can't imagine that we ……… (use) cars","answers":["will be using"],"src":"WB 48 ex.2 #6","origin":"book","explain_ar":"حدث مستمر في وقت مستقبلي ← will be using."},{"type":"fill","q":"(will be / will have) People ……… (travel) in electric cars","answers":["will be travelling","will be traveling"],"src":"WB 48 ex.2 #8","origin":"book","explain_ar":"حدث مستمر في المستقبل ← will be travelling."},{"type":"fill","q":"(will be / will have) … or perhaps we ……… (walk) everywhere.","answers":["will be walking"],"src":"WB 48 ex.2 #9","origin":"book","explain_ar":"حدث مستمر في المستقبل ← will be walking."},{"type":"fill","q":"At 8:30 this evening I …………………(meet) my friend Tom at Yooooj Café.","answers":["will be meeting","'ll be meeting","am meeting","'m meeting"],"src":"WB 66 Progress Test 2 Grammar a #4","origin":"book","explain_ar":"ساعة محددة في المستقبل ← will be meeting (ويقبل am meeting كموعد مرتب)."},{"type":"fill","q":"Sami decides to use the new laptop for the next two years. Sami: ______ .","answers":["I'll be using the new laptop for the next two years","I will be using the new laptop for the next two years","I'll use the new laptop for the next two years","I will use the new laptop for the next two years"],"src":"SB 62 ex.b #5","origin":"book","explain_ar":"decides + فترة (for the next two years) ← Future Continuous: to decide … events continuing over a period of time (WB 47)."},{"type":"tf","statement":"We use the Future Continuous to talk about an action in progress at a specific time in the future.","answer":true,"src":"WB 112","origin":"book","explain_ar":"نص قاعدة الكتاب."},{"type":"tf","statement":"We use the Future Continuous to ask politely about future plans.","answer":true,"src":"WB 112","origin":"book","explain_ar":"نص قاعدة الكتاب: Will you be using the computer later on?"}],"flags":[{"type":"unsure","ar":"SB 62 ex.b #5 (Sami decides): الكلمة المسطّرة decides قد تقود إلى will (قرار لحظة الكلام) أو إلى will be using (WB 47: to decide … events continuing over a period). وضعنا الجوابين.","src":"SB 62 ex.b #5"},{"type":"unsure","ar":"بند الاختبار At 8:30 this evening: الأرجح will be meeting، ويصح am meeting كموعد مرتب؛ الكتاب بلا أجوبة.","src":"WB 66 Progress Test 2 Grammar a #4"}]},{"id":"u6-future-perfect","name_en":"Future Perfect","name_ar":"المستقبل التام","branches":{"form":{"summary_ar":"will have + التصريف الثالث: لحدث سيكون قد انتهى قبل وقت محدد في المستقبل، وغالباً مع by / before / in + مدة.","structure":"S + will have + V3 (past participle)","items":[{"ar":"الصيغة والاستعمال وكلماته","en":"will / won't have + past participle. We use the Future Perfect to talk about a future event that will finish before a specific time in the future, often with before, by + fixed time, or in + amount of time: e.g. By the end of the year, I will have given the same talk at 6 conferences! In a week's time, I'll have written the report.","src":"WB 47","kind":"book"},{"ar":"حدث يكتمل قبل نقطة زمنية في المستقبل","en":"We use the Future Perfect to talk about an action which will be completed before a point of time, in this case a point in the future. e.g. I'll have finished the report by Friday night.","src":"WB 112","kind":"book"},{"ar":"صندوق الكتاب","en":"He will have finished reading by the time you arrive. (future action will be completed by time another future action occurs)","src":"WB 112","kind":"book"},{"ar":"مثال SB","en":"By the time you get home, I will have cleaned the house from top to bottom.","src":"SB 62 ex.a #5","kind":"book"}]},"negative":{"structure":"S + won't (will not) + have + V3","verb_change_ar":"not بعد will، وhave تبقى have (لا تصبح has) مع كل الفاعلين، والفعل تصريف ثالث.","items":[{"ar":"صيغة الكتاب للإثبات والنفي","en":"will / won't have + past participle","src":"WB 47","kind":"book"}]},"question":{"structure":"(Wh-) + will + S + have + V3 ?","aux_ar":"will تتقدم على الفاعل، وhave + V3 يبقيان بعده. الكتاب لم يعطِ سؤالاً بالمستقبل التام.","items":[{"ar":"سؤال مشتق من مثال الكتاب","en":"Will you have finished the report by Friday night?","src":"WB 112","kind":"derived"}],"notes":[{"ar":"الكلمات المرافقة حسب الكتاب","en":"often with before, by + fixed time, or in + amount of time","src":"WB 47","kind":"book"},{"ar":"تمرين الكتاب يعدّ will have flown خطأ في برنامج رحلة (لا يوجد by + وقت)","en":"We will have flown to Tokyo at 10 a.m. on Monday …","src":"WB 48 ex.1 #8","kind":"book"}]},"signals":{"keywords":["by + time","by the time","by the end of the year","by then","by that time","before","in a week's time","by Friday night"],"items":[{"ar":"By the time ← will have + V3","en":"By the time I'm sixty, I expect that nearly everything ……… (change)","src":"WB 48 ex.2 #4","kind":"book"},{"ar":"By the end of this year ← will have + V3","en":"By the end of this year I ……………(drive) more than 1000 km. with my car.","src":"WB 66 Progress Test 2 Grammar a #5","kind":"book"}]}},"questions":[{"type":"fill","q":"(will be / will have) By that time, I ……… (finish) my studies","answers":["will have finished"],"src":"WB 48 ex.2 #1","origin":"book","explain_ar":"By that time ← will have + V3."},{"type":"fill","q":"(will be / will have) … and, who knows, perhaps I ……… (find) a good job.","answers":["will have found"],"src":"WB 48 ex.2 #2","origin":"book","explain_ar":"حدث يكتمل قبل ذلك الوقت ← will have found."},{"type":"fill","q":"(will be / will have) By the time I'm sixty, I expect that nearly everything ……… (change)","answers":["will have changed"],"src":"WB 48 ex.2 #4","origin":"book","explain_ar":"By the time ← will have changed."},{"type":"fill","q":"(will be / will have) … because by then most of the oil in the world ……… (run out).","answers":["will have run out"],"src":"WB 48 ex.2 #7","origin":"book","explain_ar":"by then ← will have run out (run تصريفها الثالث run)."},{"type":"fill","q":"(will be / will have) I hope that scientists ……… (solve) pollution problem, but who knows!","answers":["will have solved"],"src":"WB 48 ex.2 #10","origin":"book","explain_ar":"حدث يكتمل قبل ذلك الوقت (by then في سياق النص) ← will have solved."},{"type":"fill","q":"(will be / will have) Perhaps some other worse problems ……… (come) along by then!","answers":["will have come"],"src":"WB 48 ex.2 #11","origin":"book","explain_ar":"by then ← will have come."},{"type":"fill","q":"By the end of this year I ……………(drive) more than 1000 km. with my car.","answers":["will have driven","'ll have driven"],"src":"WB 66 Progress Test 2 Grammar a #5","origin":"book","explain_ar":"By the end of this year ← will have driven."},{"type":"mcq","q":"By the end of this year I ______ more than 1000 km. with my car.","options":["will have driven","will be driving","am driving"],"answer":0,"src":"WB 66 Progress Test 2 Grammar a #5","origin":"adapted","explain_ar":"by + نهاية فترة ← المستقبل التام."},{"type":"mcq","q":"“By the time you get home, I will have cleaned the house from top to bottom.” This statement talks about
