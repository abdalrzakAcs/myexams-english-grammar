<style>
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --line:#E2E8F0; --line2:#F1F5F9; --rail:#CBD5E1;
  --ink:#0F172A; --ink2:#334155; --mute:#64748B;
  --pri:#FF6B35; --pri-d:#C2410C; --pri-t:#FFF1EA;
  --c1:#FF6B35; --c1d:#C2410C; --c1t:#FFF4EE;
  --c2:#3B82F6; --c2d:#1D4ED8; --c2t:#EFF6FF;
  --c3:#7C3AED; --c3d:#6D28D9; --c3t:#F5F3FF;
  --c4:#0D9488; --c4d:#0F766E; --c4t:#F0FDFA;
  --ok:#15803D; --ok-t:#F0FDF4; --ok-b:#86EFAC;
  --bad:#B91C1C; --bad-t:#FEF2F2; --bad-b:#FCA5A5;
  --warn:#F59E0B; --warn-t:#FFFBEB; --warn-b:#FCD34D; --warn-d:#78350F;
  --focus:#2563EB;
  --font: system-ui, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[dir=ltr]{text-align:left}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* رأس الصفحة */
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{padding-top:18px;padding-bottom:14px}
.brand{font-weight:800;color:var(--pri-d);font-size:14px;letter-spacing:.02em}
h1{margin:2px 0 0;font-size:24px;line-height:1.3;font-weight:800}
.sub{color:var(--mute);font-size:14.5px;margin-top:2px}
.search{display:flex;gap:8px;margin-top:14px}
.search input{flex:1;min-width:0;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:0 14px;font-size:16px}
.search input:focus{border-color:var(--ink2);background:#fff}
.search input::-webkit-search-cancel-button{display:none}
.btn-ghost{min-height:48px;min-width:64px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:600;color:var(--ink2)}

/* شرائح التنقل */
.nav{padding-top:14px}
.row{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:#fff;color:var(--ink2);font-size:15px;font-weight:600;white-space:nowrap;line-height:1.35}
.chip[aria-current=true]{background:var(--pri-t);border-color:var(--pri);color:#9A3412}
.chip .muted{color:var(--mute);font-weight:500}
.chip[aria-current=true] .muted{color:#9A3412}
.rchip{display:flex;flex-direction:column;align-items:flex-start;border-radius:14px;min-height:56px;padding:7px 14px;text-align:right}
.rchip .en{font-weight:700}
.rchip .ar{font-size:13.5px;font-weight:500;color:var(--mute)}
.rchip[aria-current=true] .ar{color:#9A3412}
.rchip .prog{font-size:12.5px;font-weight:600;color:var(--mute)}

/* رأس الوحدة */
.unit-head{padding:10px 0 6px}
.kicker{color:var(--mute);font-size:14px;font-weight:600}
h2{margin:2px 0 0;font-size:22px;line-height:1.35;font-weight:800}
.pages{color:var(--mute);font-size:14px;margin-top:2px}
.exam{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.exam .lab{font-size:13.5px;color:var(--mute);font-weight:600;margin-inline-end:8px}
.exam .lv{display:inline-block;font-weight:800;font-size:14px;padding:2px 12px;border-radius:999px}
.lv-3 .lv{background:var(--pri-d);color:#fff}
.lv-2 .lv{background:#FED7C3;color:#9A3412}
.lv-1 .lv{background:#FFF1EA;color:#9A3412;box-shadow:inset 0 0 0 1px #FDBA9A}
.lv-0 .lv{background:var(--line2);color:var(--ink2)}
.exam p{margin-top:8px;font-size:14.5px;color:var(--ink2)}
.rules-row{margin-top:14px}

/* الخريطة */
.map{position:relative;margin-top:14px}
.node{position:relative;z-index:1;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:16px;text-align:center}
.node .en{font-size:23px;font-weight:800;line-height:1.3}
.node .ar{font-size:16px;color:var(--ink2);margin-top:2px}
.node .formula{background:var(--line2);margin:12px 0 0;text-align:center}
.formula{direction:ltr;text-align:left;border-radius:9px;padding:8px 12px;margin:10px 0;font-weight:650;font-size:15.5px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.br{position:relative;z-index:1;background:#fff;border:1px solid var(--line);border-radius:14px}
.b1{--bc:var(--c1);--bcd:var(--c1d);--bct:var(--c1t)}
.b2{--bc:var(--c2);--bcd:var(--c2d);--bct:var(--c2t)}
.b3{--bc:var(--c3);--bcd:var(--c3d);--bct:var(--c3t)}
.b4{--bc:var(--c4);--bcd:var(--c4d);--bct:var(--c4t)}
.br .formula{background:var(--bct)}
.br-h{margin:0;font-size:16px;line-height:1.4}
.br-h .in,.br-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 14px;text-align:right;font-weight:800}
.br-btn{border:0;background:none;border-radius:14px}
.br-n{flex:0 0 auto;font-size:24px;font-weight:800;color:var(--bcd);line-height:1;min-width:20px;text-align:center}
.br-t{flex:1}
.chev{flex:0 0 auto;width:10px;height:10px;border-inline-start:2.5px solid var(--mute);border-bottom:2.5px solid var(--mute);transform:rotate(-45deg);margin:0 4px 4px}
.br-btn[aria-expanded=true] .chev{transform:rotate(135deg);margin-bottom:-4px}
.br-body{padding:0 14px 14px}
.br-body[hidden]{display:none}
.sum{color:var(--ink2);margin-bottom:4px}
.kv{color:var(--ink2);font-size:15px;margin:6px 0 2px}
.kv b{color:var(--ink)}
.items{list-style:none;margin:6px 0 0;padding:0}
.it{padding:9px 0;border-top:1px dashed var(--line)}
.items .it:first-child{border-top:0}
.it-ar{font-size:15px;color:var(--ink2)}
.it-en{font-size:15.5px;color:var(--ink);font-weight:550;margin-top:2px}
.src{display:inline-block;margin-top:5px;font-size:12.5px;font-weight:600;line-height:1.5;padding:1px 9px;border-radius:999px;background:var(--line2);color:#475569}
.src.derived{background:#fff;border:1px dashed var(--rail);color:var(--mute)}
.notes-h{margin:12px 0 0;font-size:14.5px;font-weight:800;color:var(--bcd)}
.kw{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin:6px 0 2px}
.kw span{padding:3px 11px;border-radius:999px;background:var(--bct);color:var(--bcd);font-weight:700;font-size:14.5px;border:1px solid var(--bct)}
.links{display:none}

/* موبايل: شجرة عمودية */
.tree{position:relative;margin-top:16px;padding-right:30px}
.tree .br{margin-bottom:12px;border-inline-start:4px solid var(--bc)}
.tree .br::before{content:"";position:absolute;right:-24px;top:-17px;bottom:-14px;width:2px;background:var(--rail)}
.tree .br:last-child{margin-bottom:0}
.tree .br:last-child::before{bottom:auto;height:44px}
.tree .br::after{content:"";position:absolute;right:-22px;top:26px;width:18px;height:2px;background:var(--bc)}
.knot{position:absolute;right:-30px;top:20px;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid var(--bc);z-index:2}

/* كمبيوتر: خريطة حقيقية */
@media (min-width:900px){
  .map.desk{display:grid;grid-template-columns:minmax(0,1fr) 250px minmax(0,1fr);grid-template-areas:"b1 node b4" "b2 node b3";gap:26px 70px;align-items:start;margin-top:20px}
  .map.desk .node{grid-area:node;align-self:start;position:sticky;top:16px}
  .map.desk .b1{grid-area:b1}.map.desk .b2{grid-area:b2}.map.desk .b3{grid-area:b3}.map.desk .b4{grid-area:b4}
  .map.desk .br{border-top:4px solid var(--bc)}
  .map.desk .links{display:block;position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:0}
  .row{flex-wrap:wrap;overflow:visible;margin:0;padding:4px 0 8px}
  h1{font-size:28px}
}

/* ملاحظات صفرا */
.flags{margin-top:16px;display:grid;gap:8px}
.flag{background:var(--warn-t);border:1px solid var(--warn-b);border-inline-start:4px solid var(--warn);border-radius:12px;padding:10px 12px;color:var(--warn-d);font-size:14.5px}
.flag b{display:block;color:var(--warn-d)}
.flag .src{background:#fff}

/* الأسئلة */
.qs{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.qs-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.qs-top h3{margin:0;font-size:18px;flex:1 1 100%}
.score{display:flex;gap:14px;font-size:14px;color:var(--mute);flex:1}
.score b{font-size:19px;color:var(--ink);margin-inline-end:3px}
.btn-line{min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:700;color:var(--ink2)}
.tabs{display:flex;margin-top:12px;border-bottom:1px solid var(--line)}
.tab{flex:1;min-height:48px;padding:6px 4px;border:0;border-bottom:3px solid transparent;background:none;font-weight:700;font-size:15px;color:var(--mute);margin-bottom:-1px;line-height:1.3}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .cnt{display:inline-block;min-width:22px;padding:0 6px;margin-inline-start:4px;border-radius:999px;background:var(--line2);color:var(--ink2);font-size:13px}
.panel[hidden]{display:none}
.qc{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.qn{font-size:13px;color:var(--mute);font-weight:700}
.qt{font-size:17px;font-weight:550;margin-top:4px;line-height:1.55}
.gap{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink2);height:1em;vertical-align:-2px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;margin-top:8px;padding:9px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16.5px;text-align:left;color:var(--ink)}
.opt .txt{flex:1}
.opt .mk,.fill .mk{font-weight:900;font-size:18px;line-height:1}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.qc.done .opt:disabled{opacity:.6}
.qc.done .opt.right,.qc.done .opt.wrong{opacity:1}
.opt.right{border-color:var(--ok);background:var(--ok-t);color:#14532D}
.opt.right .mk{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-t);color:#7F1D1D}
.opt.wrong .mk{color:var(--bad)}
.tf{display:flex;gap:10px}
.tf .opt{justify-content:center;text-align:center;font-weight:700}
.fill{display:flex;gap:8px;margin-top:10px;align-items:center}
.fill input{flex:1;min-width:0;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:16.5px;direction:ltr;text-align:left;background:#fff}
.fill input:read-only{background:var(--bg)}
.fill.right input{border-color:var(--ok);background:var(--ok-t);color:#14532D}
.fill.wrong input{border-color:var(--bad);background:var(--bad-t);color:#7F1D1D}
.fill.right .mk{color:var(--ok)}
.fill.wrong .mk{color:var(--bad)}
.btn-ink{min-height:48px;padding:0 18px;border:0;border-radius:12px;background:#1E293B;color:#fff;font-weight:700}
.btn-ink:disabled{background:#94A3B8;cursor:default}
.hint{font-size:13.5px;color:var(--bad);margin-top:6px}
.fb{margin-top:10px;padding:10px 12px;border-radius:12px;border-inline-start:4px solid;font-size:15px}
.fb.ok{background:var(--ok-t);border-color:var(--ok)}
.fb.bad{background:var(--bad-t);border-color:var(--bad)}
.fb-h{font-weight:800}
.fb.ok .fb-h{color:var(--ok)}
.fb.bad .fb-h{color:var(--bad)}
.fb-ans{margin-top:2px;color:var(--ink)}
.fb-ans span{font-weight:700}
.fb-ex{margin-top:4px;color:var(--ink2)}
.fb-src{margin-top:4px;font-size:13px;color:var(--mute)}
.empty{color:var(--mute);margin-top:12px}

.pager{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
.pager button{flex:1;max-width:48%}

/* البحث */
.results{padding-top:14px}
.results[hidden]{display:none}
.res-count{color:var(--mute);font-size:14px;margin:0 0 8px}
.res{display:block;width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:44px}
.res-name{display:block;font-weight:800}
.res-unit{display:block;color:var(--mute);font-size:13.5px;margin-top:1px}
.res-snip{display:block;margin-top:6px;font-size:15px;color:var(--ink2)}
.res-lab{color:var(--mute);font-size:13px;font-weight:700;margin-inline-end:6px}
mark{background:#FEF08A;color:inherit;border-radius:3px;padding:0 2px}
body.searching .nav,body.searching main{display:none}

.foot{margin-top:40px;border-top:1px solid var(--line);background:#fff;color:var(--mute);font-size:14px;text-align:center;padding:22px 16px 30px}
@media (prefers-reduced-motion:no-preference){.chev{transition:transform .15s}}
</style>
</head>

:"book"}]},"question":{"structure":"Do / Does + S + V0 ?","aux_ar":"نضيف فعلاً مساعداً غير موجود في الجملة: Do أو Does في أول السؤال، ويرجع الفعل الأساسي مصدراً.","items":[{"ar":"مثال الكتاب.","en":"Does he study law?","src":"WB 105","kind":"book"},{"ar":"سؤال من تمرين الكتاب بعد التصحيح (Are you liking ← Do you like) لأن like فعل حالة.","en":"Do you like films?","src":"WB 5 ex.a #13","kind":"derived"}],"notes":[{"ar":"المضارع البسيط للحقائق والأوضاع الطويلة والأفعال المتكررة، والمضارع المستمر لما يحدث وقت الكلام أو لفترة محدودة حول الآن.","en":"We use the Present Simple for situations that exist over a long time, and for actions that are repeated. e.g. John works for an advertising company.","src":"WB 106","kind":"book"},{"ar":"أفعال التفكير والشعور تأتي بالمضارع البسيط.","en":"We use the Present Simple with thinking and feeling verbs. e.g. I don't know which train to catch.","src":"WB 106","kind":"book"},{"ar":"have بالمضارع البسيط للملكية، وthink بالمضارع البسيط للتعبير عن الرأي.","en":"We use have in the Present Simple to talk about possessions. e.g. I have a red car. We use think in the Present Simple to express opinions: e.g. I think the situation will get better.","src":"WB 106","kind":"book"}]},"signals":{"keywords":["always","generally","normally","usually","often","sometimes","rarely","never","every day","every evening"],"items":[{"ar":"كلمات التكرار والوقت تدل على عادة، فنستعمل المضارع البسيط.","en":"(Words that describe how often or when are often used: always, generally, normally, usually, often, sometimes, rarely, never, every day, every evening…)","src":"WB 105","kind":"book"},{"ar":"every morning في رسالة Jane تعني روتيناً يومياً، فالصحيح get up لا are getting up.","en":"We are getting up at seven o'clock every morning. (→ get up)","src":"WB 5 ex.a #1","kind":"derived"},{"ar":"often مع ظاهرة طبيعية تتكرر.","en":"Tropical storms often occur in the Caribbean.","src":"WB 34 Grammar a #3","kind":"book"}]}},"questions":[{"type":"mcq","q":"Tropical storms often ………. in the Caribbean.","options":["occur","will occur","are occurring","have occurred"],"answer":0,"src":"WB 34 Progress Test 1 Grammar a #3","origin":"book","explain_ar":"often تدل على حدث يتكرر، فنستعمل المضارع البسيط."},{"type":"mcq","q":"Suzan …………………… trying to pass her driving test but fails every time.","options":["kept","is keeping","keeps"],"answer":2,"src":"SB 47 Review 1 ex.1 #5","origin":"book","explain_ar":"الجملة عن تكرار (every time) والفعل الثاني fails بالمضارع البسيط، فالصحيح keeps."},{"type":"mcq","q":"We ………………… at seven o'clock every morning, and we have coffee.","options":["are getting up","have got up","get up"],"answer":2,"src":"WB 5 ex.a #1","origin":"adapted","explain_ar":"every morning تدل على عادة يومية، فنستعمل المضارع البسيط get up."},{"type":"tf","statement":"I leave the flat at eight and walk to the university.","answer":true,"src":"WB 5 ex.a #3","origin":"book","explain_ar":"روتين يومي، والمضارع البسيط صحيح هنا (نضع إشارة ✓)."},{"type":"tf","statement":"On Saturday afternoons, I am playing tennis with my friends, or I go to the cinema.","answer":false,"src":"WB 5 ex.a #10","origin":"book","explain_ar":"On Saturday afternoons عادة متكررة، فالصحيح I play."},{"type":"tf","statement":"We use the Present Simple to give instructions or directions.","answer":true,"src":"WB 105","origin":"book","explain_ar":"من استعمالات المضارع البسيط في الكتاب: to give instructions or directions."},{"type":"fill","q":"Correct the verb: I am finishing classes at five, and I arrive home at six.","answers":["finish","I finish"],"src":"WB 5 ex.a #4","origin":"book","explain_ar":"عادة يومية في رسالة Jane، فنستعمل المضارع البسيط finish."},{"type":"fill","q":"He ____ (study) law.","answers":["studies"],"src":"WB 105","origin":"adapted","explain_ar":"مع he نضيف ies بعد حذف y لأن قبلها حرفاً ساكناً."},{"type":"fill","q":"He ____ (not / study) medicine.","answers":["doesn't study","does not study"],"src":"WB 105","origin":"adapted","explain_ar":"النفي مع he بـ doesn't، ويرجع الفعل مصدراً بلا s."},{"type":"fill","q":"____ (he / study) law?","answers":["Does he study"],"src":"WB 105","origin":"adapted","explain_ar":"السؤال بـ Does مع he، والفعل بعدها مصدر بلا s."}],"flags":[]},{"id":"u1-present-continuous","name_en":"Present Continuous and State Verbs","name_ar":"المضارع المستمر وأفعال الحالة","branches":{"form":{"summary_ar":"نستعمله لما يحدث لحظة الكلام، وللأوضاع المؤقتة، وللاتجاهات والأوضاع المتغيرة، ولأفعال تتكرر أكثر من المتوقع للتعبير عن الحسد أو الانتقاد. ولا يأتي عادةً مع أفعال الحالة (state verbs).","structure":"S + am / is / are + V-ing","items":[{"ar":"صيغة الإثبات.","en":"He is studying French now.","src":"WB 105","kind":"book"},{"ar":"للأوضاع المؤقتة.","en":"He's studying really hard for his exams.","src":"WB 105","kind":"book"},{"ar":"لأفعال تحدث في هذه اللحظة.","en":"I'm waiting for my friends.","src":"WB 105","kind":"book"},{"ar":"للاتجاهات والأوضاع المتغيرة.","en":"The price of petrol is rising dramatically.","src":"WB 105","kind":"book"},{"ar":"لأفعال تتكرر أكثر من المتوقع، للتعبير عن الحسد أو الانتقاد، مع always, constantly, continually, forever.","en":"My roommate's always throwing his cloths on the floor.","src":"WB 105","kind":"book"},{"ar":"لأفعال قيد الحدوث وقت الكلام.","en":"Look, the bus is coming.","src":"WB 106","kind":"book"},{"ar":"لأمور تستمر فترة محدودة حول الآن.","en":"He's living in London.","src":"WB 106","kind":"book"},{"ar":"مخطط الكتاب: فعل بدأ في الماضي وقد يستمر إلى المستقبل.","en":"I am studying right now. (action began in past, may continue into future)","src":"WB 105","kind":"book"},{"ar":"إملاء ing: الكتاب يصحّح geting إلى getting (مضاعفة الحرف الأخير).","en":"How are you geting (getting) on, Simon?","src":"SB 12 ex.a","kind":"book"}]},"negative":{"structure":"S + am / is / are + not + V-ing","verb_change_ar":"نضع not بعد am/is/are (isn't / aren't)، والفعل يبقى بصيغة V-ing ولا يتغير.","items":[{"ar":"مثال الكتاب.","en":"He is not studying French now.","src":"WB 105","kind":"book"},{"ar":"نفي بالمستمر من تمرين الكتاب، وهو خطأ لأن understand فعل حالة؛ الصحيح I don't understand.","en":"I'm not understanding the words!","src":"WB 5 ex.a #12","kind":"book"}]},"question":{"structure":"Am / Is / Are + S + V-ing ?","aux_ar":"لا نضيف فعلاً مساعداً جديداً: am/is/are موجود في الجملة، فنقدّمه على الفاعل.","items":[{"ar":"مثال الكتاب.","en":"Is he studying French now?","src":"WB 105","kind":"book"},{"ar":"أسئلة صحيحة من تمرين الكتاب.","en":"What are you doing? Are you working hard at the moment?","src":"SB 12 ex.a #7","kind":"book"},{"ar":"فعل حالة بالمستمر لأن معناه صار مؤقتاً (الآن).","en":"What are you thinking about? (now)","src":"WB 106","kind":"book"}],"notes":[{"ar":"لا نستعمل المضارع المستمر عادةً مع أفعال الحالة، لأن معناها حقيقة عامة لا شيء مؤقت. وهي أفعال التفكير والمشاعر والحواس والملكية والوصف.","en":"The Present Continuous is not normally used with state verbs because the meaning of the verb itself is a general truth rather than something temporary. These verbs describe thoughts, feelings, senses, possessions and description.","src":"WB 106","kind":"book"},{"ar":"أفعال التفكير.","en":"thought: believe, think, agree, disagree, remember, forget, suppose, understand, know. e.g. I assume he's too busy to help me.","src":"WB 106","kind":"book"},{"ar":"أفعال المشاعر.","en":"feelings: like, love, hate, mind, prefer, want, enjoy, feel. e.g. I prefer coffee to tea.","src":"WB 106","kind":"book"},{"ar":"أفعال الحواس.","en":"senses: feel, hear, see, smell, taste. e.g. The pizza smells delicious.","src":"WB 106","kind":"book"},{"ar":"أفعال الملكية.","en":"possessions: have, own, belong. e.g. My uncle owns a villa in Damascus countryside.","src":"WB 106","kind":"book"},{"ar":"أفعال الوصف.","en":"description: appear, look, look like, resemble, seem, sound. e.g. He really looks like his father.","src":"WB 106","kind":"book"},{"ar":"بعض أفعال الحالة تأتي بالمستمر إذا صار معناها مؤقتاً.","en":"Some state verbs can be used in the continuous form when the meaning is temporary. e.g. What are you thinking about? (now) I think you should tell the truth. (my opinion, not a temporary action)","src":"WB 106","kind":"book"},{"ar":"have وthink بالمستمر عندما تدلّان على نشاط لا على ملكية أو رأي.","en":"We use have and think in the Present Continuous to talk about actions: e.g. I'm having fun. I'm thinking about starting a new job.","src":"WB 106","kind":"book"},{"ar":"الكتاب يشطب هذه الجملة لأن know فعل حالة.","en":"We don't usually use the Present Continuous with thinking and feeling verbs: I'm knowing someone who lives in London. (crossed out in the book)","src":"WB 106","kind":"book"}]},"signals":{"keywords":["now","right now","at the moment","Look","this month","always","constantly","continually","forever"],"items":[{"ar":"now / at the moment تدلان على فعل يحدث وقت الكلام.","en":"At the moment, I eat breakfast in the kitchen of our flat. (→ am eating)","src":"WB 5 ex.a #7","kind":"derived"},{"ar":"this month تدل على وضع مؤقت حول الآن.","en":"This month I work very hard for my first exams. (→ am working)","src":"WB 5 ex.a #6","kind":"derived"},{"ar":"Look تلفت الانتباه إلى شيء يحدث الآن.","en":"Look, the bus is coming.","src":"WB 106","kind":"book"},{"ar":"always, constantly, continually, forever مع المستمر للتذمر أو الانتقاد (لا للعادة العادية).","en":"My roommate's always throwing his cloths on the floor.","src":"WB 105","kind":"book"},{"ar":"إذا كان الفعل من أفعال الحالة (like, know, understand, want...) نستعمل المضارع البسيط حتى لو كان المعنى الآن.","en":"We're liking Egypt. (→ We like) / I'm knowning your exams start tomorrow. (→ I know)","src":"SB 12 ex.a #5, #8","kind":"derived"}]}},"questions":[{"type":"mcq","q":"Please don't make so much noise. I ………. to work.","options":["'m trying","try","tried","has tried"],"answer":0,"src":"WB 34 Progress Test 1 Grammar a #4","origin":"book","explain_ar":"الفعل يحدث الآن وقت الكلام (الضجيج يزعجني الآن)، فنستعمل المضارع المستمر."},{"type":"mcq","q":"I ………………………. complete silence now while I try this experiment.","options":["am wanting","want","have wanted"],"answer":1,"src":"SB 47 Review 1 ex.1 #6","origin":"book","explain_ar":"want فعل حالة لا يأتي بالمستمر حتى مع now، فنستعمل المضارع البسيط."},{"type":"mcq","q":"I can't leave now. I ………………………………… for an important client.","options":["was waiting","am waiting","have waited"],"answer":1,"src":"SB 47 Review 1 ex.1 #7","origin":"book","explain_ar":"now: فعل مستمر في هذه اللحظة، فنستعمل am waiting."},{"type":"tf","statement":"I'm knowing someone who lives in London.","answer":false,"src":"WB 106","origin":"book","explain_ar":"know فعل حالة لا يأتي بالمستمر عادةً؛ الصحيح I know."},{"type":"tf","statement":"John is swimming in the pool.","answer":true,"src":"SB 12 ex.a #2","origin":"book","explain_ar":"فعل يحدث الآن والإملاء صحيح، فنضع إشارة ✓."},{"type":"tf","statement":"Some state verbs can be used in the continuous form when the meaning is temporary.","answer":true,"src":"WB 106","origin":"book","explain_ar":"ملاحظة الكتاب: What are you thinking about? (now)."},{"type":"fill","q":"Correct the verb: This month I work very hard for my first exams.","answers":["am working","'m working","I am working","I'm working"],"src":"WB 5 ex.a #6","origin":"book","explain_ar":"this month وضع مؤقت حول الآن، فنستعمل المضارع المستمر."},{"type":"fill","q":"Correct the verb: At the moment, I eat breakfast in the kitchen of our flat.","answers":["am eating","'m eating","I am eating","I'm eating"],"src":"WB 5 ex.a #7","origin":"book","explain_ar":"At the moment تدل على فعل يحدث الآن."},{"type":"fill","q":"Correct the spelling or the tense: I'm siting in the Nile Hotel.","answers":["sitting","I'm sitting"],"src":"SB 12 ex.a #1","origin":"book","explain_ar":"الخطأ إملائي: sit فعل قصير ينتهي بحرف ساكن قبله حرف متحرك قصير، فنضاعف الحرف الأخير ← sitting."},{"type":"fill","q":"Correct the spelling or the tense: We're liking Egypt.","answers":["We like","like"],"src":"SB 12 ex.a #5","origin":"book","explain_ar":"like من أفعال المشاعر (state verbs)، فنستعمل المضارع البسيط."},{"type":"fill","q":"Correct the spelling or the tense: I'm understanding some of the things that people say.","answers":["I understand","understand"],"src":"SB 12 ex.a #12","origin":"book","explain_ar":"understand من أفعال التفكير (state verbs)، فنستعمل المضارع البسيط."},{"type":"fill","q":"Correct the verb: Are you liking films?","answers":["Do you like","Do you like films?"],"src":"WB 5 ex.a #13","origin":"book","explain_ar":"like فعل حالة، فالسؤال بالمضارع البسيط مع Do."}],"flags":[{"type":"book_typo","ar":"مثال الكتاب «his cloths on the floor»، والمقصود clothes (ملابس). تركنا الجملة كما هي.","src":"WB 105"}]},{"id":"u1-present-perfect-simple","name_en":"Present Perfect Simple","name_ar":"المضارع التام البسيط","branches":{"form":{"summary_ar":"يُظهر علاقة بين الماضي والحاضر: لحدث في الماضي دون ذكر وقته بالضبط، أو لحدث في الماضي له نتيجة واضحة في الحاضر، أو لوضع حاضر بدأ في الماضي (غالباً مع for/since).","structure":"S + has / have + past participle (V3)","items":[{"ar":"صيغة الإثبات.","en":"The aircraft has landed safely.","src":"WB 108","kind":"book"},{"ar":"حدث في الماضي له نتيجة واضحة في الحاضر.","en":"I've seen this film before. I don't want to see it again now.","src":"WB 108","kind":"book"},{"ar":"وضع حاضر بدأ في الماضي، غالباً مع for/since.","en":"He's worked for the same company for two years. (He's worked there till now)","src":"WB 108","kind":"book"},{"ar":"مخطط الكتاب: حدث ماضٍ بوقت غير محدد.","en":"I have studied Chapter 1. (past action with indefinite time span)","src":"WB 108","kind":"book"},{"ar":"نتيجة ظاهرة الآن على الشيء (العشب مقصوص).","en":"Is the lawn finished? Yes, George has cut the grass.","src":"SB 13 ex.b example","kind":"book"}]},"negative":{"structure":"S + has / have + not + past participle","verb_change_ar":"نضع not بعد has/have (hasn't / haven't)، والفعل يبقى تصريفاً ثالثاً (V3) ولا يتغير.","items":[{"ar":"مثال الكتاب.","en":"The aircraft hasn't landed safely.","src":"WB 108","kind":"book"},{"ar":"مثال من تمرين الكتاب مع yet.","en":"we haven't decided anything yet.","src":"WB 6 ex.c example","kind":"book"}]},"question":{"structure":"Has / Have + S + past participle ?","aux_ar":"لا نضيف do/does/did: has/have موجود في الجملة، فنقدّمه على الفاعل ويبقى الفعل V3.","items":[{"ar":"مثال الكتاب.","en":"Has the aircraft landed safely?","src":"WB 108","kind":"book"},{"ar":"مثال من تمرين الكتاب مع ever.","en":"Have you ever been to Canada?","src":"WB 5 ex.b example","kind":"book"}],"notes":[{"ar":"نستعمل المضارع التام البسيط عندما نريد إظهار علاقة بين الحاضر والماضي.","en":"We use the Present Perfect Simple when we want to show a link between the present and the past.","src":"WB 108","kind":"book"},{"ar":"المضارع التام البسيط يقول كم مرة، ويركّز على النتيجة أو اكتمال النشاط.","en":"says how many times: I've read three articles. / focuses on the result or completion of the activity: e.g. I've written an article. (the article is finished but we don't know when.)","src":"WB 109","kind":"book"},{"ar":"المضارع التام = قبل الآن (before now).","en":"That man looks familiar. I've seen him somewhere before.","src":"WB 110","kind":"book"}]},"signals":{"keywords":["ever","never","before","up to now","so far","for","since","just","yet"],"items":[{"ar":"هذه الكلمات تأتي كثيراً مع المضارع التام عندما لا نذكر وقت الحدث بالضبط.","en":"The following time expressions are often used: ever, never, before, up to now, so far.","src":"WB 108","kind":"book"},{"ar":"for/since لوضع بدأ في الماضي ومستمر الآن.","en":"to talk about a present situation which started in the past, usually with for/ since","src":"WB 108","kind":"book"},{"ar":"just لحدث وقع قبل قليل.","en":"Yes, I (just / buy) it. (→ I've just bought it.)","src":"SB 13 ex.c #4","kind":"derived"},{"ar":"yet مع النفي.","en":"we haven't decided anything yet.","src":"WB 6 ex.c example","kind":"book"},{"ar":"ذكر عدد المرات (how many times) يدل على البسيط لا المستمر.","en":"I've read three articles.","src":"WB 109","kind":"book"}]}},"questions":[{"type":"mcq","q":"I can't phone for an ambulance – I ………. my mobile.","options":["loses","have lost","am losing","will lose"],"answer":1,"src":"WB 34 Progress Test 1 Grammar a #1","origin":"book","explain_ar":"حدث في الماضي نتيجته ظاهرة الآن (لا أستطيع الاتصال)، فنستعمل have lost."},{"type":"mcq","q":"I ………………… to the conclusion that nowadays nobody cares about anything.","options":["come","have come","will come"],"answer":1,"src":"SB 47 Review 1 ex.1 #1","origin":"book","explain_ar":"وصلتُ إلى نتيجة قائمة الآن (nowadays)، فنستعمل المضارع التام have come."},{"type":"mcq","q":"Ahlam Mestaghanmi ………………… some of the best novels in recent years.","options":["has written","wrote","was writing"],"answer":0,"src":"SB 47 Review 1 ex.1 #9","origin":"book","explain_ar":"in recent years فترة ممتدة حتى الآن بلا وقت محدد، فنستعمل has written."},{"type":"tf","statement":"We use the Present Perfect Simple when we want to show a link between the present and the past.","answer":true,"src":"WB 108","origin":"book","explain_ar":"هذا تعريف الكتاب للمضارع التام البسيط."},{"type":"tf","statement":"The time expressions ever, never, before, up to now and so far are often used with the Past Simple.","answer":false,"src":"WB 108","origin":"adapted","explain_ar":"الكتاب يذكر هذه الكلمات مع Present Perfect Simple لا مع Past Simple."},{"type":"tf","statement":"Is the lawn finished? Yes, George has cut the grass.","answer":true,"src":"SB 13 ex.b example","origin":"book","explain_ar":"النتيجة ظاهرة على الشيء الآن (العشب مقصوص)، فنستعمل المضارع التام البسيط."},{"type":"fill","q":"Are the onions ready for the pan? Yes, Mike ____ them. (peel the onions)","answers":["has peeled","'s peeled"],"src":"SB 13 ex.b #2","origin":"book","explain_ar":"السؤال عن النتيجة (البصل جاهز)، فنستعمل المضارع التام البسيط."},{"type":"fill","q":"Are the floors clean? Yes, Jane ____ them. (sweep the floors)","answers":["has swept","'s swept"],"src":"SB 13 ex.b #5","origin":"book","explain_ar":"النتيجة مكتملة الآن (الأرض نظيفة)؛ والتصريف الثالث لـ sweep هو swept."},{"type":"fill","q":"Is the fridge all right now? Yes, Tom ____ . (defrost the fridge)","answers":["has defrosted it","'s defrosted it","has defrosted the fridge"],"src":"SB 13 ex.b #8","origin":"book","explain_ar":"السؤال عن نتيجة على الشيء، فنستعمل has defrosted."},{"type":"fill","q":"A Is that a new tab? B Yes, I ____ (just / buy) it.","answers":["have just bought","'ve just bought"],"src":"SB 13 ex.c #4","origin":"book","explain_ar":"just لحدث وقع قبل قليل، وتأتي بين have والتصريف الثالث."},{"type":"fill","q":"A: Excuse me. ____ (someone leave) this mobile here?","answers":["Has someone left"],"src":"WB 6 ex.c #1","origin":"book","explain_ar":"حدث بلا وقت محدد ونتيجته الآن (الهاتف موجود هنا)، والسؤال بتقديم Has."},{"type":"fill","q":"A: Why are you crying? B: Because my brother ____ (have) an accident.","answers":["has had","'s had"],"src":"WB 6 ex.c #3","origin":"book","explain_ar":"حدث قريب نتيجته الآن (أبكي)، فنستعمل has had."}],"flags":[]},{"id":"u1-present-perfect-continuous","name_en":"Present Perfect Continuous","name_ar":"المضارع التام المستمر","branches":{"form":{"summary_ar":"لفعل استمر فترة من الزمن حتى الآن، ولأفعال متكررة حتى الآن، ولفعل انتهى قبل الآن مباشرة وأثره ظاهر. يؤكد على المدة وعلى النشاط نفسه.","structure":"S + has / have been + V-ing","items":[{"ar":"صيغة الإثبات.","en":"I've been studying really hard.","src":"WB 109","kind":"book"},{"ar":"فعل مستمر فترة من الزمن حتى الآن.","en":"I've been waiting here for thirty minutes. (I'm still waiting.)","src":"WB 109","kind":"book"},{"ar":"أفعال متكررة حتى الآن.","en":"Carol has been playing the guitar since she was six.","src":"WB 109","kind":"book"},{"ar":"فعل انتهى قبل الآن مباشرة وأثره ظاهر.","en":"He's been swimming. That's why his hair is wet.","src":"WB 109","kind":"book"},{"ar":"النشاط سبب حالة الشخص الآن.","en":"Jane, why are you sweating? Because I have been sweeping the floors.","src":"SB 13 ex.b example","kind":"book"},{"ar":"جواب من الكتاب مع مدة.","en":"I've been using a computer for at least three years.","src":"SB 14 ex.c #5","kind":"book"},{"ar":"مخطط الكتاب: فعل بدأ في الماضي ومستمر حتى الآن.","en":"I have been studying for two hours. (action began in past and continues until now)","src":"WB 109","kind":"book"}]},"negative":{"structure":"S + has / have + not been + V-ing","verb_change_ar":"نضع not بعد has/have (hasn't been / haven't been)، والفعل يبقى V-ing.","items":[{"ar":"مثال الكتاب.","en":"I haven't been studying really hard.","src":"WB 109","kind":"book"}]},"question":{"structure":"Has / Have + S + been + V-ing ?","aux_ar":"has/have موجود في الجملة فنقدّمه على الفاعل، وتبقى been + V-ing بعد الفاعل.","items":[{"ar":"مثال الكتاب.","en":"Have you been studying really hard?","src":"WB 109","kind":"book"},{"ar":"من تمرين الكتاب (you stand).","en":"Excuse me. (you stand) in this queue for a long time? (→ Have you been standing in this queue for a long time?)","src":"WB 6 ex.c #2","kind":"derived"}],"notes":[{"ar":"المستمر يؤكد على المدة (how long)، والبسيط يقول كم مرة (how many times).","en":"Present Perfect Continuous emphasises how long: e.g. I've been cleaning the house for two hours. / Present Perfect Simple says how many times: I've read three articles.","src":"WB 109","kind":"book"},{"ar":"المستمر يركّز على النشاط نفسه ولا يبيّن هل انتهى، والبسيط يركّز على النتيجة والاكتمال.","en":"focuses on the activity itself (it doesn't show whether the activity is completed or not): e.g. I've been writing an article. (We don't know if the article is finished or not.) / focuses on the result or completion of the activity: e.g. I've written an article. (the article is finished but we don't know when.)","src":"WB 109","kind":"book"},{"ar":"في تمرين الكتاب: سبب حالة الشخص الآن ← المستمر، والنتيجة على الشيء ← البسيط.","en":"Jane, why are you sweating? Because I have been sweeping the floors. / Is the lawn finished? Yes, George has cut the grass.","src":"SB 13 ex.b examples","kind":"book"},{"ar":"الكتاب كتب في جدول الصيغ «Verb= -ing» في النفي والسؤال، والمقصود Verb + -ing.","en":"has/ have not been + Verb= -ing / has/ have…… been + Verb= -ing","src":"WB 109","kind":"book"}]},"signals":{"keywords":["How long","for","since","all afternoon","for weeks"],"items":[{"ar":"How long + مدة حتى الآن ← المستمر.","en":"How long (you / use) a computer? — I've been using a computer for at least three years.","src":"SB 14 ex.c #5","kind":"book"},{"ar":"for + مدة مستمرة حتى الآن.","en":"we have been talking about that for weeks","src":"WB 6 ex.c example","kind":"book"},{"ar":"since + بداية الفعل في الماضي.","en":"Carol has been playing the guitar since she was six.","src":"WB 109","kind":"book"},{"ar":"all afternoon تؤكد استمرار النشاط.","en":"I (sit) here all afternoon (→ I've been sitting here all afternoon)","src":"WB 6 ex.c #1","kind":"derived"},{"ar":"إذا ذُكر عدد مرات أو نتيجة مكتملة نستعمل البسيط لا المستمر.","en":"I've read three articles.","src":"WB 109","kind":"book"}]}},"questions":[{"type":"mcq","q":"She ………………………. on that manuscript for two years now.","options":["has been working","had been working","is working"],"answer":0,"src":"SB 47 Review 1 ex.1 #4","origin":"book","explain_ar":"for two years now مدة مستمرة حتى الآن، فنستعمل has been working."},{"type":"mcq","q":"B: Yes, I ……………………… (queue) for almost an hour.","options":["have been queuing","had been queuing","am queuing"],"answer":0,"src":"WB 6 ex.c #2","origin":"adapted","explain_ar":"مدة مستمرة حتى الآن (for almost an hour)، فنستعمل المضارع التام المستمر."},{"type":"mcq","q":"The Present Perfect Continuous emphasises ……………… .","options":["how many times","a specific past time","how long"],"answer":2,"src":"WB 109","origin":"adapted","explain_ar":"جدول الكتاب: المستمر emphasises how long، والبسيط says how many times."},{"type":"tf","statement":"In “I've been writing an article”, we know that the article is finished.","answer":false,"src":"WB 109","origin":"adapted","explain_ar":"الكتاب يقول: We don't know if the article is finished or not."},{"type":"tf","statement":"We can use the Present Perfect Continuous to talk about an action which ends just before the present: He's been swimming. That's why his hair is wet.","answer":true,"src":"WB 109","origin":"book","explain_ar":"من استعمالات الكتاب: فعل انتهى قبل الآن مباشرة وأثره ظاهر (الشعر مبلول)."},{"type":"tf","statement":"Jane, why are you sweating? Because I have been sweeping the floors.","answer":true,"src":"SB 13 ex.b example","origin":"book","explain_ar":"النشاط سبب حالة الشخص الآن (التعرّق)، فنستعمل المستمر."},{"type":"fill","q":"Rachel, why are your hands so soft? Because I ____ . (do the washing-up)","answers":["have been doing the washing-up","'ve been doing the washing-up"],"src":"SB 13 ex.b #1","origin":"book","explain_ar":"النشاط سبب حالة Rachel الآن (يداها ناعمتان)، فنستعمل المستمر."},{"type":"fill","q":"George, you look tired. Yes, I ____ . (cut the grass)","answers":["have been cutting the grass","'ve been cutting the grass"],"src":"SB 13 ex.b #3","origin":"book","explain_ar":"التعب نتيجة نشاط استمر حتى الآن، فنستعمل المستمر."},{"type":"fill","q":"Tom, your hands are very cold. Yes, I ____ . (defrost the fridge)","answers":["have been defrosting the fridge","'ve been defrosting the fridge"],"src":"SB 13 ex.b #4","origin":"book","explain_ar":"برودة اليدين أثر نشاط مستمر حتى الآن."},{"type":"fill","q":"B: I don't know. I ____ (sit) here all afternoon, but I haven't noticed it until now.","answers":["have been sitting","'ve been sitting"],"src":"WB 6 ex.c #1","origin":"book","explain_ar":"all afternoon تؤكد استمرار الجلوس حتى الآن."},{"type":"fill","q":"A: Excuse me. ____ (you stand) in this queue for a long time?","answers":["Have you been standing"],"src":"WB 6 ex.c #2","origin":"book","explain_ar":"سؤال عن مدة مستمرة حتى الآن (for a long time)، نقدّم Have ثم been standing."},{"type":"fill","q":"A How long ____ (you / use) a computer? B I've been using a computer for at least three years. Maybe longer.","answers":["have you been using","have you used"],"src":"SB 14 ex.c #5","origin":"book","explain_ar":"How long مع فعل مستمر حتى الآن، وجواب B في الكتاب بالمستمر (I've been using)."}],"flags":[{"type":"book_typo","ar":"جدول صيغ المضارع التام المستمر: في النفي والسؤال مكتوب «Verb= -ing» والصحيح Verb + -ing. كتبنا الصحيح في الصيغ وتركنا نص الكتاب في الملاحظات.","src":"WB 109"},{"type":"unsure","ar":"تعليمات SB 14 ex.c تطلب Present Perfect Simple أو Past Simple، لكن جواب B في البند 5 بالمستمر (I've been using). قبلنا have you been using وhave you used.","src":"SB 14 ex.c #5"}]},{"id":"u1-present-perfect-or-past-simple","name_en":"Present Perfect or Past Simple","name_ar":"المضارع التام أم الماضي البسيط","branches":{"form":{"summary_ar":"المضارع التام يربط الماضي بالحاضر ولا يذكر وقتاً محدداً، أما الماضي البسيط فيتحدث عن الماضي فقط ويذكر وقتاً ماضياً محدداً.","structure":"Present Perfect: S + has / have + V3 | Past Simple: S + V2","items":[{"ar":"المضارع التام يربط الماضي بالحاضر (ما زلنا نسكن هنا).","en":"We've lived here for six years. (We still live here.)","src":"WB 109","kind":"book"},{"ar":"الماضي البسيط يتحدث عن الماضي فقط (لم نعد نسكن هناك).","en":"We lived there for six years. (We don't live there now.)","src":"WB 109","kind":"book"},{"ar":"المضارع التام لا يذكر وقتاً محدداً في الماضي.","en":"Have you read ‘The Old Man and the Sea”?","src":"WB 109","kind":"book"},{"ar":"الماضي البسيط يذكر وقتاً ماضياً محدداً.","en":"I read “The Old Man and the Sea” last month.","src":"WB 109","kind":"book"},{"ar":"مثال الكتاب بالماضي البسيط مع وقت محدد.","en":"A I saw (see) Jack last night.","src":"SB 13 ex.c #1","kind":"book"}]},"negative":{"structure":"Present Perfect: S + has / have + not + V3 | Past Simple: S + did not (didn't) + V0","verb_change_ar":"في المضارع التام يبقى الفعل V3 بعد haven't/hasn't، أما في الماضي البسيط فيرجع الفعل مصدراً بعد didn't لأن did أخذت علامة الماضي.","items":[{"ar":"نفي المضارع التام.","en":"The aircraft hasn't landed safely.","src":"WB 108","kind":"book"},{"ar":"نفي الماضي البسيط.","en":"She didn't work for the police.","src":"WB 107","kind":"book"},{"ar":"من تمرين الكتاب: (not / see) مع for months ← مضارع تام منفي.","en":"Oh really. I (not / see) him for months. (→ I haven't seen him for months.)","src":"SB 13 ex.c #1","kind":"derived"}]},"question":{"structure":"Have / Has + S + V3 … ? | Did + S + V0 … ?","aux_ar":"في المضارع التام has/have موجود فنقدّمه على الفاعل. في الماضي البسيط نضيف Did في أول السؤال ويرجع الفعل مصدراً.","items":[{"ar":"سؤال بالمضارع التام مع ever.","en":"Have you ever been to Canada?","src":"WB 5 ex.b example","kind":"book"},{"ar":"سؤال بالماضي البسيط.","en":"Did she work for the police?","src":"WB 107","kind":"book"},{"ar":"وقت محدد في الماضي (when you were at university) ← Did.","en":"(you / meet) him when you were at university? (→ Did you meet him when you were at university?)","src":"SB 14 ex.c #6","kind":"derived"}],"notes":[{"ar":"أسئلة الكتاب عن استعمال الزمنين.","en":"Which form of the verb do we use for ……? 1 a completed action in the past 2 things which started in the past and are true now 3 recent actions when we don't say exactly when 4 recent actions when we say exactly when","src":"SB 14 ex.d","kind":"book"},{"ar":"الجواب حسب جدول الكتاب: (1) و(4) الماضي البسيط، و(2) و(3) المضارع التام.","en":"1 Past Simple 2 Present Perfect 3 Present Perfect 4 Past Simple","src":"SB 14 ex.d + WB 109","kind":"derived"}]},"signals":{"keywords":["ever","never","before","so far","just","for","last night","last year","last month","in 2006","when + past time"],"items":[{"ar":"ever في السؤال ← المضارع التام.","en":"(you/ ever/ win) a competition? (→ Have you ever won a competition?)","src":"SB 13 ex.c #2","kind":"derived"},{"ar":"سنة محددة في الماضي ← الماضي البسيط.","en":"Yes, I (win) a writing competition in 2006. (→ won)","src":"SB 13 ex.c #3","kind":"derived"},{"ar":"last year ← الماضي البسيط.","en":"Yes, I (go) there last year. (→ went)","src":"WB 5 ex.b #1","kind":"derived"},{"ar":"for + مدة مستمرة حتى الآن ← المضارع التام.","en":"Yes, we (be) friends for more than ten years. (→ have been)","src":"SB 14 ex.c #7","kind":"derived"},{"ar":"انتبه: for وحدها لا تكفي؛ إذا انتهى الوضع نستعمل الماضي البسيط.","en":"We lived there for six years. (We don't live there now.)","src":"WB 109","kind":"book"}]}},"questions":[{"type":"mcq","q":"Ella: Yes, I ………………………… (go) there last year.","options":["have gone","have been going","went"],"answer":2,"src":"WB 5 ex.b #1","origin":"adapted","explain_ar":"last year وقت ماضٍ محدد، فنستعمل الماضي البسيط went."},{"type":"mcq","q":"Which form of the verb do we use for things which started in the past and are true now?","options":["Present Perfect","Past Simple","Present Simple"],"answer":0,"src":"SB 14 ex.d #2","origin":"adapted","explain_ar":"المضارع التام يربط الماضي بالحاضر: We've lived here for six years. (We still live here.)"},{"type":"mcq","q":"Which form of the verb do we use for recent actions when we say exactly when?","options":["Present Perfect","Present Perfect Continuous","Past Simple"],"answer":2,"src":"SB 14 ex.d #4","origin":"adapted","explain_ar":"ذكر الوقت بالضبط يعني الماضي البسيط (States a specific past time)."},{"type":"tf","statement":"We use the Present Perfect for recent actions when we don't say exactly when.","answer":true,"src":"SB 14 ex.d #3","origin":"adapted","explain_ar":"المضارع التام doesn't talk about a specific time in the past."},{"type":"tf","statement":"“We've lived here for six years” means that we don't live here now.","answer":false,"src":"WB 109","origin":"adapted","explain_ar":"الكتاب يقول (We still live here.)؛ أما We lived there for six years فتعني أننا لم نعد نسكن هناك."},{"type":"fill","q":"A ____ (you/ ever/ win) a competition?","answers":["Have you ever won"],"src":"SB 13 ex.c #2","origin":"book","explain_ar":"ever بلا وقت محدد ← مضارع تام، وever تأتي بعد الفاعل."},{"type":"fill","q":"B Yes, I ____ (win) a writing competition in 2006.","answers":["won"],"src":"SB 13 ex.c #3","origin":"book","explain_ar":"in 2006 وقت ماضٍ محدد ← الماضي البسيط."},{"type":"fill","q":"A I saw (see) Jack last night. B Oh really. I ____ (not / see) him for months. How is he?","answers":["haven't seen","have not seen"],"src":"SB 13 ex.c #1","origin":"book","explain_ar":"for months حتى الآن ← مضارع تام منفي."},{"type":"fill","q":"A So, Jack is your best friend. ____ (you/ meet) him when you were at university?","answers":["Did you meet"],"src":"SB 14 ex.c #6","origin":"book","explain_ar":"when you were at university وقت منتهٍ في الماضي ← Did + المصدر."},{"type":"fill","q":"B Yes, we ____ (be) friends for more than ten years.","answers":["have been","'ve been"],"src":"SB 14 ex.c #7","origin":"book","explain_ar":"ما زالا صديقين الآن (Jack is your best friend)، فنستعمل المضارع التام مع for."},{"type":"fill","q":"Lucy: ____ (you like) it? Ella: Yes, I enjoyed the trip a lot.","answers":["Did you like"],"src":"WB 5 ex.b #2","origin":"book","explain_ar":"الرحلة كانت last year (وقت منتهٍ)، فالسؤال بالماضي البسيط Did you like."},{"type":"fill","q":"Lucy: No, but I ____ (book) a holiday there. I've got my ticket and I'm going next week!","answers":["have booked","'ve booked"],"src":"WB 5 ex.b #7","origin":"book","explain_ar":"حدث بلا وقت محدد ونتيجته الآن (معي التذكرة)، فنستعمل المضارع التام."}],"flags":[]}]},{"unit":2,"unit_title":"Success","grammar_title":"Revision of Tenses 2","pages":{"sb":[21,22,47],"wb":[12,34,107,108,110,111]},"rules":[{"id":"u2-past-simple","name_en":"Past Simple","name_ar":"الماضي البسيط","branches":{"form":{"summary_ar":"نستعمله للأفعال المكتملة في الماضي (وغالباً نذكر الوقت)، ولسلسلة أفعال بترتيب حدوثها، وللأفعال المتكررة في الماضي، وللأوضاع الطويلة في الماضي التي لم تعد صحيحة.","structure":"S + V2","items":[{"ar":"صيغة الإثبات.","en":"She worked for the police.","src":"WB 107","kind":"book"},{"ar":"فعل مكتمل في الماضي، وغالباً نذكر الوقت.","en":"Anna passed her exam last year.","src":"WB 107","kind":"book"},{"ar":"سلسلة أفعال بترتيب حدوثها.","en":"The robber came in through the window, picked up the jewelry box, emptied it out then stole all accessories.","src":"WB 107","kind":"book"},{"ar":"أفعال متكررة في الماضي.","en":"When her daughter got older, she often went out to visit her friends after school.","src":"WB 107","kind":"book"},{"ar":"وضع طويل في الماضي لم يعد صحيحاً.","en":"My father worked for the police for over 15 years.","src":"WB 107","kind":"book"},{"ar":"نستعمله أيضاً مع الحالات (states).","en":"The spaceship seemed very big.","src":"WB 108","kind":"book"},{"ar":"جملة الكتاب لفعل واحد مكتمل في الماضي.","en":"A few weeks ago, a woman called to report a robbery at her house.","src":"SB 21 ex.a #1","kind":"book"},{"ar":"مخطط الكتاب: فعل اكتمل في الماضي.","en":"I studied last night. (action completed in the past)","src":"WB 107","kind":"book"}]},"negative":{"structure":"S + did not (didn't) + V0","verb_change_ar":"نضيف didn't مع كل الضمائر، ويرجع الفعل مصدراً (V0) لأن did أخذت علامة الماضي.","items":[{"ar":"مثال الكتاب.","en":"She didn't work for the police.","src":"WB 107","kind":"book"},{"ar":"من تمرين الكتاب (not/ know).","en":"We (not/ know) what to do at first (→ We didn't know what to do at first)","src":"WB 12 ex.a #10","kind":"derived"}]},"question":{"structure":"(Wh-) + Did + S + V0 ?","aux_ar":"نضيف Did في أول السؤال (أو بعد أداة الاستفهام)، ويرجع الفعل مصدراً.","items":[{"ar":"مثال الكتاب.","en":"Did she work for the police?","src":"WB 107","kind":"book"},{"ar":"سؤال بأداة استفهام من حوار الكتاب.","en":"What time did you wake up?","src":"SB 21 ex.b example","kind":"book"},{"ar":"سؤال نعم/لا من حوار الكتاب.","en":"Did you and your husband stay at home on that day?","src":"SB 21 ex.b","kind":"book"}],"notes":[{"ar":"الماضي البسيط لفعل مكتمل في الماضي، والماضي المستمر لفعل كنا في منتصفه.","en":"We use the Past Simple for a complete action in the past. e.g. The spaceship flew away.","src":"WB 108","kind":"book"},{"ar":"الماضي البسيط يأتي مع الحالات، أما الماضي المستمر فلا يأتي معها عادةً.","en":"We can use the Past Simple for states. e.g. The spaceship seemed very big.","src":"WB 108","kind":"book"},{"ar":"الحدث الذي يقع أثناء الخلفية يكون عادةً بالماضي البسيط.","en":"to provide the background scene to an action (usually in the Past Simple).","src":"WB 107","kind":"book"}]},"signals":{"keywords":["last year","last night","a few weeks ago","then","next","often (past habit)","at six o'clock"],"items":[{"ar":"ذكر وقت ماضٍ منتهٍ يدل على الماضي البسيط.","en":"to talk about completed actions in the past. Often the time is mentioned.","src":"WB 107","kind":"book"},{"ar":"next وthen تدلان على تسلسل الأحداث.","en":"(We often use words like next or then to indicate the sequence of events.)","src":"WB 107","kind":"book"},{"ar":"then في حوار الكتاب مع سلسلة أفعال.","en":"No, We (drink) coffee. Then, I (put on) my raincoat, and we (go out) at six o'clock. (→ drank, put on, went out)","src":"SB 21 ex.b","kind":"derived"},{"ar":"First… Then… في سلسلة أفعال مكتملة ← الماضي البسيط لا المستمر.","en":"First, they stayed in London for a few days. Then they were visiting Cambridge. (→ visited)","src":"WB 12 ex.b #2","kind":"derived"}]}},"questions":[{"type":"mcq","q":"I always ………. the TV news when I lived abroad.","options":["watched","am watching","have watched","will watch"],"answer":0,"src":"WB 34 Progress Test 1 Grammar a #5","origin":"book","explain_ar":"عادة متكررة في الماضي (when I lived abroad) ← watched."},{"type":"mcq","q":"1 A few weeks ago, a woman called to report a robbery at her house. 2 It happened at four in the afternoon when she was watching news on TV. 3 The burglar came in through the front door, picked up the woman’s handbag, emptied it out and stole her purse. 4 Times were hard and the family had been struggling for some time. 5 When she came into the room, the burglar had already left. — Which sentence describes a series of completed actions in the past?","options":["Sentence 1","Sentence 3","Sentence 4","Sentence 5"],"answer":1,"src":"SB 21 ex.a","origin":"adapted","explain_ar":"الجملة 3 فيها أفعال ماضٍ بسيط متتابعة: came in, picked up, emptied, stole."},{"type":"mcq","q":"1 A few weeks ago, a woman called to report a robbery at her house. 2 It happened at four in the afternoon when she was watching news on TV. 3 The burglar came in through the front door, picked up the woman’s handbag, emptied it out and stole her purse. 4 Times were hard and the family had been struggling for some time. 5 When she came into the room, the burglar had already left. — Which sentence talks about a single completed action in the past?","options":["Sentence 1","Sentence 3","Sentence 4","Sentence 5"],"answer":0,"src":"SB 21 ex.a","origin":"adapted","explain_ar":"الجملة 1 فيها فعل واحد مكتمل (called) مع وقت ماضٍ (A few weeks ago)."},{"type":"tf","statement":"First, they stayed in London for a few days.","answer":true,"src":"WB 12 ex.b #2","origin":"book","explain_ar":"فعل مكتمل أول في سلسلة، والماضي البسيط صحيح (نضع إشارة ✓)."},{"type":"tf","statement":"Then they were visiting Cambridge.","answer":false,"src":"WB 12 ex.b #2","origin":"book","explain_ar":"سلسلة أفعال مكتملة (First… Then…)، فالصحيح visited."},{"type":"tf","statement":"We can use the Past Simple for states.","answer":true,"src":"WB 108","origin":"book","explain_ar":"مثال الكتاب: The spaceship seemed very big."},{"type":"fill","q":"She ____ (make) us excited about the subject because she was so interested herself.","answers":["made"],"src":"WB 12 ex.a #2","origin":"book","explain_ar":"حقيقة مكتملة في الماضي، والتصريف الثاني لـ make هو made."},{"type":"fill","q":"We ____ (not/ know) what to do at first, but it certainly made us think.","answers":["didn't know","did not know"],"src":"WB 12 ex.a #10","origin":"book","explain_ar":"نفي الماضي البسيط بـ didn't + المصدر، وknow فعل حالة لا يأتي بالمستمر."},{"type":"fill","q":"Policeman: And what ____ (you / do) after you woke up?","answers":["did you do"],"src":"SB 21 ex.b","origin":"book","explain_ar":"فعل مكتمل بعد فعل آخر (after you woke up)، والسؤال بـ did + المصدر."},{"type":"fill","q":"Policeman: Did anything happen while you were watching TV? Suzan: Yes, the phone ____ (ring).","answers":["rang"],"src":"SB 21 ex.b","origin":"book","explain_ar":"حدث قصير مفاجئ أثناء فعل مستمر ← الماضي البسيط rang."},{"type":"fill","q":"He ____ all the ingredients he needed from the supermarket and then went home to make her birthday cake. (buy)","answers":["bought"],"src":"SB 22 ex.c #2","origin":"book","explain_ar":"سلسلة أفعال بترتيبها (and then went home) ← الماضي البسيط bought."},{"type":"fill","q":"Correct the verb: They went to Cambridge before, but they liked it so much that they had decided to go back.","answers":["decided"],"src":"WB 12 ex.b #2","origin":"book","explain_ar":"القرار جاء بعد أن أعجبتهم المدينة لا قبله، فلا نستعمل الماضي التام؛ الصحيح decided."}],"flags":[]},{"id":"u2-past-continuous","name_en":"Past Continuous","name_ar":"الماضي المستمر","branches":{"form":{"summary_ar":"لفعل كان مستمراً في الماضي: يعطي خلفية لحدث آخر (يكون عادةً بالماضي البسيط)، أو يكون فعلاً مستمراً قطعه حدث مفاجئ.","structure":"S + was / were + V-ing","items":[{"ar":"صيغة الإثبات.","en":"He was watching the news.","src":"WB 107","kind":"book"},{"ar":"خلفية لحدث.","en":"The robbery happened at four o'clock while they were sleeping.","src":"WB 107","kind":"book"},{"ar":"فعل مستمر قطعه حدث مفاجئ.","en":"While we were getting ready to go out, the rain suddenly stopped.","src":"WB 107","kind":"book"},{"ar":"فعل كنا في منتصفه.","en":"We were driving home. (We were in the middle of our journey.)","src":"WB 108","kind":"book"},{"ar":"جملة الكتاب التي تعطي خلفية للحدث.","en":"It happened at four in the afternoon when she was watching news on TV.","src":"SB 21 ex.a #2","kind":"book"},{"ar":"مخطط الكتاب.","en":"I was studying when you called. (action begun in past, implies possible continuation after second past event)","src":"WB 107","kind":"book"}]},"negative":{"structure":"S + was / were + not + V-ing","verb_change_ar":"نضع not بعد was/were (wasn't / weren't)، والفعل يبقى V-ing.","items":[{"ar":"مثال الكتاب.","en":"He wasn't watching the news.","src":"WB 107","kind":"book"}]},"question":{"structure":"(Wh-) + Was / Were + S + V-ing ?","aux_ar":"was/were موجود في الجملة فنقدّمه على الفاعل، ولا نضيف did.","items":[{"ar":"مثال الكتاب.","en":"Was he watching the news?","src":"WB 107","kind":"book"},{"ar":"من حوار الكتاب.","en":"What (you / do) when your husband came home? (→ What were you doing when your husband came home?)","src":"SB 21 ex.b","kind":"derived"}],"notes":[{"ar":"لا نستعمل الماضي المستمر عادةً مع الحالات، والكتاب يشطب I wasn't knowing.","en":"We don't normally use the Past Continuous for states. I wasn't knowing …. (crossed out in the book)","src":"WB 108","kind":"book"},{"ar":"الماضي المستمر لفعل كنا في منتصفه، والماضي البسيط لفعل مكتمل.","en":"We use the Past Continuous for an action that we were in the middle of. e.g. We were driving home.","src":"WB 108","kind":"book"}]},"signals":{"keywords":["when","while","as","suddenly (for the interrupting action)"],"items":[{"ar":"when, while, as تأتي غالباً مع الماضي المستمر للخلفية.","en":"We often use words like when, while, and as:","src":"WB 107","kind":"book"},{"ar":"while + فعل مستمر، والحدث المفاجئ بالماضي البسيط.","en":"Did anything happen while (you / watch) TV? (→ while you were watching TV)","src":"SB 21 ex.b","kind":"derived"},{"ar":"suddenly تدل على الحدث المفاجئ الذي يقطع الفعل المستمر، ويكون بالماضي البسيط.","en":"While we were getting ready to go out, the rain suddenly stopped.","src":"WB 107","kind":"book"}]}},"questions":[{"type":"mcq","q":"She hurt her back while she ………. in the garden.","options":["is working","was working","has worked","had worked"],"answer":1,"src":"WB 34 Progress Test 1 Grammar a #2","origin":"book","explain_ar":"while + فعل كان مستمراً حين وقع الحدث (hurt) ← was working."},{"type":"mcq","q":"1 A few weeks ago, a woman called to report a robbery at her house. 2 It happened at four in the afternoon when she was watching news on TV. 3 The burglar came in through the front door, picked up the woman’s handbag, emptied it out and stole her purse. 4 Times were hard and the family had been struggling for some time. 5 When she came into the room, the burglar had already left. — Which sentence provides a background scene about an action?","options":["Sentence 1","Sentence 2","Sentence 3","Sentence 5"],"answer":1,"src":"SB 21 ex.a","origin":"adapted","explain_ar":"was watching في الجملة 2 خلفية للحدث (It happened)."},{"type":"mcq","q":"Policeman: What were you doing when your husband came home? Suzan: I ……………….. (prepare) lunch when he came.","options":["prepared","had prepared","was preparing"],"answer":2,"src":"SB 21 ex.b","origin":"adapted","explain_ar":"فعل كان مستمراً لحظة وصول الزوج (when he came) ← was preparing."},{"type":"tf","statement":"We don't normally use the Past Continuous for states.","answer":true,"src":"WB 108","origin":"book","explain_ar":"الكتاب يشطب I wasn't knowing لأن know فعل حالة."},{"type":"tf","statement":"We use the Past Continuous for a complete action in the past.","answer":false,"src":"WB 108","origin":"adapted","explain_ar":"الفعل المكتمل للماضي البسيط، والمستمر لفعل كنا في منتصفه."},{"type":"fill","q":"Policeman: Did anything happen while ____ (you / watch) TV?","answers":["you were watching"],"src":"SB 21 ex.b","origin":"book","explain_ar":"while + فعل مستمر في الماضي ← you were watching."},{"type":"fill","q":"Policeman: What ____ (you / do) when your husband came home?","answers":["were you doing"],"src":"SB 21 ex.b","origin":"book","explain_ar":"سؤال عن فعل كان مستمراً لحظة حدث آخر، نقدّم were على الفاعل."},{"type":"fill","q":"Policeman: Why did you put your raincoat on? Suzan: Because it ____ (rain), of course.","answers":["was raining"],"src":"SB 21 ex.b","origin":"book","explain_ar":"المطر خلفية مستمرة وقت الخروج ← was raining."},{"type":"fill","q":"I remember one lesson in particular; we ____ (study) different types of plants, and Mrs. Wilson was describing the types of the flower.","answers":["were studying"],"src":"WB 12 ex.a #3","origin":"book","explain_ar":"خلفية الدرس الذي حدثت فيه القصة ← were studying."},{"type":"fill","q":"She picked up a white flower, which was tulip, and then suddenly we noticed that she ____ (cry)!","answers":["was crying"],"src":"WB 12 ex.a #7","origin":"book","explain_ar":"البكاء كان مستمراً لحظة ملاحظتهم له ← was crying."},{"type":"fill","q":"Correct the verb: When I heard the noise at the window, I knew that someone tried to break into the house.","answers":["was trying"],"src":"WB 12 ex.b #4","origin":"book","explain_ar":"المحاولة كانت جارية لحظة سماع الصوت، فنستعمل الماضي المستمر was trying."}],"flags":[{"type":"unsure","ar":"WB 12 ex.b #4: جوابنا was trying (المحاولة كانت جارية لحظة سماع الصوت). الكتاب لا يعطي جواباً، وقد يقبل بعض المدرّسين had been trying.","src":"WB 12 ex.b #4"}]},{"id":"u2-past-perfect-simple","name_en":"Past Perfect Simple","name_ar":"الماضي التام البسيط","branches":{"form":{"summary_ar":"نستعمله عندما نتحدث عن الماضي ونريد ذكر شيء حدث قبله، ومع when, as soon as, by the time, after لترتيب الأحداث، ولنقل أحداث ماضية بأفعال القول.","structure":"S + had + past participle (V3)","items":[{"ar":"صيغة الإثبات كما في مثال الكتاب.","en":"The aircraft had landed safely.","src":"WB 110","kind":"book"},{"ar":"شيء حدث قبل الماضي الذي نتحدث عنه.","en":"His father was a composer and his grandfather had also been a musician.","src":"WB 110","kind":"book"},{"ar":"أحياناً مع just أو already.","en":"By the time he was 17, Mozart's reputation had already begun to spread through Europe.","src":"WB 110","kind":"book"},{"ar":"مع when, as soon as, by the time, after لإظهار ترتيب الأحداث.","en":"When Mozart was born, five of his siblings had already died.","src":"WB 110","kind":"book"},{"ar":"لنقل أحداث ماضية بأفعال القول.","en":"The man told me he had met my father a long time before.","src":"WB 110","kind":"book"},{"ar":"جملة الكتاب: الحدث المذكور ثانياً حدث أولاً.","en":"When she came into the room, the burglar had already left.","src":"SB 21 ex.a #5","kind":"book"},{"ar":"مخطط الكتاب: فعل ماضٍ اكتمل قبل فعل ماضٍ ثانٍ.","en":"I had studied drawing before I began to study painting. (past action completed before second past action)","src":"WB 110","kind":"book"}]},"negative":{"structure":"S + had not (hadn't) + past participle","verb_change_ar":"نضع not بعد had (hadn't)، والفعل يبقى V3.","items":[{"ar":"مثال الكتاب.","en":"The aircraft hadn't landed safely.","src":"WB 110","kind":"book"},{"ar":"من تمرين الكتاب (not take).","en":"…because he (not take) an exam before. (→ he hadn't taken an exam before)","src":"SB 22 ex.c #3","kind":"derived"},{"ar":"نفي بالماضي التام في جملة الكتاب.","en":"I felt annoyed that they hadn't waited for me.","src":"SB 22 ex.c #5","kind":"book"}]},"question":{"structure":"Had + S + past participle ?","aux_ar":"had موجود في الجملة فنقدّمه على الفاعل، ويبقى الفعل V3.","items":[{"ar":"مثال الكتاب.","en":"Had the aircraft landed safely?","src":"WB 110","kind":"book"}],"notes":[{"ar":"المضارع التام = قبل الآن، والماضي التام = قبل ذلك الوقت في الماضي.","en":"Present Perfect: before now e.g. That man looks familiar. I've seen him somewhere before. / Past Perfect: before then e.g. That man looked familiar. I'd seen him somewhere before.","src":"WB 110","kind":"book"},{"ar":"الكتاب كتب صيغة الإثبات «had been + past participle» وهذا خطأ مطبعي؛ الصحيح had + past participle كما في مثاله نفسه.","en":"+ had been + past participle — The aircraft had landed safely.","src":"WB 110","kind":"book"}]},"signals":{"keywords":["already","just","by the time","when","as soon as","after","before"],"items":[{"ar":"الكتاب يذكر هذه الكلمات لإظهار ترتيب الأحداث.","en":"with words like when, as soon as, by the time, after to show the order of events","src":"WB 110","kind":"book"},{"ar":"by the time + ماضٍ بسيط، والحدث الأسبق بالماضي التام.","en":"By the time I got to the meeting they (discuss) the important issues (→ had discussed)","src":"SB 22 ex.c #5","kind":"derived"},{"ar":"already مع الماضي التام.","en":"When Mozart was born, five of his siblings had already died.","src":"WB 110","kind":"book"},{"ar":"before في آخر الجملة بمعنى قبل ذلك الوقت.","en":"That man looked familiar. I'd seen him somewhere before.","src":"WB 110","kind":"book"},{"ar":"عدد مرات (several times) ← الماضي التام البسيط لا المستمر.","en":"I knew her because I had been visiting her several times. (→ had visited)","src":"WB 12 ex.b #5","kind":"derived"}]}},"questions":[{"type":"mcq","q":"I didn’t watch the programme about hurricanes on TV last night, because I ………… a similar programme.","options":["had already seen","was already seen","has already seen","is already seeing"],"answer":0,"src":"WB 34 Progress Test 1 Grammar a #6","origin":"book","explain_ar":"المشاهدة حدثت قبل الليلة الماضية (حدث أسبق في الماضي) ← had already seen."},{"type":"mcq","q":"I was just wondering what ……………………….when I came back home.","options":["has happened","happens","had happened"],"answer":2,"src":"SB 47 Review 1 ex.1 #8","origin":"book","explain_ar":"ما حدث كان قبل عودتي إلى البيت (ماضٍ أسبق) ← had happened."},{"type":"mcq","q":"1 A few weeks ago, a woman called to report a robbery at her house. 2 It happened at four in the afternoon when she was watching news on TV. 3 The burglar came in through the front door, picked up the woman’s handbag, emptied it out and stole her purse. 4 Times were hard and the family had been struggling for some time. 5 When she came into the room, the burglar had already left. — Which sentence shows that the second event the speaker mentioned actually happened first?","options":["Sentence 2","Sentence 3","Sentence 4","Sentence 5"],"answer":3,"src":"SB 21 ex.a","origin":"adapted","explain_ar":"had already left في الجملة 5 حدث قبل came into رغم أنه ذُكر ثانياً."},{"type":"tf","statement":"The lecture started by the time they got there.","answer":false,"src":"WB 12 ex.b #1","origin":"book","explain_ar":"الكتاب يصحّحها إلى had started لأن المحاضرة بدأت قبل وصولهم (by the time)."},{"type":"tf","statement":"I knew her because I had been visiting her several times.","answer":false,"src":"WB 12 ex.b #5","origin":"book","explain_ar":"several times عدد مرات، فالصحيح الماضي التام البسيط had visited."},{"type":"tf","statement":"That man looked familiar. I'd seen him somewhere before.","answer":true,"src":"WB 110","origin":"book","explain_ar":"الماضي التام = before then: الرؤية كانت قبل ذلك الوقت في الماضي."},{"type":"fill","q":"Henry did very well in his exams, which was a shock because he ____ an exam before. (not take)","answers":["hadn't taken","had not taken"],"src":"SB 22 ex.c #3","origin":"book","explain_ar":"قبل امتحاناته لم يكن قد قدّم امتحاناً (قبل ذلك الوقت) ← hadn't taken."},{"type":"fill","q":"By the time I got to the meeting they ____ the important issues (discuss)","answers":["had discussed","'d discussed"],"src":"SB 22 ex.c #5","origin":"book","explain_ar":"by the time + ماضٍ بسيط، والنقاش حدث قبل الوصول ← had discussed."},{"type":"fill","q":"By the time I got to the meeting they had discussed the important issues and they ____ the big decisions without me. (make)","answers":["had made","'d made"],"src":"SB 22 ex.c #5","origin":"book","explain_ar":"القرارات اتُّخذت قبل الوصول ← had made."},{"type":"fill","q":"Correct the verb: They went to Cambridge before, but they liked it so much that they decided to go back.","answers":["had been","had gone","They had been"],"src":"WB 12 ex.b #2","origin":"book","explain_ar":"before تعني قبل هذه الرحلة (قبل ذلك الوقت في الماضي) ← الماضي التام."},{"type":"fill","q":"Correct the verb: I knew her because I had been visiting her several times.","answers":["had visited"],"src":"WB 12 ex.b #5","origin":"book","explain_ar":"عدد مرات (several times) يدل على البسيط لا المستمر."}],"flags":[{"type":"book_typo","ar":"جدول صيغ الماضي التام البسيط: الإثبات مكتوب «had been + past participle» والصحيح had + past participle (مثال الكتاب نفسه: The aircraft had landed safely). كتبنا الصحيح في الصيغة.","src":"WB 110"},{"type":"unsure","ar":"WB 12 ex.b #2 (They went … to Cambridge before): قبلنا had been وhad gone. الأشيع للزيارة had been to.","src":"WB 12 ex.b #2"}]},{"id":"u2-past-perfect-continuous","name_en":"Past Perfect Continuous","name_ar":"الماضي التام المستمر","branches":{"form":{"summary_ar":"لفعل بدأ في الماضي وكان ما يزال مستمراً قبل أن يبدأ فعل ماضٍ آخر، أو لفعل مستمر قطعه حدث ثانٍ وأنهاه، أو لفعل مستمر انتهى في الماضي وكان سبب حالة أو نتيجة في الماضي.","structure":"S + had been + V-ing","items":[{"ar":"صيغة الإثبات كما في مثال الكتاب.","en":"I had been studying really hard.","src":"WB 110","kind":"book"},{"ar":"فعل بدأ وكان مستمراً قبل فعل ماضٍ آخر.","en":"We had been waiting for a long time when the bus finally came.","src":"WB 110","kind":"book"},{"ar":"فعل مستمر قطعه حدث ثانٍ وأنهاه.","en":"I had been teaching in Tokyo when the earthquake hit.","src":"WB 111","kind":"book"},{"ar":"فعل مستمر انتهى وكان سبب حالة في الماضي.","en":"She was very sweaty because she had been running for nearly an hour.","src":"WB 111","kind":"book"},{"ar":"جملة الكتاب التي تركّز على مدة النشاط.","en":"Times were hard and the family had been struggling for some time.","src":"SB 21 ex.a #4","kind":"book"},{"ar":"مخطط الكتاب.","en":"I had been studying for two hours when my friends came over. (past continuous action occurring when second past action occurred)","src":"WB 110","kind":"book"}]},"negative":{"structure":"S + had not (hadn't) been + V-ing","verb_change_ar":"نضع not بعد had (hadn't been)، والفعل يبقى V-ing.","items":[{"ar":"مثال الكتاب.","en":"I hadn't been studying really hard.","src":"WB 110","kind":"book"}]},"question":{"structure":"Had + S + been + V-ing ?","aux_ar":"had موجود في الجملة فنقدّمه على الفاعل، وتبقى been + V-ing بعده.","items":[{"ar":"مثال الكتاب.","en":"Had you been studying really hard?","src":"WB 110","kind":"book"}],"notes":[{"ar":"الكتاب كتب صيغة الإثبات «had + Verb + -ing» وهذا خطأ مطبعي؛ الصحيح had been + Verb + -ing كما في مثاله نفسه.","en":"+ had + Verb + -ing — I had been studying really hard.","src":"WB 110","kind":"book"},{"ar":"في تمرين الكتاب: نشاط مستمر سبّب حالة في الماضي (التعب).","en":"I looked terrible when I saw Joe last night because I had been running for over an hour and I was exhausted.","src":"WB 12 ex.b #3","kind":"book"}]},"signals":{"keywords":["for","since","when","because","for some time","for a long time"],"items":[{"ar":"for + مدة قبل حدث ماضٍ ← الماضي التام المستمر.","en":"She (work) as a waitress for three years when he met her. (→ had been working)","src":"SB 22 ex.c #1","kind":"derived"},{"ar":"since + نقطة بداية قبل حدث ماضٍ.","en":"The program that was stopped had been working well since 1945.","src":"WB 12 ex.b #6","kind":"book"},{"ar":"because + سبب مستمر لحالة ماضية.","en":"She was very sweaty because she had been running for nearly an hour.","src":"WB 111","kind":"book"},{"ar":"when + ماضٍ بسيط للحدث الثاني الذي جاء أثناء الفعل المستمر.","en":"We had been waiting for a long time when the bus finally came.","src":"WB 110","kind":"book"}]}},"questions":[{"type":"mcq","q":"They ………………………. for three hours when the storm suddenly broke.","options":["had been running","have been running","are running"],"answer":0,"src":"SB 47 Review 1 ex.1 #2","origin":"book","explain_ar":"مدة (for three hours) قبل حدث ماضٍ (the storm broke) ← had been running."},{"type":"mcq","q":"I assumed you ………………………. for the repairs until the end of last year.","options":["will pay","had been paying","have paid"],"answer":1,"src":"SB 47 Review 1 ex.1 #3","origin":"book","explain_ar":"فعل مستمر حتى نقطة في الماضي (until the end of last year) مع فعل رئيسي ماضٍ (assumed) ← had been paying."},{"type":"mcq","q":"1 A few weeks ago, a woman called to report a robbery at her house. 2 It happened at four in the afternoon when she was watching news on TV. 3 The burglar came in through the front door, picked up the woman’s handbag, emptied it out and stole her purse. 4 Times were hard and the family had been struggling for some time. 5 When she came into the room, the burglar had already left. — Which sentence focuses on how long an activity continued?","options":["Sentence 1","Sentence 2","Sentence 3","Sentence 4"],"answer":3,"src":"SB 21 ex.a","origin":"adapted","explain_ar":"had been struggling for some time يركّز على مدة النشاط."},{"type":"tf","statement":"I looked terrible when I saw Joe last night because I had been running for over an hour and I was exhausted.","answer":true,"src":"WB 12 ex.b #3","origin":"book","explain_ar":"نشاط مستمر مدة (for over an hour) كان سبب حالة في الماضي، والصيغة صحيحة (✓)."},{"type":"tf","statement":"The program that was stopped had been working well since 1945.","answer":true,"src":"WB 12 ex.b #6","origin":"book","explain_ar":"since 1945 حتى توقّفه في الماضي ← had been working صحيح (✓)."},{"type":"tf","statement":"In “Times were hard and the family had been struggling for some time”, the verb talks about a single completed action.","answer":false,"src":"SB 21 ex.a #4","origin":"adapted","explain_ar":"had been struggling يركّز على مدة نشاط مستمر، لا على فعل واحد مكتمل."},{"type":"fill","q":"She ____ as a waitress for three years when he met her. (work)","answers":["had been working","'d been working"],"src":"SB 22 ex.c #1","origin":"book","explain_ar":"for three years قبل حدث ماضٍ (when he met her) ← had been working."},{"type":"fill","q":"Scientists announced the launch of the new drug last week. They ____ it for five years. (develop)","answers":["had been developing","'d been developing"],"src":"SB 22 ex.c #4","origin":"book","explain_ar":"مدة (for five years) قبل الإعلان في الماضي ← had been developing."},{"type":"fill","q":"We ____ (wait) for a long time when the bus finally came.","answers":["had been waiting","'d been waiting"],"src":"WB 110","origin":"adapted","explain_ar":"فعل بدأ وكان مستمراً قبل حدث ماضٍ (the bus came) ← had been waiting."}],"flags":[{"type":"book_typo","ar":"جدول صيغ الماضي التام المستمر: الإثبات مكتوب «had + Verb + -ing» والصحيح had been + Verb + -ing (مثال الكتاب نفسه: I had been studying really hard). كتبنا الصحيح في الصيغة.","src":"WB 110"}]}]}]},{"module":2,"module_title":"Module 2 Sciences","units":[{"unit":3,"unit_title":"Medicine","grammar_title":"Passive Voice","pages":{"sb":[31,32,47],"wb":[21,22,35]},"rules":[{"id":"u3-passive-voice","name_en":"Passive Voice","name_ar":"المبني للمجهول","branches":{"form":{"summary_ar":"نستعمل المبني للمجهول عندما لا نعرف من قام بالفعل أو لا يهمنا. التركيب الأساسي be + past participle، ويظهر زمن الجملة في فعل be الذي يأخذ زمن الفعل في الجملة المعلومة.","structure":"Object → Subject + be (in the tense of the active verb) + past participle (V3) (+ by / with + agent)","items":[{"ar":"التركيب الأساسي.","en":"Passive Forms: The basic formation is be + past participle.","src":"WB 21","kind":"book"},{"ar":"المضارع البسيط: am / is / are + V3.","en":"Present Simple Passive: Bridges are built over the river by the government.","src":"WB 21","kind":"book"},{"ar":"الماضي البسيط: was / were + V3.","en":"Past Simple Passive: Bridges were built over the river by the government.","src":"WB 21","kind":"book"},{"ar":"المضارع المستمر: am / is / are being + V3.","en":"Present Continuous Passive: Bridges are being built over the river by the government.","src":"WB 21","kind":"book"},{"ar":"الماضي المستمر: was / were being + V3.","en":"Past Continuous Passive: Bridges were being built over the river by the government.","src":"WB 21","kind":"book"},{"ar":"المضارع التام: has / have been + V3.","en":"Present Perfect Passive: Bridges have been built over the river by the government.","src":"WB 21","kind":"book"},{"ar":"الماضي التام: had been + V3.","en":"Past Perfect Passive: Bridges had been built over the river by the government.","src":"WB 21","kind":"book"},{"ar":"مع فعل ناقص للحاضر أو المستقبل: modal + be + V3.","en":"Present Passive with Modal: Bridges will be built over the river by the government.","src":"WB 21","kind":"book"},{"ar":"مع فعل ناقص للماضي: modal + have been + V3.","en":"Past Passive with Modal: Bridges would have been built over the river by the government.","src":"WB 21","kind":"book"},{"ar":"قصة الكتاب فيها أمثلة على عدة أزمنة (ماضٍ بسيط، ماضٍ تام، مضارع تام، مستقبل، مضارع مستمر).","en":"A local jewellery shop was broken into by someone yesterday. The shop had just been locked up by the owner… A search has been organized by the police for the robber. It’s hoped he will be found in a few days. The owner of the shop is being treated by doctors for shock.","src":"SB 31 ex.a","kind":"book"},{"ar":"مثال الكتاب للتحويل من المعلوم إلى المجهول.","en":"Farmers grow food all over the country. → Food is grown all over the country.","src":"SB 47 Review 1 ex.2 sample","kind":"book"}]},"negative":{"structure":"Subject + be + not + past participle | modal + not + be + past participle","verb_change_ar":"نضع not بعد أول فعل مساعد (is / was / has / had / will / can …)، ويبقى الفعل الأساسي تصريفاً ثالثاً (V3). الكتاب لم يكتب قاعدة نفي خاصة بالمجهول، وهذا تطبيق مباشر لنفي كل زمن.","items":[{"ar":"من تمرين الكتاب: فعل ناقص منفي (can't / clean).","en":"I'm sorry this office is so dirty, but it (can’t / clean) until tomorrow morning. (→ it can't be cleaned)","src":"SB 32 ex.b #1","kind":"derived"},{"ar":"من تمرين الكتاب: نفي المضارع التام.","en":"I haven't seen him since then. (→ He hasn't been seen since then.)","src":"SB 32 ex.c #1","kind":"derived"},{"ar":"من تمرين الكتاب: سؤال منفي بالماضي البسيط (didn't تختفي ويحل محلها wasn't).","en":"Why didn't they mend the roof before it fell down? (→ Why wasn't the roof mended before it fell down?)","src":"WB 22 ex.b #5","kind":"derived"}]},"question":{"structure":"(Wh-) + be / first auxiliary + Subject + (being / been) + past participle (+ by + agent) ?","aux_ar":"لا نضيف do / does / did في سؤال المجهول: do/does/did تختفي، ونقدّم أول فعل مساعد (is / are / was / were / has / will …) على الفاعل الجديد، ويبقى V3 بعده.","items":[{"ar":"مثال الكتاب: do تختفي ويحل محلها are.","en":"Where do manufacurers make glass containers? → Where are glass containers made by manufacturers?","src":"WB 22 ex.b e.g.","kind":"book"},{"ar":"من تمرين الكتاب: will تتقدم على الفاعل الجديد.","en":"Will you pay the fine tomorrow? (→ Will the fine be paid (by you) tomorrow?)","src":"WB 22 ex.b #3","kind":"derived"},{"ar":"من تمرين الكتاب: has يتقدم، والفاعل الجديد هو الشخص.","en":"Has anybody shown you what to do? (→ Have you been shown what to do?)","src":"WB 22 ex.b #4","kind":"derived"}],"notes":[{"ar":"نستعمل by أو with إذا أردنا ذكر من قام بالفعل أو ما قام به.","en":"We can use the passive and still say who or what performs the action by using (by) or (with). e.g. The basement has been flooded by the washing machine. The lights were switched on with the car phone.","src":"WB 21","kind":"book"},{"ar":"الفعل الذي له مفعولان له صيغتان بالمجهول، ونبدأ عادةً بالشخص.","en":"Sentences with verbs of two objects can have two different forms in the passive. When these verbs are used in the passive, we usually begin with the person. e.g. The teacher gave the students plenty of time to finish the exam. The students were given plenty of time to finish the exam. Plenty of time was given to the students to finish the exam.","src":"WB 21","kind":"book"},{"ar":"مثال الكتاب للمفعولين.","en":"They awarded Tom Cruise, the richest movie star, a big prize. → Tom Cruise, the richest movie star, was awarded a big prize. / A big prize was awarded to Tom Cruise, the richest movie star.","src":"WB 22 ex.a e.g.","kind":"book"},{"ar":"الأفعال المتعدية فقط تُبنى للمجهول، وبعض الأفعال المتعدية لا تُبنى للمجهول.","en":"Only transitive verbs (verbs with an object) can be made passive. Some transitive verbs cannot be made passive: become, fit, get, have, lack, let, like, resemble, suit.","src":"WB 21","kind":"book"},{"ar":"تنبيه من تمرين الكتاب: disappear فعل لازم (لا مفعول له) فلا
