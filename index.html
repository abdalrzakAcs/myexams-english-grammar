's exact words.","src":"WB 85","kind":"book"},{"ar":"في الكلام المنقول ننقل المعنى دون التقيد بكلمات المتكلم.","en":"In indirect speech, we give the exact meaning of a remark or a speech, without necessarily using the speaker's exact words.","src":"WB 85","kind":"book"},{"ar":"المباشر والمنقول في مثال واحد.","en":"DIRECT: He said, “I have lost my umbrella.” INDIRECT: He said (that) he had lost his umbrella","src":"WB 85","kind":"book"},{"ar":"told بعدها مفعول به (me).","en":"We're taking the nine o'clock train. → Judy told me they were taking the nine o'clock train.","src":"SB 112 ex.a #1 (example)","kind":"book"}]},"negative":{"structure":"S + said (that) + S + didn't / wasn't / hadn't / couldn't + V","verb_change_ar":"يرجع الفعل خطوة إلى الماضي، والنفي يبقى مع الفعل المساعد بعد إرجاعه. من أمثلة الكتاب: is ← was، are taking ← were taking، have lost ← had lost، saw ← had seen، got married ← had got married، will ← would.","items":[{"ar":"is ← was، وmy ← her.","en":"She said, “He's my son.” → She said that he was her son.","src":"WB 85","kind":"book"},{"ar":"am ← was، وI ← she.","en":"“I'm ill.”, she said. → She said that she was ill.","src":"WB 85","kind":"book"},{"ar":"saw ← had seen، وthe day before yesterday ← two days before.","en":"“I saw her the day before yesterday,” he said. → He said he'd seen her two days before.","src":"WB 85","kind":"book"},{"ar":"will ← would، وtomorrow ← the next day.","en":"“I'll do it tomorrow,” he promised. → He promised that he would do it the next day.","src":"WB 85","kind":"book"},{"ar":"got married ← had got married، وa year ago ← a year before / the previous year.","en":"She said, “My brother got married a year ago.” → She said that her brother had got married a year before/the previous year.","src":"WB 85","kind":"book"},{"ar":"الماضي التام مع أفعال النقل.","en":"to report past events using reporting verbs: The man told me he had met my father a long time before.","src":"WB 110 (Grammar Bank)","kind":"book"},{"ar":"النفي يبقى مع المساعد بعد إرجاعه: don't ← didn't، didn't ← hadn't، cannot ← couldn't (تطبيق القاعدة على تمارين الكتاب).","en":"","src":"SB 112 ex.a #3, #7 + WB 86 ex.a #7","kind":"derived"}]},"question":{"structure":"لا سؤال هنا: الجملة الخبرية المنقولة تبقى خبرية","aux_ar":"الجملة الخبرية المنقولة لا تحتاج do/does؛ فقط الفعل المساعد الموجود يرجع خطوة (am/is ← was، have ← had، will ← would، can ← could)، وتُحذف علامتا التنصيص.","items":[{"ar":"في أمثلة الكتاب وتمارينه: said بلا مفعول، وtold بعدها مفعول (told me / told Nancy).","en":"She said … / She told me …","src":"SB 112 ex.a + SB 124 Review 3 ex.2","kind":"derived"}],"notes":[{"ar":"ضمائر المتكلم والمخاطب وصفات الملكية تتحول عادة إلى الغائب، إلا إذا نقل المتكلم كلامه هو.","en":"First and second person pronouns and possessive adjectives normally change to the third person except when the speaker is reporting his own words. (I = he, she; me = him, her; my = his, her; mine = his, hers; we = they...)","src":"WB 85","kind":"book"},{"ar":"في الكلام المباشر نضع الكلام بين علامتي تنصيص وقبله فاصلة.","en":"Remarks thus repeated are placed between inverted commas, and a comma is placed immediately before the remark. Direct speech is found in conversations, in books, in plays and in quotations.","src":"WB 85","kind":"book"}]},"signals":{"keywords":["said (that)","told me","admitted","promised","today → that day","yesterday → the day before / the previous day","last → the previous","tomorrow → the next / following day","ago → before","here → there"],"items":[{"ar":"today ← that day","en":"today = that day","src":"WB 85","kind":"book"},{"ar":"yesterday ← the day before / the previous day","en":"yesterday= the day before/ the previous day","src":"WB 85","kind":"book"},{"ar":"last ← the previous","en":"last = the previous","src":"WB 85","kind":"book"},{"ar":"tomorrow ← the next / following day","en":"tomorrow = the next/ following day","src":"WB 85","kind":"book"},{"ar":"here ← there في مثال الكتاب.","en":"Ali: “I will be here at noon.” → Ali said that he would be there at noon.","src":"WB 86 ex.a (example)","kind":"book"}]}},"questions":[{"type":"mcq","q":"Maria: “The train arrives on time.” → She said the train ____ on time.","options":["arrives","arrived","has arrived"],"answer":1,"src":"WB 86 ex.a #1","origin":"adapted","explain_ar":"المضارع البسيط يرجع ماضياً بسيطاً: arrives ← arrived."},{"type":"mcq","q":"Mary: “I cannot go to the movie with you.” → Mary said that she ____ go to the movie with me.","options":["cannot","can","couldn't"],"answer":2,"src":"WB 86 ex.a #7","origin":"adapted","explain_ar":"cannot ترجع خطوة: couldn't، والنفي يبقى."},{"type":"tf","statement":"In indirect speech, we give the exact meaning of a remark or a speech, without necessarily using the speaker's exact words.","answer":true,"src":"WB 85","origin":"book","explain_ar":"هذا تعريف الكتاب للكلام المنقول."},{"type":"tf","statement":"In indirect speech, “tomorrow” does not change.","answer":false,"src":"WB 85","origin":"adapted","explain_ar":"في الكتاب: tomorrow ← the next / following day."},{"type":"fill","q":"“I'll have to get up early.” → She said ____","answers":["she would have to get up early.","that she would have to get up early."],"src":"SB 112 ex.a #2","origin":"book","explain_ar":"will ← would، وI ← she."},{"type":"fill","q":"“We've been to Hama before.” → She told me ____","answers":["they had been to Hama before.","that they had been to Hama before."],"src":"SB 112 ex.a #6","origin":"book","explain_ar":"المضارع التام يرجع ماضياً تاماً: have been ← had been، وwe ← they."},{"type":"fill","q":"“We didn't see everything.” → She said ____","answers":["they hadn't seen everything.","that they hadn't seen everything.","they had not seen everything.","that they had not seen everything."],"src":"SB 112 ex.a #7","origin":"book","explain_ar":"الماضي البسيط يرجع ماضياً تاماً (كما في saw ← had seen، WB 85)، والنفي يبقى: didn't see ← hadn't seen."},{"type":"fill","q":"William: “I am leaving later today.” → William said (that) ____","answers":["he was leaving later that day."],"src":"WB 86 ex.a #4","origin":"book","explain_ar":"am leaving ← was leaving، وtoday ← that day."},{"type":"fill","q":"The little boy to his mother: I ate all the cake yesterday. (ADMIT) → The little boy admitted (to his mother) (that) ____","answers":["he had eaten all the cake the day before.","he had eaten all the cake the previous day."],"src":"SB 124 Review 3 ex.2 #1","origin":"book","explain_ar":"ate ← had eaten، وyesterday ← the day before / the previous day."},{"type":"fill","q":"Karen to Nancy: I'm so proud of you. (TELL) → Karen told Nancy (that) ____","answers":["she was so proud of her."],"src":"SB 124 Review 3 ex.2 #2","origin":"book","explain_ar":"told + مفعول (Nancy)، وam ← was، وI ← she، وyou ← her."},{"type":"fill","q":"Fuad to his friend: The teachers are working on the exam results. (SAY) → Fuad said (that) ____","answers":["the teachers were working on the exam results."],"src":"SB 124 Review 3 ex.2 #5","origin":"book","explain_ar":"are working ← were working."},{"type":"fill","q":"Ahmad: I arrived yesterday. → I said ____","answers":["I had arrived the day before.","I had arrived the previous day.","that I had arrived the day before.","that I had arrived the previous day."],"src":"WB 99 Progress Test 3 ex.c #1","origin":"book","explain_ar":"المتكلم ينقل كلامه هو فيبقى I (WB 85)، وarrived ← had arrived، وyesterday ← the day before."}],"flags":[{"type":"unsure","ar":"SB 112 ex.a #7: وضعنا hadn't seen تطبيقاً لمثال الكتاب (saw ← had seen، WB 85). بعض المعلمين يقبلون didn't see.","src":"SB 112 ex.a #7"},{"type":"no_answer_in_book","ar":"الكتاب في الوحدة 11 لا يشرح نقل الأوامر والطلبات (told / asked + to)، ولا جدولاً كاملاً لتغير الأزمنة؛ التغييرات مأخوذة من أمثلة WB 85 فقط. لم نضف شيئاً من خارج الكتاب.","src":"SB 112–113 + WB 85–86"}]},{"id":"u11-reported-yes-no-questions","name_en":"Reported yes/no questions","name_ar":"نقل السؤال الذي جوابه نعم أو لا","branches":{"form":{"summary_ar":"لنقل سؤال جوابه نعم أو لا نستعمل asked أو wanted to know ثم if، ثم الفاعل والفعل بترتيب الجملة الخبرية، مع إرجاع الزمن خطوة إلى الماضي.","structure":"S + asked (+ object) / wanted to know + if + S + V (خطوة للماضي)","items":[{"ar":"نقل سؤال Do … ؟ بـ if.","en":"“Do you live in Damascus?” he asked Mary. → He wanted to know if Mary / she lived in Damascus.","src":"SB 112 ex.b (example)","kind":"book"},{"ar":"قاعدة الكتاب: if لنقل سؤال yes/no.","en":"in indirect speech. We use if when we report a yes/ no question. e.g. Have you been to Canada before? He asked me if I had been to Canada before.","src":"WB 94","kind":"book"}]},"negative":{"structure":"… if + S + V  (ترتيب خبري بلا do / does / did)","verb_change_ar":"صيغة السؤال تتحول إلى صيغة الخبر: تُحذف do/does/did ويأخذ الفعل الأساسي الزمن الماضي (Do you live ← she lived)، والمساعد الموجود يرجع خطوة ويأتي بعد الفاعل (Have you worked ← he had worked).","items":[{"ar":"صيغة السؤال تتحول إلى صيغة الخبر.","en":"b. the interrogative form of the verb changes to the affirmative form.","src":"WB 85","kind":"book"},{"ar":"Have you worked ← he had worked.","en":"“Have you worked before?” She asked him if he had worked before.","src":"WB 86 ex.b (example)","kind":"book"}]},"question":{"structure":"if + S + V …  (بلا قلب وبلا علامة استفهام)","aux_ar":"لا قلب بعد if: الفاعل قبل الفعل (if I had visited لا if had I visited)، ولا نضيف do/does/did، وتُحذف علامة الاستفهام.","items":[{"ar":"في الكلام المنقول لا نضع الفعل قبل الفاعل.","en":"Note: We do not put the verb before the subject: … in indirect speech.","src":"WB 94","kind":"book"}],"notes":[{"ar":"التغييرات اللازمة عند نقل الأسئلة.","en":"When we turn direct questions into indirect speech, the following changes are necessary: a. tenses, pronouns, possessive adjectives, adverbs of time and place b. the interrogative form of the verb changes to the affirmative form. c. the question mark is omitted in indirect questions.","src":"WB 85","kind":"book"}]},"signals":{"keywords":["asked","wanted to know","if","Do / Does / Did …?","Have …?","Are …?","Can …?","Would you like …?"],"items":[{"ar":"السؤال يبدأ بفعل مساعد (Do / Have / Are / Can / Would / Did) ← نقل بـ if.","en":"","src":"SB 113 + WB 86 ex.b","kind":"derived"},{"ar":"أفعال نقل السؤال في الكتاب: asked و wanted to know.","en":"He asked me … / He wanted to know …","src":"SB 112–113 ex.b","kind":"book"}]}},"questions":[{"type":"mcq","q":"My mother asked me if ____ my aunt.","options":["had I visited","I had visited","I will visit","will I visit"],"answer":1,"src":"WB 95 ex.a #4","origin":"book","explain_ar":"بعد if ترتيب خبري (الفاعل ثم الفعل) والزمن ماضٍ بعد asked ← I had visited."},{"type":"mcq","q":"“Have you ever been to London?” → He wanted to know ____","options":["if had I ever been to London.","if I have ever been to London?","if I had ever been to London."],"answer":2,"src":"SB 113 ex.b #7","origin":"adapted","explain_ar":"if + فاعل + had been، بلا قلب وبلا علامة استفهام."},{"type":"tf","statement":"We use if when we report a yes/ no question.","answer":true,"src":"WB 94","origin":"book","explain_ar":"هذه ملاحظة الكتاب نفسها."},{"type":"tf","statement":"The question mark is kept in indirect questions.","answer":false,"src":"WB 85","origin":"adapted","explain_ar":"في الكتاب: the question mark is omitted in indirect questions."},{"type":"fill","q":"“Are you going to the cinema at the weekend?” → He asked me ____","answers":["if I was going to the cinema at the weekend.","whether I was going to the cinema at the weekend."],"src":"SB 113 ex.b #2","origin":"book","explain_ar":"سؤال yes/no ← if، وare you going ← I was going."},{"type":"fill","q":"“Have you got any experience before?” → She asked him ____","answers":["if he had got any experience before.","if he had any experience before.","whether he had got any experience before.","whether he had any experience before."],"src":"WB 86 ex.b #3","origin":"book","explain_ar":"have you got ← he had got، بترتيب خبري."},{"type":"fill","q":"“Can you work seven days a week?” → She asked him ____","answers":["if he could work seven days a week."],"src":"WB 86 ex.b #4","origin":"book","explain_ar":"can you ← he could."},{"type":"fill","q":"“Do you have a car or do you prefer walking?” → She asked him ____","answers":["if he had a car or preferred walking.","if he had a car or if he preferred walking.","if he had a car or he preferred walking."],"src":"WB 86 ex.b #6","origin":"book","explain_ar":"تُحذف do ويأخذ الفعلان الماضي: have ← had، prefer ← preferred."},{"type":"fill","q":"Janet to Hala: Did someone ring you an hour ago? (WANT TO KNOW) → Janet wanted to know ____","answers":["if someone had rung Hala an hour before.","if someone had rung her an hour before."],"src":"SB 124 Review 3 ex.2 #3","origin":"book","explain_ar":"تُحذف did وring ← had rung، وyou ← her، وago ← before."},{"type":"fill","q":"Judy to Martin: Would you like to join me for lunch tomorrow? (ASK) → Judy asked Martin ____","answers":["if he would like to join her for lunch the next day.","if he would like to join her for lunch the following day."],"src":"SB 124 Review 3 ex.2 #4","origin":"book","explain_ar":"would you ← he would، me ← her، tomorrow ← the next / following day."},{"type":"fill","q":"John: Have you been to London before? → He asked me ____","answers":["if I had been to London before."],"src":"WB 99 Progress Test 3 ex.c #4","origin":"book","explain_ar":"have you been ← I had been، بلا قلب وبلا علامة استفهام."}],"flags":[]},{"id":"u11-reported-wh-questions","name_en":"Reported wh- questions","name_ar":"نقل السؤال الذي يبدأ بأداة استفهام","branches":{"form":{"summary_ar":"لنقل سؤال يبدأ بأداة استفهام (what, where, how, who, when, why…) نكرر الأداة نفسها بعد asked أو wanted to know، ثم الفاعل والفعل بترتيب الجملة الخبرية مع إرجاع الزمن.","structure":"S + asked (+ object) / wanted to know + wh-word + S + V (خطوة للماضي)","items":[{"ar":"What is …? ← what the time was.","en":"“What is the time?” he asked. → He asked me what the time was.","src":"SB 112 ex.b (example)","kind":"book"},{"ar":"Where is …? ← where the station was.","en":"He said, “Where is the station?” He asked where the station was.","src":"WB 85","kind":"book"},{"ar":"Where do you live? ← where he lived.","en":"“Where do you live?” She asked him where he lived.","src":"WB 86 ex.b (example)","kind":"book"}]},"negative":{"structure":"wh-word + S + V  (بلا do / does / did)","verb_change_ar":"تُحذف do/does/did ويأخذ الفعل الأساسي الزمن الماضي (Where do you live ← where he lived)، والماضي البسيط يصبح ماضياً تاماً (How was your exam ← how his exam had been)، والمساعد الموجود يرجع خطوة ويأتي بعد الفاعل (When can you start ← when he could start).","items":[{"ar":"was ← had been مع تغيير الضمير your ← his.","en":"Khaled to Sami: How was your exam? (ASK) → Khaled asked Sami how his exam had been.","src":"SB 124 Review 3 ex.2 (example)","kind":"book"},{"ar":"صيغة السؤال تتحول إلى صيغة الخبر.","en":"b. the interrogative form of the verb changes to the affirmative form.","src":"WB 85","kind":"book"}]},"question":{"structure":"wh-word + S + V …  (بلا قلب وبلا علامة استفهام)","aux_ar":"بعد أداة الاستفهام يأتي الفاعل ثم الفعل (where the station was لا where was the station)، بلا do/does/did وبلا علامة استفهام. ومثلها السؤال داخل سؤال أو جملة (Have you got any idea where … / I wonder what …).","items":[{"ar":"سؤال داخل سؤال: لا نضع الفعل قبل الفاعل.","en":"when we include a question in another question.(indirect questions) e.g. Where are my glasses? → Have you got any idea where my glasses are?","src":"WB 94","kind":"book"},{"ar":"سؤال داخل جملة.","en":"when we include a question in another sentence: e.g. I wonder what his lifestyle is like.","src":"WB 94","kind":"book"}],"notes":[{"ar":"التغييرات اللازمة عند نقل الأسئلة.","en":"When we turn direct questions into indirect speech, the following changes are necessary: a. tenses, pronouns, possessive adjectives, adverbs of time and place b. the interrogative form of the verb changes to the affirmative form. c. the question mark is omitted in indirect questions.","src":"WB 85","kind":"book"}]},"signals":{"keywords":["What","Where","How","How long","How much","Who","When","Why","What time","What kind of","asked","wanted to know"],"items":[{"ar":"السؤال يبدأ بأداة استفهام ← نكررها في النقل بدل if.","en":"What / Where / How / Who / When / Why …?","src":"SB 113 ex.b + WB 86 ex.b","kind":"derived"}]}},"questions":[{"type":"mcq","q":"“What time did the film start?” → My friend wanted to know ____","options":["what time did the film start.","what time the film had started.","what time had the film started."],"answer":1,"src":"SB 113 ex.b #5","origin":"adapted","explain_ar":"تُحذف did، والماضي البسيط يصبح had started، والفاعل قبل الفعل."},{"type":"mcq","q":"“Where is the key?” → My mother wanted to know ____","options":["where is the key.","where the key was.","where was the key?"],"answer":1,"src":"SB 113 ex.b #3","origin":"adapted","explain_ar":"ترتيب خبري (the key was) بلا علامة استفهام، وis ← was."},{"type":"tf","statement":"When we turn direct questions into indirect speech, the interrogative form of the verb changes to the affirmative form.","answer":true,"src":"WB 85","origin":"book","explain_ar":"هذه قاعدة الكتاب (b)."},{"type":"tf","statement":"He asked me what was the time.","answer":false,"src":"SB 112 ex.b (example)","origin":"adapted","explain_ar":"مثال الكتاب: He asked me what the time was (الفاعل قبل الفعل)."},{"type":"fill","q":"“How long does it take you to get home?” → He asked me ____","answers":["how long it took me to get home."],"src":"SB 113 ex.b #1","origin":"book","explain_ar":"تُحذف does وtake ← took، وyou ← me."},{"type":"fill","q":"“Who do you want to meet, sir?” → Sami asked Mr. Hamad ____","answers":["who he wanted to meet."],"src":"SB 113 ex.b #4","origin":"book","explain_ar":"تُحذف do وwant ← wanted، وyou ← he."},{"type":"fill","q":"“What kind of films do you like watching?” → Mary asked Natalie ____","answers":["what kind of films she liked watching."],"src":"SB 113 ex.b #6","origin":"book","explain_ar":"تُحذف do وlike ← liked، وyou ← she."},{"type":"fill","q":"“Why do you want the job?” → She asked him ____","answers":["why he wanted the job."],"src":"WB 86 ex.b #1","origin":"book","explain_ar":"تُحذف do وwant ← wanted."},{"type":"fill","q":"“How did you hear about it?” → She asked him ____","answers":["how he had heard about it."],"src":"WB 86 ex.b #2","origin":"book","explain_ar":"تُحذف did والماضي البسيط يصبح ماضياً تاماً: had heard."},{"type":"fill","q":"“How will you travel to work?” → She asked him ____","answers":["how he would travel to work."],"src":"WB 86 ex.b #5","origin":"book","explain_ar":"will you ← he would."},{"type":"fill","q":"“When can you start?” → She asked him ____","answers":["when he could start."],"src":"WB 86 ex.b #8","origin":"book","explain_ar":"can you ← he could."},{"type":"fill","q":"John: How long are you going to stay? → He asked me ____","answers":["how long I was going to stay."],"src":"WB 99 Progress Test 3 ex.c #2","origin":"book","explain_ar":"are you going ← I was going، بترتيب خبري."}],"flags":[]}]},{"unit":12,"unit_title":"Digital Literacy","grammar_title":"Inversion","pages":{"sb":[120,125],"wb":[94,95,99]},"rules":[{"id":"u12-inversion-never-rarely-seldom","name_en":"Inversion after Never / Rarely / Seldom / Hardly ever / No longer","name_ar":"القلب بعد Never و Rarely و Seldom و No longer","branches":{"form":{"summary_ar":"إذا بدأنا الجملة بظرف نفي أو تقليل (Never, Rarely, Seldom, Hardly ever, No longer) يتقدم الفعل المساعد على الفاعل كما في السؤال، وتبقى الجملة خبرية.","structure":"Never / Rarely / Seldom / Hardly ever / No longer + auxiliary + S + main verb …","items":[{"ar":"قاعدة الكتاب.","en":"When we begin a sentence with a limiting adverbial (e.g. seldom) or a negative adverbial (e.g. not only), the subject and the auxiliary verb are inverted.","src":"SB 120","kind":"book"},{"ar":"Seldom + did + الفاعل + المصدر.","en":"Seldom did they go to the football match.","src":"SB 120 ex.a #1","kind":"book"},{"ar":"Never + have + الفاعل + التصريف الثالث.","en":"Never have I been to London before.","src":"SB 120 ex.a #5","kind":"book"},{"ar":"Hardly ever + does + الفاعل + المصدر.","en":"e.g. Hardly ever does he come to work on time.","src":"WB 94","kind":"book"}]},"negative":{"structure":"Never / Seldom / Rarely … + auxiliary + S + V  (بلا not)","verb_change_ar":"هذه الظروف منفية أو شبه منفية بذاتها فلا نضيف not. مع Present/Past Simple نضيف do/does/did ويرجع الفعل الأساسي مصدراً (they went ← Seldom did they go)، ومع الأزمنة التي فيها مساعد (have / will / are) يتقدم المساعد نفسه (I have never seen ← Never have I seen).","items":[{"ar":"في المضارع والماضي البسيط يتفق الفاعل مع المساعد لا مع الفعل الأساسي.","en":"When using inversion with Present Simple and Past Simple, the subject must agree with the auxiliary not the main verb","src":"WB 94","kind":"book"},{"ar":"إذا كان الظرف في وسط الجملة (I have never seen / The guards seldom catch) فالترتيب عادي؛ القلب فقط حين يبدأ الظرف الجملة.","en":"","src":"WB 99 Progress Test 3 ex.d","kind":"derived"}]},"question":{"structure":"مساعد + فاعل + فعل (ترتيب السؤال) لكن الجملة خبرية وتنتهي بنقطة","aux_ar":"المساعد في المضارع البسيط do/does وفي الماضي البسيط did (جواب سؤال الكتاب SB 120 ex.b)، ومع الأزمنة الأخرى المساعد الموجود (have, will, are).","items":[{"ar":"سؤال الكتاب عن المساعد في القلب.","en":"What auxiliary is used when we invert Past Simple and Present Simple?","src":"SB 120 ex.b","kind":"book"}],"notes":[{"ar":"الترتيب العادي: الفاعل ثم الفعل؛ وفي القلب يأتي الفعل قبل الفاعل.","en":"In statements, the verb usually follows the subject: e.g. Mary missed her lessons last week. Sometimes we invert the subject and verb so that the verb comes before the subject.","src":"WB 94","kind":"book"}]},"signals":{"keywords":["Never","Rarely","Seldom","Hardly ever","No longer","limiting adverbial","negative adverbial","في أول الجملة"],"items":[{"ar":"أمثلة الكتاب على الظروف: seldom وrarely (limiting)، وnot only (negative).","en":"limiting adverbial (e.g. seldom) … negative adverbial (e.g. not only) / limiting adverbial (e.g. rarely)","src":"SB 120 + WB 94","kind":"book"},{"ar":"تمرين «ضع الكلمة في أول الجملة» ← قلب المساعد مع الفاعل.","en":"Rewrite the sentences by putting the words in italics at the beginning and making any other necessary changes.","src":"WB 99 Progress Test 3 ex.d","kind":"book"}]}},"questions":[{"type":"mcq","q":"Rarely ____ anyone using carriages nowadays.","options":["you see","will you see","you will see","you have seen"],"answer":1,"src":"WB 95 ex.a #1","origin":"book","explain_ar":"Rarely في أول الجملة ← المساعد will قبل الفاعل you."},{"type":"mcq","q":"(Not only / Rarely) do you see top-rate cameras which are also easy to use.","options":["Not only","Rarely"],"answer":1,"src":"SB 125 Review 3 ex.4 #1","origin":"book","explain_ar":"المعنى «نادراً ما ترى…»، وNot only تحتاج جزءاً ثانياً يضيف شيئاً ← Rarely."},{"type":"mcq","q":"(Never I have seen / Never have I seen) such a dramatic end to a football match.","options":["Never I have seen","Never have I seen"],"answer":1,"src":"SB 125 Review 3 ex.4 #2","origin":"book","explain_ar":"Never في أول الجملة ← have قبل I."},{"type":"tf","statement":"Never John had been to such a fantastic restaurant.","answer":false,"src":"SB 120 ex.c #1 (find four mistakes)","origin":"book","explain_ar":"خطأ: بعد Never نقلب ← Never had John been to such a fantastic restaurant."},{"type":"tf","statement":"Rarely I want to be associated with this project.","answer":false,"src":"SB 120 ex.c #2 (find four mistakes)","origin":"book","explain_ar":"خطأ: مضارع بسيط بعد Rarely ← Rarely do I want to be associated with this project."},{"type":"tf","statement":"Seldom do I leave my house so early.","answer":true,"src":"SB 120 ex.c #4 (find four mistakes)","origin":"book","explain_ar":"صحيحة: do قبل I والفعل leave مصدر."},{"type":"fill","q":"(Never/ I/ meet) ____ such well-behaved children before. They are as good as gold.","answers":["Never have I met"],"src":"WB 95 ex.b #1","origin":"book","explain_ar":"before تدل على المضارع التام، وNever في البداية ← have قبل I."},{"type":"fill","q":"(Seldom/ we/ read) ____ newspapers nowadays.","answers":["Seldom do we read"],"src":"WB 95 ex.b #3","origin":"book","explain_ar":"مضارع بسيط (nowadays) ← نضيف do قبل we والفعل مصدر."},{"type":"fill","q":"Rewrite with the word in italics at the beginning (seldom): The reserve guards seldom catch illegal hunters. → ____","answers":["Seldom do the reserve guards catch illegal hunters."],"src":"WB 99 Progress Test 3 ex.d #3","origin":"book","explain_ar":"مضارع بسيط ← do قبل الفاعل (جمع) والفعل catch مصدر."},{"type":"fill","q":"Rewrite with the word in italics at the beginning (never): I have never seen such a wonderful waterfall before. → ____","answers":["Never have I seen such a wonderful waterfall before."],"src":"WB 99 Progress Test 3 ex.d #4","origin":"book","explain_ar":"المساعد have موجود فيتقدم على I."},{"type":"fill","q":"Rewrite with the words in italics at the beginning (no longer): There are no longer any tigers in the northern region. → ____","answers":["No longer are there any tigers in the northern region."],"src":"WB 99 Progress Test 3 ex.d #5","origin":"book","explain_ar":"No longer في البداية ← are قبل there."}],"flags":[]},{"id":"u12-inversion-hardly-no-sooner","name_en":"Inversion after Hardly ... when / No sooner ... than","name_ar":"القلب بعد Hardly … when و No sooner … than","branches":{"form":{"summary_ar":"لحدث وقع مباشرة بعد حدث آخر في الماضي: نبدأ بـ Hardly أو No sooner ثم had + الفاعل + التصريف الثالث، ثم when (مع Hardly) أو than (مع No sooner) وبعدها ماضٍ بسيط.","structure":"Hardly + had + S + p.p. + when + S + V2  |  No sooner + had + S + p.p. + than + S + V2","items":[{"ar":"Hardly … when.","en":"Hardly had the play started when there was a disturbance in the audience.","src":"SB 120 ex.a #2","kind":"book"},{"ar":"Hardly ظرف تقليل في أول الجملة فيتقدم المساعد.","en":"When we begin a sentence with a limiting adverbial (e.g. seldom) or a negative adverbial (e.g. not only), the subject and the auxiliary verb are inverted.","src":"SB 120","kind":"book"}]},"negative":{"structure":"Hardly / No sooner + had + S + p.p. …  (بلا not)","verb_change_ar":"Hardly وNo sooner تحملان معنى النفي فلا نضيف not. الفعل الأول ماضٍ تام ويتقدم had على الفاعل، والفعل بعد when/than ماضٍ بسيط بترتيب عادي. وإذا جاءت Hardly مع ماضٍ بسيط بلا when نستعمل did والفعل مصدر (Hardly did he understand).","items":[{"ar":"had يتقدم على الفاعل في الجزء الأول، والجزء بعد when ماضٍ بسيط بلا قلب.","en":"","src":"SB 120 ex.a #2","kind":"derived"},{"ar":"مع الماضي البسيط: did + فاعل + مصدر (تصحيح بند الأخطاء #5).","en":"","src":"SB 120 ex.c #5","kind":"derived"}]},"question":{"structure":"had + S + p.p. بعد Hardly / No sooner، ثم when / than + جملة عادية","aux_ar":"المساعد هنا had (ماضٍ تام) ويتقدم على الفاعل في الجزء الأول فقط، أما الجزء بعد when/than فلا قلب فيه.","items":[{"ar":"Hardly يقابلها when، وNo sooner يقابلها than في أمثلة الكتاب.","en":"Hardly had … when … / No sooner had … than …","src":"SB 120 ex.a #2, ex.c #3","kind":"book"}],"notes":[{"ar":"في المضارع والماضي البسيط يتفق الفاعل مع المساعد لا مع الفعل الأساسي.","en":"When using inversion with Present Simple and Past Simple, the subject must agree with the auxiliary not the main verb","src":"WB 94","kind":"book"}]},"signals":{"keywords":["Hardly … when","No sooner … than","had + p.p.","حدث بعد حدث مباشرة"],"items":[{"ar":"حدثان متتاليان في الماضي والجملة تبدأ بـ Hardly أو No sooner ← had + فاعل + p.p.","en":"","src":"SB 120 + WB 95 ex.b #2","kind":"derived"}]}},"questions":[{"type":"mcq","q":"____ to dinner than there was a knock on the door. (No sooner/ my brother/ sit down)","options":["No sooner my brother had sat down","No sooner had my brother sat down","No sooner did my brother sat down"],"answer":1,"src":"WB 95 ex.b #2","origin":"adapted","explain_ar":"No sooner ← had قبل الفاعل ثم التصريف الثالث sat."},{"type":"tf","statement":"No sooner had they eaten dinner than the ceiling crashed onto the dining table.","answer":true,"src":"SB 120 ex.c #3 (find four mistakes)","origin":"book","explain_ar":"صحيحة: had قبل they، وthan بعد No sooner."},{"type":"tf","statement":"Hardly he understood about the situation.","answer":false,"src":"SB 120 ex.c #5 (find four mistakes)","origin":"book","explain_ar":"خطأ: ماضٍ بسيط بعد Hardly ← Hardly did he understand about the situation."},{"type":"fill","q":"Rewrite with the word in italics at the beginning (hardly): I'd hardly unpacked in my hotel room when my phone rang. → ____","answers":["Hardly had I unpacked in my hotel room when my phone rang."],"src":"WB 99 Progress Test 3 ex.d #2","origin":"book","explain_ar":"I'd = I had، فيتقدم had على I، والجزء بعد when بلا قلب."}],"flags":[]},{"id":"u12-inversion-not-only-only","name_en":"Inversion after Not only / Only after / Only when","name_ar":"القلب بعد Not only و Only after و Only when","branches":{"form":{"summary_ar":"إذا بدأت الجملة بـ Not only قبل فعل، أو بـ Only after / Only when + جملة، يتقدم الفعل المساعد على فاعل الجملة الرئيسية.","structure":"Not only + aux + S + V …, (but) S + also …  |  Only after / Only when + clause, aux + S + V","items":[{"ar":"Not only + does + الفاعل + المصدر.","en":"Not only does he speak English, he speaks French.","src":"SB 120 ex.a #3","kind":"book"},{"ar":"مثال الكتاب مع was.","en":"Not only was Jack famous for helping people, but he was also the first man to establish a charity in his country.","src":"WB 94","kind":"book"}]},"negative":{"structure":"Not only + aux + S + V …  (بلا not إضافية)","verb_change_ar":"مع Present/Past Simple نضيف do/does/did ويرجع الفعل مصدراً (he made ← Not only did he make). وبعد Only after / Only when تبقى الجملة الأولى بترتيب عادي، والقلب في الجملة الرئيسية بعدها (we saw ← did we see).","items":[{"ar":"في المضارع والماضي البسيط يتفق الفاعل مع المساعد لا مع الفعل الأساسي.","en":"When using inversion with Present Simple and Past Simple, the subject must agree with the auxiliary not the main verb","src":"WB 94","kind":"book"}]},"question":{"structure":"Not only + aux + S + V …, but + S + also + V","aux_ar":"الجزء الأول فقط مقلوب (does he speak / was Jack)، والجزء الثاني بعد but ترتيبه عادي ومعه also (but he was also …).","items":[{"ar":"الجزء الثاني بترتيب عادي مع also.","en":"… new products, but he also did experiments.","src":"WB 95 ex.b #4","kind":"book"}],"notes":[{"ar":"not only مثال الكتاب على negative adverbial.","en":"When we begin a sentence with a limiting adverbial (e.g. seldom) or a negative adverbial (e.g. not only), the subject and the auxiliary verb are inverted.","src":"SB 120","kind":"book"}]},"signals":{"keywords":["Not only (+ فعل)","but … also","Only after","Only when","It was only when … that …"],"items":[{"ar":"«It was only when … that …» ← Only when … + مساعد + فاعل + فعل.","en":"It was only when we arrived in India that we saw elephants and tigers.","src":"WB 99 Progress Test 3 ex.d #1","kind":"book"},{"ar":"Only قبل اسم فاعل (Only the two members …) لا تسبب قلباً، أما Only after / Only when + جملة فتسببه.","en":"","src":"SB 125 Review 3 ex.4 #4 + WB 95 ex.a #2","kind":"derived"}]}},"questions":[{"type":"mcq","q":"Only after he had graduated, ____ to London to study.","options":["he travelled","he had travelled","did he travel","he has travelled"],"answer":2,"src":"WB 95 ex.a #2","origin":"book","explain_ar":"Only after + جملة في البداية ← قلب في الجملة الرئيسية: did he travel."},{"type":"mcq","q":"Only the two members of our school team (managed / did they manage) to finish the race.","options":["managed","did they manage"],"answer":0,"src":"SB 125 Review 3 ex.4 #4","origin":"book","explain_ar":"Only هنا قبل الفاعل نفسه (the two members) فلا قلب ← managed."},{"type":"tf","statement":"When we begin a sentence with a negative adverbial (e.g. not only), the subject and the auxiliary verb are inverted.","answer":true,"src":"SB 120","origin":"book","explain_ar":"هذه قاعدة الكتاب."},{"type":"tf","statement":"Not only he speaks English, he speaks French.","answer":false,"src":"SB 120 ex.a #3","origin":"adapted","explain_ar":"جملة الكتاب: Not only does he speak English (مساعد does قبل he)."},{"type":"fill","q":"(Not only/ he/ make) ____ new products, but he also did experiments.","answers":["Not only did he make"],"src":"WB 95 ex.b #4","origin":"book","explain_ar":"ماضٍ بسيط ← did قبل he والفعل make مصدر."},{"type":"fill","q":"Rewrite with the words in italics at the beginning (only when): It was only when we arrived in India that we saw elephants and tigers. → ____","answers":["Only when we arrived in India did we see elephants and tigers."],"src":"WB 99 Progress Test 3 ex.d #1","origin":"book","explain_ar":"الجملة بعد Only when بلا قلب، والقلب في الرئيسية: saw ← did we see."}],"flags":[{"type":"unsure","ar":"WB 94 يقول إن الفاعل يتفق مع المساعد في قلب Present/Past Simple، لكن مثاله «Not only was Jack famous…» فيه was وليس do/does/did، فلا يوضّح القاعدة. أبقيناه كما هو وأضفنا مثال SB 120 (does he speak).","src":"WB 94"},{"type":"unsure","ar":"Only after / Only when غير مذكورتين صراحة في صندوق القاعدة (SB 120، WB 94)، لكنهما في تمارين الكتاب (WB 95 ex.a #2، WB 99 ex.d #1).","src":"WB 95 + WB 99"}]},{"id":"u12-inversion-so-here-conditional","name_en":"Other inversion: so / neither / nor, Here comes / There goes, question tags, if omitted","name_ar":"حالات أخرى للقلب: so / neither / nor، و Here comes، وأسئلة التذييل، والشرط بلا if","branches":{"form":{"summary_ar":"حالات أخرى للقلب في الكتاب: بعد so / neither / nor في الرد، وفي Here comes / There goes + اسم، وفي أسئلة التذييل، وفي جملة الشرط حين تُحذف if.","structure":"So / Neither / Nor + aux + S  |  Here comes / There goes + noun  |  Were + S …, S + would …","items":[{"ar":"بعد neither / nor.","en":"A: I didn't know there was a library here. B: Neither/ nor did I.","src":"WB 94","kind":"book"},{"ar":"Here comes + اسم.","en":"Here comes the professor.","src":"WB 94","kind":"book"},{"ar":"سؤال التذييل.","en":"We have to wear formal clothes, don't we?","src":"WB 94","kind":"book"},{"ar":"حذف if في الشرط.","en":"Were I you, I would accept the offer.","src":"WB 94","kind":"book"}]},"negative":{"structure":"Neither / Nor + aux مثبت + S","verb_change_ar":"بعد Neither / Nor يأتي مساعد مثبت لأن الأداة منفية بذاتها (Neither did I). وفي الشرط المقلوب يتقدم Were على الفاعل بدل If I were.","items":[{"ar":"رد على جملة منفية بمساعد مثبت.","en":"Neither/ nor did I.","src":"WB 94","kind":"book"},{"ar":"If I were you ← Were I you.","en":"Were I you, I would study more.","src":"SB 120 ex.a #4","kind":"book"}]},"question":{"structure":"Here + pronoun + verb (بلا قلب)  |  …, don't we?","aux_ar":"مع الضمائر لا نقلب بعد Here / There (Here they come لا Here come they). وفي سؤال التذييل يأتي المساعد المنفي قبل الضمير (don't we?).","items":[{"ar":"لا قلب مع الضمير.","en":"We can't use inversion when we use pronouns with Here come(s) or There go(es): Here they come, not Here come they.","src":"WB 94","kind":"book"}],"notes":[{"ar":"قائمة استعمالات القلب في الكتاب.","en":"We use inversion: • after so/ neither/ nor • in the phrases Here come/comes + noun and There goes/ go + noun • in question tags • When we begin a sentence with a limiting adverbial (e.g. rarely) or a negative adverbial (e.g. not only) • in conditional sentences when if is omitted.","src":"WB 94","kind":"book"}]},"signals":{"keywords":["So …","Neither …","Nor …","Here comes","There goes","Were I you","question tag","if omitted"],"items":[{"ar":"جملة شرط تبدأ بفعل (Were / Should) بلا if ← قلب.","en":"","src":"SB 120 ex.a #4 + SB 125 Review 3 ex.4 #5","kind":"derived"},{"ar":"Here / There + ضمير ← ترتيب عادي؛ Here / There + اسم ← قلب.","en":"Here comes the professor. / Here they come","src":"WB 94","kind":"book"}]}},"questions":[{"type":"mcq","q":"(Should / Were) the alarm ring, leave the building immediately.","options":["Should","Were"],"answer":0,"src":"SB 125 Review 3 ex.4 #5","origin":"book","explain_ar":"شرط بلا if مع فعل ring (مصدر) ← Should؛ Were تأتي مع be (Were I you)."},{"type":"mcq","q":"There ____ to hold a meeting.","options":["goes he","he goes","went he","he went"],"answer":1,"src":"WB 95 ex.a #5","origin":"book","explain_ar":"قاعدة الكتاب (WB 94): There goes/go + اسم، ومع الضمير ما في قلب: There he goes. فالجواب he goes."},{"type":"tf","statement":"I were there, I would give them a hand.","answer":false,"src":"SB 120 ex.c #6 (find four mistakes)","origin":"book","explain_ar":"خطأ: حين تُحذف if نقلب ← Were I there, I would give them a hand."},{"type":"tf","statement":"Here come they.","answer":false,"src":"WB 94","origin":"book","explain_ar":"الكتاب: Here they come, not Here come they (لا قلب مع الضمير)."},{"type":"fill","q":"(Here/ arrive/ the boss) ____ on time.","answers":["Here arrives the boss"],"src":"WB 95 ex.b #5","origin":"book","explain_ar":"Here + اسم (the boss) ← قلب، والفعل مفرد مع the boss: arrives."}],"flags":[{"type":"unsure","ar":"WB 95 ex.b #5 «Here arrives the boss on time» جملة غير مألوفة، لكنها تطبيق مباشر لقاعدة Here + verb + noun في WB 94.","src":"WB 95 ex.b #5"},{"type":"unsure","ar":"SB 125 Review 3 ex.4 #5 يطلب Should في الشرط المقلوب، والصندوق (WB 94) يعطي مثال Were I you فقط.","src":"SB 125 + WB 94"},{"type":"unsure","ar":"WB 95 ex.a #5: الكتاب ما عطى مفتاح، و«he went» مقبولة نحوياً كمان. اعتمدنا «he goes» لأنو التعبير بصندوق الكتاب There goes بالمضارع.","src":"WB 95 ex.a #5"}]},{"id":"u12-no-inversion","name_en":"No inversion: indirect questions and reported speech","name_ar":"متى لا نقلب: السؤال غير المباشر والكلام المنقول","branches":{"form":{"summary_ar":"لا نضع الفعل قبل الفاعل في: السؤال داخل سؤال (السؤال غير المباشر)، والسؤال داخل جملة، وبعد أداة استفهام تبدأ عبارة، وفي الكلام المنقول (if لسؤال yes/no).","structure":"… + wh-word / if + S + V  (ترتيب خبري)","items":[{"ar":"سؤال داخل سؤال.","en":"when we include a question in another question.(indirect questions) e.g. Where are my glasses? → Have you got any idea where my glasses are?","src":"WB 94","kind":"book"},{"ar":"سؤال داخل جملة.","en":"when we include a question in another sentence: e.g. I wonder what his lifestyle is like.","src":"WB 94","kind":"book"},{"ar":"أداة استفهام تبدأ عبارة.","en":"when we use a question word to introduce a relative clause in phrases: e.g. I wonder why he was sad.","src":"WB 94","kind":"book"},{"ar":"الكلام المنقول.","en":"in indirect speech. We use if when we report a yes/ no question. e.g. Have you been to Canada before? He asked me if I had been to Canada before.","src":"WB 94","kind":"book"}]},"negative":{"structure":"… wh-word + S + aux / V …  (بلا do / does / did وبلا قلب)","verb_change_ar":"حين يدخل السؤال في جملة أو سؤال آخر يفقد ترتيب السؤال: يعود المساعد بعد الفاعل (Where are my glasses? ← where my glasses are)، وتُحذف do/does/did إن وجدت.","items":[{"ar":"are تعود بعد الفاعل my glasses.","en":"Where are my glasses? → Have you got any idea where my glasses are?","src":"WB 94","kind":"book"},{"ar":"can I meet ← I can meet داخل السؤال غير المباشر (تطبيق القاعدة على WB 95 ex.a #3).","en":"","src":"WB 95 ex.a #3","kind":"derived"}]},"question":{"structure":"Have you got any idea + wh-word + S + V ?  |  I wonder + wh-word + S + V .","aux_ar":"علامة الاستفهام تتبع الجملة الخارجية: Have you got any idea …? تنتهي بـ ? لأنها هي السؤال، أما I wonder … فتنتهي بنقطة. والسؤال الداخلي ترتيبه خبري دائماً.","items":[{"ar":"الجملة الخارجية سؤال ← ? في النهاية.","en":"Have you got any idea where my glasses are?","src":"WB 94","kind":"book"},{"ar":"الجملة الخارجية خبرية ← نقطة.","en":"I wonder why he was sad.","src":"WB 94","kind":"book"}],"notes":[{"ar":"ملاحظة الكتاب: لا نضع الفعل قبل الفاعل في هذه الحالات.","en":"Note: We do not put the verb before the subject:","src":"WB 94","kind":"book"}]},"signals":{"keywords":["Have you got any idea …","I wonder …","I have no idea","asked me if …","wanted to know"],"items":[{"ar":"عبارة تمهيدية قبل السؤال ← لا قلب.","en":"Have you got any idea … / I wonder …","src":"WB 94","kind":"book"},{"ar":"جملة استفهام في أول الجملة ثم «I have no idea» ← ترتيب خبري.","en":"…, I have no idea.","src":"SB 125 Review 3 ex.4 #3","kind":"book"}]}},"questions":[{"type":"mcq","q":"Have you got any idea where ____ Sami?","options":["can I meet","I can meet","do I meet","have I met"],"answer":1,"src":"WB 95 ex.a #3","origin":"book","explain_ar":"سؤال داخل سؤال ← ترتيب خبري: I can meet."},{"type":"mcq","q":"(What he is talking about / What is he talking about), I have no idea.","options":["What he is talking about","What is he talking about"],"answer":0,"src":"SB 125 Review 3 ex.4 #3","origin":"book","explain_ar":"السؤال جزء من جملة «I have no idea» ← الفاعل قبل الفعل: he is."},{"type":"tf","statement":"We do not put the verb before the subject when we include a question in another question.","answer":true,"src":"WB 94","origin":"book","explain_ar":"هذه ملاحظة الكتاب (indirect questions)."},{"type":"tf","statement":"Have you got any idea where are my glasses?","answer":false,"src":"WB 94","origin":"adapted","explain_ar":"مثال الكتاب: Have you got any idea where my glasses are?"},{"type":"fill","q":"I wonder (what/ my sister/ do/ can/ solve/ to/ the problem) ____","answers":["what my sister can do to solve the problem."],"src":"WB 95 ex.b #6","origin":"book","explain_ar":"سؤال داخل جملة I wonder ← ترتيب خبري: my sister can do."}],"flags":[]}]}]}],"exam":{"1":{"level":"دايماً","ar":"تصريف الأزمنة إجا بكل ورقة فحصناها (2017–2026). بـ2026: «صحّح الأفعال» 3 بنود × 6 علامات، وبـ2022–2024 بنود اختيار × 5. السلّم: لازم الصيغة الكاملة للزمن وإلا صفر."},"2":{"level":"دايماً","ar":"الماضي البسيط والمستمر والتام إجوا بتصحيح الأفعال والاختيار بأغلب السنين (مثلاً: was driving 2020، had finished 2018، had been talking 2024، ماضي تام بـ2026: 6 علامات). وبـ2026 تكملة جملة بماضي مستمر (6)."},"3":{"level":"دايماً","ar":"المبني للمجهول بكل أوراق العلمي 2017–2024 وبـ2026. بـ2026 تحويل عليه 8 علامات (الفاعل 3 + will be 3 + exhibited 2)، ونسيان be بيصفّر البند كلو."},"4":{"level":"دايماً","ar":"التسبيب (have/get something done) بكل الأوراق 2017–2024 وبـ2026: تحويل 8 علامات (had the windows cleaned). بسلّم 2020–2024: «الخطوات الأربع شرط وإلا صفر»."},"5":{"level":"كتير","ar":"الأسماء الموصولة بكل أوراق 2022–2024 (whose، which، whom، where: 5 علامات)، وبـ2019 كلمة وظيفية، وبـ2026 whose (6 علامات)."},"6":{"level":"دايماً","ar":"المستقبل إجا تقريباً كل سنة بتصحيح الأفعال والاختيار: will / going to / مستقبل مستمر / مستقبل تام (بـ2026: 6 علامات)، والمضارع البسيط بعد when و as soon as (2022، 2024)."},"7":{"level":"دايماً","ar":"الشرط إجا بـ13 ورقة من 14 (2017–2024)، وبـ2026 تكملة جملة شرطية نوع تالت (6 علامات)."},"8":{"level":"دايماً","ar":"I wish بكل الأوراق 2017–2024 وبـ2026: تحويل 8 علامات، وإذا الفعل ما رجع للماضي البند صفر."},"9":{"level":"أحياناً","ar":"both…and و neither…nor مع اتفاق الفعل بـ«Choose the wrong part» بـ2024 (د1 ود2، 3 علامات)، و either…or باختيار 2026 (6 علامات)."},"10":{"level":"كتير","ar":"الأفعال الناقصة: استنتاج must be / can't be بـ2018 و2020 (6 علامات)، و should بـ«Choose the wrong part» 2024، و should/must كلمة وظيفية بـ2026 (6)."},"11":{"level":"دايماً","ar":"الكلام المنقول بكل الأوراق 2017–2024 وبـ2026 (سؤال منقول، 8 علامات). السلّم: الفعل لازم يرجع ماضي وإلا هالنص صفر."},"12":{"level":"أحياناً","ar":"القلب إجا بـ«Choose the wrong part» بـ2024 د1 (Rarely she does → does she، 3 علامات)، وبـ2026 كلمة وظيفية «Never ___ I been» (6 علامات)."}}}</script>
<script>
(function () {
  'use strict';
  var KEY = 'mx-en-grammar-v1';
  var COLORS = ['#FF6B35', '#3B82F6', '#7C3AED', '#0D9488'];
  var NUMS = ['١', '٢', '٣', '٤'];
  var BRANCH_TITLES = ['الشرح والاستعمال وشكل الجملة', 'النفي وتغيّر الفعل', 'السؤال والفعل المساعد', 'الدلالات والكلمات المفتاحية'];
  var BRANCH_KEYS = ['form', 'negative', 'question', 'signals'];
  var TABS = [['mcq', 'اختر الإجابة'], ['tf', 'صح وخطأ'], ['fill', 'املأ الفراغ']];
  var FLAG_LABELS = { book_typo: 'تنبيه: غلطة مطبعية بالكتاب', unsure: 'تنبيه: هذه النقطة بحاجة إلى تأكيد', no_answer_in_book: 'تنبيه: الكتاب لا يعطي الإجابة' };
  var BOOKS = { WB: 'كتاب الأنشطة', SB: 'كتاب الأساس' };
  var SVGNS = 'http://www.w3.org/2000/svg';

  var DATA;
  try { DATA = JSON.parse(document.getElementById('grammar-data').textContent); } catch (e) { DATA = null; }
  if (!DATA || !Array.isArray(DATA.modules)) DATA = { modules: [], exam: {} };
  var EXAM = DATA.exam || {};

  // ---------- عناصر DOM: createElement + textNode بس (ولا HTML نصّي من البيانات) ----------
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { for (var i = 0; i < c.length; i++) add(el, c[i]); return; }
    if (typeof c === 'string' || typeof c === 'number') el.appendChild(document.createTextNode(String(c)));
    else el.appendChild(c);
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function str(v) { return typeof v === 'string' ? v : ''; }

  // ---------- فهرس ----------
  var RULES = [], BYID = {}, UNITS = [];
  DATA.modules.forEach(function (m, mi) {
    (m.units || []).forEach(function (u, ui) {
      var unitRec = { m: m, u: u, mi: mi, ui: ui, rules: [] };
      UNITS.push(unitRec);
      (u.rules || []).forEach(function (r, ri) {
        var x = { m: m, u: u, r: r, mi: mi, ui: ui, ri: ri, unit: unitRec, i: RULES.length };
        RULES.push(x); unitRec.rules.push(x); BYID[r.id] = x;
      });
    });
  });

  // ---------- التخزين (ملفوف: بعض العارضات بتمنعه) ----------
  var S = loadState();
  function loadState() {
    try {
      var raw = window.localStorage.getItem(KEY);
      var o = raw ? JSON.parse(raw) : null;
      if (o && typeof o === 'object' && !Array.isArray(o)) {
        if (!o.ans || typeof o.ans !== 'object' || Array.isArray(o.ans)) o.ans = {};
        return o;
      }
    } catch (e) { /* التخزين ممنوع أو خربان: منكمّل بالذاكرة */ }
    return { v: 1, last: null, ans: {} };
  }
  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* منكمّل بلا حفظ */ } }

  // ---------- مساعدات ----------
  function qText(q) { return q.type === 'tf' ? str(q.statement) : str(q.q); }
  function qkey(q) {
    var t = q.type + '|' + qText(q).trim(), hs = 2166136261;
    for (var i = 0; i < t.length; i++) { hs ^= t.charCodeAt(i); hs = Math.imul(hs, 16777619) >>> 0; }
    return q.type + hs.toString(36);
  }
  function norm(s) {
    return String(s).replace(/[‘’`´ʼ]/g, "'").replace(/[“”]/g, '"').trim().toLowerCase()
      .replace(/\s+/g, ' ').replace(/\s+([,.?!;:])/g, '$1').replace(/[.!?;,\s]+$/, '');
  }
  // الاختصار والصيغة الكاملة سوا: 'll = will، n't = not، 'd = would أو had، he's = he is أو he has
  var AMB = [[/(^|[a-z])'d\b/, [' would', ' had']], [/(^|\bhe|\bshe|\bit|\bthat|\bthere|\bwhat|\bwho|\bwhere|\bhow|\bhere)'s\b/, [' is', ' has']]];
  function variants(s) {
    var b = norm(s).replace(/\bwon't\b/g, 'will not').replace(/\bshan't\b/g, 'shall not').replace(/\bcan't\b/g, 'can not')
      .replace(/\bcannot\b/g, 'can not').replace(/n't\b/g, ' not').replace(/'ll\b/g, ' will').replace(/'m\b/g, ' am')
      .replace(/'re\b/g, ' are').replace(/'ve\b/g, ' have');
    var out = [b], guard = 0;
    for (var k = 0; k < AMB.length; k++) {
      var next = [];
      out.forEach(function (x) {
        var stack = [x];
        while (stack.length && guard++ < 64) {
          var y = stack.pop(), m = AMB[k][0].exec(y);
          if (!m) { next.push(y); continue; }
          AMB[k][1].forEach(function (rep) { stack.push(y.slice(0, m.index) + m[1] + rep + y.slice(m.index + m[0].length)); });
        }
      });
      out = next;
    }
    return out.map(function (x) { return x.replace(/\s+/g, ' ').trim(); });
  }
  function isOk(q, v) {
    if (q.type === 'mcq' || q.type === 'tf') return v === q.answer;
    if (q.type === 'fill') {
      var uv = variants(v);
      return (q.answers || []).some(function (a) { var av = variants(a); return av.some(function (x) { return uv.indexOf(x) >= 0; }); });
    }
    return false;
  }
  function validStored(q, v) {
    if (q.type === 'mcq') return typeof v === 'number' && v >= 0 && v < (q.options || []).length;
    if (q.type === 'tf') return typeof v === 'boolean';
    if (q.type === 'fill') return typeof v === 'string' && v.trim() !== '';
    return false;
  }
  function bag(id) { var b = S.ans[id]; return b && typeof b === 'object' ? b : null; }
  function stored(x, q) {
    var b = bag(x.r.id), k = qkey(q);
    if (!b || !Object.prototype.hasOwnProperty.call(b, k)) return undefined;
    return validStored(q, b[k]) ? b[k] : undefined;
  }
  function stats(x) {
    var qs = x.r.questions || [], ok = 0, done = 0;
    qs.forEach(function (q) { var v = stored(x, q); if (v !== undefined) { done++; if (isOk(q, v)) ok++; } });
    return { ok: ok, done: done, total: qs.length };
  }
  // أرقام الصفحات والمجالات: معزولة LTR وما بتنكسر عند الشرطة (105–109 بتضل سوا)
  var LRI = String.fromCharCode(0x2066), PDI = String.fromCharCode(0x2069), WJ = String.fromCharCode(0x2060);
  function rng(s) { return LRI + String(s).trim().replace(/\s*[-–]\s*/g, WJ + '–' + WJ) + PDI; }
  function numList(s) { return s.split(/\s*,\s*/).filter(Boolean).map(rng).join('، '); }
  var SRC_TOKENS = [
    [/^review\s+(\d+)/i, function (m) { return 'مراجعة ' + rng(m[1]); }],
    [/^progress\s+test\s+(\d+)/i, function (m) { return 'اختبار التقدّم ' + rng(m[1]); }],
    [/^\(?grammar\s+bank\)?/i, function () { return 'Grammar Bank'; }],
    [/^grammar(?:\s+([a-z])\b)?/i, function (m) { return 'القواعد' + (m[1] ? ' ' + m[1] : ''); }],
    [/^(?:exercise\s*|ex\s*\.\s*|ex\s+)([a-z0-9]+)/i, function (m) { return 'تمرين ' + m[1]; }],
    [/^#\s*\d+(?:\s*[-–]\s*\d+)?(?:\s*,\s*#?\s*\d+(?:\s*[-–]\s*\d+)?)*/, function (m) {
      var n = m[0].replace(/#/g, ''); return (/,/.test(n) ? 'بنود ' : 'بند ') + numList(n); }],
    [/^\(?(?:examples?|e\.g\.|sample)\)?/i, function () { return 'مثال'; }],
    [/^rules?(?:\s+(\d+(?:\s*[-–]\s*\d+)?))?/i, function (m) { return 'القواعد' + (m[1] ? ' ' + rng(m[1]) : ''); }],
    [/^\([^)]*\)/, function (m) { return m[0]; }],
    [/^,/, function () { return ''; }],
    [/^\S+/, function (m) { return m[0]; }]
  ];
  function srcOne(s) {
    var m = /^(WB|SB)\s*\.?\s*(\d+(?:\s*[-–]\s*\d+)?(?:\s*,\s*\d+(?:\s*[-–]\s*\d+)?)*)(?!\d)(.*)$/i.exec(s);
    if (!m) return s;
    var bits = [BOOKS[m[1].toUpperCase()] + ' ص' + numList(m[2])];
    var rest = m[3].trim(), guard = 0;

      if (q.type === 'mcq' || q.type === 'tf') {

          var val = q.type === 'mcq' ? oi : (oi === 0);
          b.disabled = true;
          var mk = b.querySelector('.mk');
          if (val === q.answer) { b.classList.add('right'); mk.textContent = '✓'; }
          else if (val === v) { b.classList.add('wrong'); mk.textContent = '✗'; }
          if (val === v) b.setAttribute('aria-pressed', 'true');
        });
        correctText = q.type === 'mcq' ? str((q.options || [])[q.answer]) : (q.answer ? 'صح' : 'خطأ');
      } else {
        input.value = v; input.readOnly = true; checkBtn.disabled = true;
        fillWrap.classList.add(ok ? 'right' : 'wrong');
        fillWrap.querySelector('.mk').textContent = ok ? '✓' : '✗';
        correctText = str((q.answers || [])[0]);
      }
      clear(fb);
      fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      fb.appendChild(h('p', { class: 'fb-h' }, ok ? '✓ إجابة صحيحة' : '✗ إجابة غير صحيحة'));
      if (!ok) {
        var others = q.type === 'fill' ? (q.answers || []).slice(1) : [];
        fb.appendChild(h('p', { class: 'fb-ans' }, 'الإجابة الصحيحة: ',
          h('span', { dir: q.type === 'tf' ? null : 'ltr', lang: q.type === 'tf' ? null : 'en' }, correctText),
          others.length ? [' (وتُقبل أيضاً: ', h('span', { dir: 'ltr', lang: 'en' }, others.join(' / ')), ')'] : null));
      }
      if (str(q.explain_ar)) fb.appendChild(h('p', { class: 'fb-ex' }, q.explain_ar));
      var origin = q.origin === 'book' ? 'من الكتاب' : q.origin === 'adapted' ? 'معدّل من الكتاب' : '';
      var src = [origin, srcLabel(q.src)].filter(Boolean).join(' · ');
      if (src) fb.appendChild(h('p', { class: 'fb-src' }, src));
      fb.hidden = false;
    }
    var prev = stored(x, q);
    if (prev !== undefined) paint(prev);
    return card;
  }

  function buildPager(x) {
    var prev = RULES[x.i - 1], next = RULES[x.i + 1];
    if (!prev && !next) return h('div');
    return h('nav', { class: 'pager', 'aria-label': 'التنقل بين القواعد' },
      prev ? h('button', { type: 'button', class: 'btn-line', 'data-go': 'prev', onclick: function () { go(prev.r.id, true); } }, '→ القاعدة السابقة') : h('span'),
      next ? h('button', { type: 'button', class: 'btn-line', 'data-go': 'next', onclick: function () { go(next.r.id, true); } }, 'القاعدة التالية ←') : h('span'));
  }

  // ---------- البحث ----------
  var qIn = document.getElementById('q'), qClear = document.getElementById('qclear'), results = document.getElementById('results');
  var INDEX = RULES.map(function (x) {
    var r = x.r, f = [];
    f.push({ lab: 'اسم القاعدة', text: str(r.name_en), en: true });
    f.push({ lab: 'اسم القاعدة', text: str(r.name_ar), en: false });
    var b = r.branches || {};
    var kw = ((b.signals || {}).keywords || []);
    kw.forEach(function (k) { f.push({ lab: 'كلمة مفتاحية', text: str(k), en: true }); });
    BRANCH_KEYS.forEach(function (k) { ((b[k] || {}).items || []).forEach(function (it) { if (it && str(it.en)) f.push({ lab: 'مثال', text: it.en, en: true }); }); });
    (((b.question || {}).notes) || []).forEach(function (it) { if (it && str(it.en)) f.push({ lab: 'ملاحظة الكتاب', text: it.en, en: true }); });
    return { x: x, fields: f };
  });
  function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function arNorm(s) {
    var out = '', map = [];
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (/[\u064B-\u065F\u0670\u0640]/.test(c)) continue;
      if ('أإآٱ'.indexOf(c) > -1) c = 'ا'; else if (c === 'ى') c = 'ي'; else if (c === 'ة') c = 'ه';
      out += c; map.push(i);
    }
    return { out: out, map: map };
  }
  function search(q) {
    q = q.trim();
    if (q.length < 2) return [];
    var latin = /[A-Za-z]/.test(q), out = [];
    var re = null, qn = null;
    if (latin) {
      var words = q.replace(/[\u2018\u2019]/g, "'").split(/\s+/).map(reEsc);
      re = new RegExp('(^|[^A-Za-z0-9])(' + words.join('\\s+') + ')(?![A-Za-z0-9])', 'i');
    } else qn = arNorm(q).out;
    INDEX.forEach(function (ent) {
      var hits = 0, first = null;
      ent.fields.forEach(function (f) {
        if (!f.text || f.en !== latin) return;
        var s = -1, e = -1;
        if (latin) {
          var m = re.exec(f.text.replace(/[\u2018\u2019]/g, "'"));
          if (m) { s = m.index + m[1].length; e = s + m[2].length; }
        } else {
          var n = arNorm(f.text), k = n.out.indexOf(qn);
          if (k > -1) { s = n.map[k]; e = n.map[k + qn.length - 1] + 1; }
        }
        if (s > -1) { hits++; if (!first) first = { f: f, s: s, e: e }; }
      });
      if (hits) out.push({ x: ent.x, hits: hits, first: first });
    });
    return out;
  }
  function snippet(text, s, e, en) {
    var pad = 42, a = Math.max(0, s - pad), b = Math.min(text.length, e + pad);
    if (a > 0) { var sp = text.indexOf(' ', a); if (sp > -1 && sp < s) a = sp + 1; }
    if (b < text.length) { var sp2 = text.lastIndexOf(' ', b); if (sp2 > e) b = sp2; }
    return h('span', { dir: en ? 'ltr' : 'rtl', lang: en ? 'en' : null }, a > 0 ? '… ' : '', text.slice(a, s), h('mark', null, text.slice(s, e)), text.slice(e, b), b < text.length ? ' …' : '');
  }
  function renderResults() {
    var q = qIn.value;
    qClear.hidden = !q;
    if (q.trim().length < 2) { results.hidden = true; clear(results); document.body.classList.remove('searching'); return; }
    var res = search(q);
    clear(results);
    document.body.classList.add('searching');
    results.hidden = false;
    results.appendChild(h('p', { class: 'res-count' }, res.length ? ('النتائج: ' + res.length) : 'لا توجد نتائج لهذه الكلمة.'));
    res.slice(0, 40).forEach(function (it) {
      var x = it.x, f = it.first;
      results.appendChild(h('button', { type: 'button', class: 'res', 'data-rule': x.r.id, onclick: function () { closeSearch(); go(x.r.id, true); } },
        h('span', { class: 'res-name' }, h('span', { dir: 'ltr', lang: 'en' }, str(x.r.name_en)), ' · ', str(x.r.name_ar)),
        h('span', { class: 'res-unit', dir: 'ltr', style: 'text-align:right' }, 'Module ' + x.m.module + ' · Unit ' + x.u.unit + ' · ' + str(x.u.grammar_title)),
        h('span', { class: 'res-snip' }, h('span', { class: 'res-lab' }, f.f.lab + ':'), snippet(f.f.text, f.s, f.e, f.f.en), it.hits > 1 ? h('span', { class: 'res-lab' }, ' (+' + (it.hits - 1) + ')') : null)));
    });
  }
  function closeSearch() { qIn.value = ''; renderResults(); }
  var tmr = null;
  qIn.addEventListener('input', function () { clearTimeout(tmr); tmr = setTimeout(renderResults, 120); });
  qIn.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSearch();
    else if (e.key === 'Enter') { e.preventDefault(); clearTimeout(tmr); renderResults(); }
  });
  qClear.addEventListener('click', function () { closeSearch(); qIn.focus(); });

  // ---------- البداية ----------
  if (!RULES.length) { main.appendChild(h('p', { class: 'empty' }, 'لا يوجد محتوى بعد.')); return; }
  var start = BYID[idFromHash()] || (S.last && BYID[S.last]) || RULES[0];
  show(start);
  if (idFromHash() !== start.r.id) { try { location.replace('#' + encodeURIComponent(start.r.id)); } catch (e) { /* بعض العارضات */ } }
})();
</script>
</body>
