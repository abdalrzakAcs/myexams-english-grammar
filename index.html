:","options":["a prediction","events continuing over a period of time","a future event that will finish before a specific time in the future"],"answer":2,"src":"SB 62 ex.a #5","origin":"adapted","explain_ar":"will have cleaned + By the time ← ينتهي قبل وقت محدد."},{"type":"tf","statement":"We use the Future Perfect to talk about an action which will be completed before a point of time, in this case a point in the future.","answer":true,"src":"WB 112","origin":"book","explain_ar":"نص قاعدة الكتاب."},{"type":"tf","statement":"I've got my schedule for the Japan trip. We will have flown to Tokyo at 10 a.m. on Monday.","answer":false,"src":"WB 48 ex.1 #8","origin":"book","explain_ar":"برنامج رحلة ← Present Simple (We fly)، والكتاب يعدّها جملة فيها خطأ."}],"flags":[]}]}]},{"module":4,"module_title":"Module 4 Biology","units":[{"unit":7,"unit_title":"Microorganism","grammar_title":"Conditionals II, III","pages":{"sb":[70,82],"wb":[55,56,66]},"rules":[{"id":"u7-conditional-type-2","name_en":"Conditional Sentences Type II","name_ar":"الجملة الشرطية - النوع الثاني","branches":{"form":{"summary_ar":"If + ماضٍ بسيط، والجواب would + مصدر: لموقف خيالي أو غير حقيقي في الحاضر أو المستقبل.","structure":"If + S + V2 (past simple), S + would + V0   |   S + would + V0 + if + S + V2","items":[{"ar":"تعريف SB","en":"Conditional sentences type II (if + simple past, main clause with would +infinitive) refer to imaginary situations in the present: e.g. If I had enough money, I would buy a Ferrari.","src":"SB 70","kind":"book"},{"ar":"الشكل: جملة if أولاً أو ثانياً","en":"If clause, main clause OR Main clause if clause. If + simple past, would + infinitive e.g. If I found her address, I would send her an invitation. If I were you, I wouldn't do this.","src":"WB 55","kind":"book"},{"ar":"الاستعمال: شيء غير صحيح في الحاضر أو المستقبل","en":"Conditional sentences type II refer to something not true about the present or future (imaginative). e.g. If I had enough time now, I would visit my aunt. (I don't have enough time now, so I can't visit her).","src":"WB 55","kind":"book"}]},"negative":{"structure":"If + S + didn't + V0 / weren't …, S + wouldn't + V0","verb_change_ar":"النفي يمكن أن يكون في أي جزء: في جملة if يصبح didn't + مصدر (أو weren't)، وفي الجواب wouldn't + مصدر. وعند تحويل موقف حقيقي إلى شرط يتعاكس الإثبات والنفي: don't have ← had، can't ← would.","items":[{"ar":"النفي في الجواب","en":"If I were you, I wouldn't do this.","src":"WB 55","kind":"book"},{"ar":"النفي في جملة if (weren't)","en":"If I weren't in debt, I would quit my job.","src":"SB 70 ex.b #6","kind":"book"},{"ar":"الموقف الحقيقي منفي والشرط مثبت","en":"If I had enough time now, I would visit my aunt. (I don't have enough time now, so I can't visit her).","src":"WB 55","kind":"book"},{"ar":"مثال تمرين الاختبار","en":"I can't afford to buy a car. → If I had enough money, I would buy a car.","src":"WB 66 Progress Test 2 Grammar c (example)","kind":"book"}]},"question":{"structure":"(Wh-) + would + S + V0 + if + S + V2 ?","aux_ar":"السؤال يكون في جواب الشرط: would تتقدم على الفاعل، وجملة if تبقى بترتيب الخبر بالماضي البسيط.","items":[{"ar":"What + would + S … if + ماضٍ","en":"Think about your country. What would you miss most if you lived abroad?","src":"WB 76","kind":"book"},{"ar":"جملة if أولاً ثم السؤال","en":"If you had the chance to spend a year working or studying in another country, which country would you choose?","src":"SB 15","kind":"book"},{"ar":"سؤال مع were في جملة if","en":"What would happen if there were no laws in society?","src":"WB 72","kind":"book"}],"notes":[{"ar":"were بدل was في الإنكليزية الرسمية","en":"N.B. In formal English, we usually use «were» instead of «was» in second conditionals.","src":"WB 55","kind":"book"},{"ar":"مكان جملة if","en":"The If clause can be first or second in the sentence.","src":"WB 55","kind":"book"},{"ar":"مراجعة النوع الأول: when بدل if عندما يكون الشيء مرجحاً أكثر","en":"In first conditionals, we use when instead of if to show that something is more likely: I'll give you a lift into town if I finish my work in time. (= I am not sure if I will be able to give you a lift) I'll give you a lift into town when I finish this work. (= I will give you a lift)","src":"WB 55","kind":"book"},{"ar":"مراجعة النوع الأول في Review 2 (مثال الكتاب)","en":"You think Hind should book a seat on the train or she has to stand. → If Hind doesn't book a seat on the train, she'll have to stand.","src":"SB 82 Review 2 ex.4 (example)","kind":"book"}]},"signals":{"keywords":["now","If I were you","imaginary","don't / doesn't / can't (present situation)","so I can't …","would + infinitive"],"items":[{"ar":"موقف حاضر منفي (don't have / can't) ← النوع الثاني","en":"I don't have a computer, so I can't surf the Net.","src":"WB 66 Progress Test 2 Grammar c #4","kind":"book"},{"ar":"الجواب would + مصدر ← if + ماضٍ بسيط","en":"I ……….…. very unhappy if my friends didn't come to the party.","src":"SB 70 ex.b #1","kind":"book"},{"ar":"If I were you ← نصيحة بالنوع الثاني","en":"If I were you, I wouldn't do this.","src":"WB 55","kind":"book"}]}},"questions":[{"type":"mcq","q":"I ……….…. very unhappy if my friends didn't come to the party.","options":["would have been","will be","would be"],"answer":2,"src":"SB 70 ex.b #1","origin":"book","explain_ar":"جملة if بالماضي البسيط (didn't come) ← would + مصدر."},{"type":"mcq","q":"If I ……….…. in debt, I would quit my job.","options":["am not","weren't","hadn't been"],"answer":1,"src":"SB 70 ex.b #6","origin":"book","explain_ar":"الجواب would + مصدر ← if + ماضٍ بسيط (weren't)."},{"type":"mcq","q":"You would have some money in your pocket if you ……….…. it so generously.","options":["wouldn't spend","hadn't spent","didn't spend"],"answer":2,"src":"SB 70 ex.b #5","origin":"book","explain_ar":"الجواب would + مصدر (would have some money) ← حسب قاعدة النوع الثاني if + ماضٍ بسيط."},{"type":"mcq","q":"If you practiced more, ______","options":["I would have written you a postcard.","your English would improve.","he would have awarded a penalty kick to our team."],"answer":1,"src":"SB 70 ex.a #1","origin":"adapted","explain_ar":"if + ماضٍ بسيط ← would + مصدر، والمعنى يطابق (تمرين التوصيل)."},{"type":"fill","q":"If I (start) …….……. writing poetry, my English teacher would be surprised.","answers":["started"],"src":"WB 56 ex.a #1","origin":"book","explain_ar":"الجواب would be ← if + ماضٍ بسيط."},{"type":"fill","q":"People would see my photo everywhere if I (be) ……….…. a famous model.","answers":["were","was"],"src":"WB 56 ex.a #2","origin":"book","explain_ar":"النوع الثاني، وwere أفضل في الإنكليزية الرسمية."},{"type":"fill","q":"If my little sister did something wrong, I'm sure she (tell) …………. me.","answers":["would tell"],"src":"WB 56 ex.a #5","origin":"book","explain_ar":"if + ماضٍ بسيط (did) ← would + مصدر."},{"type":"fill","q":"Rewrite using conditionals type II or III: I want to ring a friend now, but I don't know her phone number.","answers":["If I knew her phone number, I would ring her now.","If I knew her phone number, I would ring her.","If I knew my friend's phone number, I would ring her now.","I would ring my friend now if I knew her phone number."],"src":"WB 56 ex.c #1","origin":"book","explain_ar":"موقف حاضر (now, don't know) ← النوع الثاني: don't know ← knew."},{"type":"fill","q":"Write a conditional sentence: I don't have a computer, so I can't surf the Net.","answers":["If I had a computer, I could surf the Net.","If I had a computer, I would surf the Net.","I could surf the Net if I had a computer.","I would surf the Net if I had a computer."],"src":"WB 66 Progress Test 2 Grammar c #4","origin":"book","explain_ar":"موقف حاضر منفي ← if + had، والجواب would (أو could بدل can't)."},{"type":"fill","q":"Write a conditional sentence: I'm not rich enough to help the poor.","answers":["If I were rich enough, I would help the poor.","If I was rich enough, I would help the poor.","If I were rich enough, I could help the poor.","If I were rich, I would help the poor."],"src":"WB 66 Progress Test 2 Grammar c #5","origin":"book","explain_ar":"I'm not ← If I were، والجواب would + مصدر."},{"type":"tf","statement":"In formal English, we usually use «were» instead of «was» in second conditionals.","answer":true,"src":"WB 55","origin":"book","explain_ar":"ملاحظة الكتاب N.B."},{"type":"tf","statement":"In conditional sentences type II, the If clause must always come first in the sentence.","answer":false,"src":"WB 55","origin":"adapted","explain_ar":"الكتاب: The If clause can be first or second in the sentence."}],"flags":[{"type":"unsure","ar":"SB 70 ex.b #5: الجواب حسب قاعدة النوع الثاني التي يدرّسها الكتاب هو didn't spend، لكن hadn't spent (شرط مختلط: سبب ماضٍ ونتيجة حاضرة) صحيح أيضاً في الإنكليزية والكتاب لا يدرّسه. الكتاب بلا أجوبة.","src":"SB 70 ex.b #5"},{"type":"unsure","ar":"الجواب بـ could بدل would في بنود can't (WB 66 c#4، c#5) غير مذكور في قاعدة الكتاب، لكنه التحويل الطبيعي لـ can't؛ قبلناه مع would.","src":"WB 66 Progress Test 2 Grammar c"}]},{"id":"u7-conditional-type-3","name_en":"Conditional Sentences Type III","name_ar":"الجملة الشرطية - النوع الثالث","branches":{"form":{"summary_ar":"If + ماضٍ تام، والجواب would have + تصريف ثالث: لموقف خيالي في الماضي، عكس ما حدث فعلاً.","structure":"If + S + had + V3, S + would have + V3   |   S + would have + V3 + if + S + had + V3","items":[{"ar":"تعريف SB","en":"Conditional sentences type III (if + past perfect, main clause with would +have + past participle) refer to imaginary situations in the past: e.g. If I had had enough money, I would have bought a Ferrari.","src":"SB 70","kind":"book"},{"ar":"الشكل","en":"If clause, main clause OR Main clause if clause. If + the past perfect, would / wouldn't + have + past participle e.g. If I had found her address, I would have sent her an invitation.","src":"WB 55","kind":"book"},{"ar":"الاستعمال: شيء غير صحيح في الماضي","en":"Conditional sentences type III refer to something not true about the past. (They are truly hypothetical and unreal). e.g. If I had had enough time yesterday, I would have visited my aunt. (I didn't have enough time yesterday, so I couldn't visit her).","src":"WB 55","kind":"book"}]},"negative":{"structure":"If + S + hadn't + V3, S + wouldn't have + V3","verb_change_ar":"النفي في أي جزء: hadn't + V3 في جملة if، وwouldn't have + V3 في الجواب. وعند تحويل حدث حقيقي في الماضي يتعاكس الإثبات والنفي: went to bed late ← had gone to bed early … wouldn't have been tired.","items":[{"ar":"النفي في الجزأين","en":"Your brother wouldn't have found such a nice job if he hadn't had a university diploma.","src":"SB 70 ex.b #2","kind":"book"},{"ar":"النفي في الجزأين","en":"People wouldn't have crossed the Bosphorus if they hadn't built these bridges.","src":"SB 70 ex.b #4","kind":"book"},{"ar":"مثال التحويل في الكتاب","en":"I went to bed late last night, so I was tired the following day. → If I had gone to bed early last night, I wouldn't have been tired the following day.","src":"WB 56 ex.c (example)","kind":"book"}]},"question":{"structure":"(Wh-) + would + S + have + V3 + if + S + had + V3 ?","aux_ar":"السؤال في جواب الشرط: would تتقدم على الفاعل وبعده have + V3، وجملة if تبقى خبرية. الكتاب لم يعطِ سؤالاً بالنوع الثالث.","items":[{"ar":"سؤال مشتق من جملة الكتاب","en":"Would he have awarded a penalty kick to our team if the referee had seen the foul?","src":"SB 70 ex.a #3","kind":"derived"}],"notes":[{"ar":"مكان جملة if","en":"N.B. The If clause can be first or second in the sentence.","src":"WB 55","kind":"book"},{"ar":"unless = if … not","en":"We use unless to show a negative condition, with a similar meaning to if …. not: e.g. Unless she had fastened the seat belt, she would have been injured. (= if she hadn't)","src":"WB 55","kind":"book"}]},"signals":{"keywords":["yesterday","last night","in time","past situation + so / because","would have + past participle","Unless … had"],"items":[{"ar":"الجواب would have + V3 ← if + had + V3","en":"People wouldn't have crossed the Bosphorus if they ……….…. these bridges.","src":"SB 70 ex.b #4","kind":"book"},{"ar":"موقف ماضٍ مع so / because ← النوع الثالث","en":"Our team didn't win the match, so they didn't move up.","src":"WB 56 ex.c #3","kind":"book"}]}},"questions":[{"type":"mcq","q":"Your brother wouldn't have found such a nice job if he ……….…. a university diploma.","options":["hadn't had","didn't have","doesn't have"],"answer":0,"src":"SB 70 ex.b #2","origin":"book","explain_ar":"الجواب wouldn't have found ← if + ماضٍ تام."},{"type":"mcq","q":"If you had come in time, you ……….…. the lesson.","options":["wouldn't miss","wouldn't have missed","won't miss"],"answer":1,"src":"SB 70 ex.b #3","origin":"book","explain_ar":"if + ماضٍ تام ← would have + V3."},{"type":"mcq","q":"People wouldn't  have crossed the Bosphorus if they ……….…. these bridges.","options":["haven't built","didn't build","hadn't built"],"answer":2,"src":"SB 70 ex.b #4","origin":"book","explain_ar":"الجواب wouldn't have crossed ← if + ماضٍ تام."},{"type":"mcq","q":"If the referee had seen the foul, ______","options":["your English would improve.","I would have written you a postcard.","he would have awarded a penalty kick to our team."],"answer":2,"src":"SB 70 ex.a #3","origin":"adapted","explain_ar":"if + had seen ← would have + V3، والمعنى يطابق (تمرين التوصيل)."},{"type":"fill","q":"If the family had saved enough money, they (buy) …….……. a new flat.","answers":["would have bought"],"src":"WB 56 ex.a #3","origin":"book","explain_ar":"if + ماضٍ تام ← would have + V3."},{"type":"fill","q":"The buildings wouldn't have burned to ashes if the firemen (come) ……..……. in time.","answers":["had come"],"src":"WB 56 ex.a #4","origin":"book","explain_ar":"الجواب wouldn't have burned ← if + had + V3."},{"type":"fill","q":"If the policeman had seen the thief, he (arrest) ……………. him.","answers":["would have arrested"],"src":"WB 56 ex.a #6","origin":"book","explain_ar":"if + ماضٍ تام ← would have + V3."},{"type":"fill","q":"Rewrite using conditionals type II or III: The poor man couldn't build his house because the officials stopped him.","answers":["If the officials hadn't stopped him, the poor man could have built his house.","If the officials hadn't stopped him, the poor man would have built his house.","The poor man could have built his house if the officials hadn't stopped him.","The poor man would have built his house if the officials hadn't stopped him."],"src":"WB 56 ex.c #2","origin":"book","explain_ar":"حدث ماضٍ ← النوع الثالث، ويتعاكس النفي: stopped ← hadn't stopped."},{"type":"fill","q":"Rewrite using conditionals type II or III: Our team didn't win the match, so they didn't move up.","answers":["If our team had won the match, they would have moved up.","Our team would have moved up if they had won the match."],"src":"WB 56 ex.c #3","origin":"book","explain_ar":"didn't win ← had won، didn't move up ← would have moved up."},{"type":"fill","q":"Write a conditional sentence: The young boy was sad because his mother didn't take him to the fun city.","answers":["If his mother had taken him to the fun city, the young boy wouldn't have been sad.","The young boy wouldn't have been sad if his mother had taken him to the fun city."],"src":"WB 66 Progress Test 2 Grammar c #1","origin":"book","explain_ar":"موقف ماضٍ ← النوع الثالث مع تعاكس النفي."},{"type":"tf","statement":"Conditional sentences type III refer to something not true about the past.","answer":true,"src":"WB 55","origin":"book","explain_ar":"نص قاعدة الكتاب."},{"type":"tf","statement":"“Unless she had fastened the seat belt, she would have been injured.” has the same meaning as “If she hadn't fastened the seat belt, she would have been injured.”","answer":true,"src":"WB 55","origin":"adapted","explain_ar":"الكتاب: unless بمعنى if … not (= if she hadn't)."}],"flags":[{"type":"unsure","ar":"Review 2 ex.4 (SB 82) مواقف مفتوحة تجمع أنواع الشرط الأول والثاني والثالث، وأجوبتها غير محددة، فلم نأخذ منها أسئلة. البند 6 (… otherwise you could buy it) صياغته تقود إلى شرط مختلط.","src":"SB 82 Review 2 ex.4"},{"type":"unsure","ar":"WB 56 ex.b (Complete the following sentences) مفتوح بلا جواب واحد، فلم نأخذ منه أسئلة.","src":"WB 56 ex.b"}]}]},{"unit":8,"unit_title":"Facts about Human Body","grammar_title":"Expressing Wishes","pages":{"sb":[78,82],"wb":[61,62,65,66]},"rules":[{"id":"u8-wish-present","name_en":"Wish in the present: I wish + subject + past simple","name_ar":"التمني في الحاضر: wish + ماضٍ بسيط","branches":{"form":{"summary_ar":"wish أو if only + ماضٍ بسيط: للتعبير عن ندم على موقف في الحاضر أو رغبة في أن يكون مختلفاً. if only أقوى قليلاً من wish.","structure":"S + wish(es) / If only + S + V2 (past simple) / were / could + V0","items":[{"ar":"wish وif only لما نتمنى أن يكون مختلفاً","en":"We use wish and if only to talk about things that we would like to be different either in the present or the past. If only is usually a bit stronger than wish.","src":"WB 61","kind":"book"},{"ar":"الصيغة والاستعمال","en":"Wish in the present: I wish + subject + past simple. We use “I wish + subject + past simple” to express a regret about a present situation.","src":"WB 61","kind":"book"},{"ar":"am tired ← weren't tired","en":"I am very tired today. I wish I weren't so tired.","src":"SB 78 ex.a #4","kind":"book"},{"ar":"can't ← could","en":"I can't watch the match tonight. I wish I could watch it.","src":"SB 78 ex.a #3","kind":"book"}]},"negative":{"structure":"S + wish + S + didn't + V0 / weren't …","verb_change_ar":"الفعل يرجع خطوة إلى الماضي: don't know ← knew، doesn't have ← had، isn't shining ← were shining، can't ← could، am tired ← weren't tired. ومع كل الفاعلين يمكن were (أو was).","items":[{"ar":"النفي بعد wish بـ weren't","en":"I wish I weren't so tired.","src":"SB 78 ex.a #4","kind":"book"},{"ar":"doesn't have ← had","en":"Our classroom doesn't have coloured walls. → I wish our classroom had coloured walls.","src":"SB 78 ex.c #1","kind":"derived"}]},"question":{"structure":"(Wh-) + do / does + S + wish + S + V2 … ?","aux_ar":"السؤال يكون على wish نفسها بـ do / does، والجملة بعد wish تبقى بالماضي بترتيب الخبر.","items":[{"ar":"Where + do + you + wish + you were","en":"Where do you wish you were right now?","src":"SB 78 ex.d #1","kind":"book"},{"ar":"What + do + you + wish + you were doing","en":"What do you wish you were doing?","src":"SB 78 ex.d #2","kind":"book"},{"ar":"do you wish it were …","en":"Are you pleased with the weather today, or do you wish it were different?","src":"SB 78 ex.d #3","kind":"book"}],"notes":[{"ar":"were بدل was مع I / he / she / it (رسمي)","en":"N.B. “were” is often used instead of “was” with I, he, she and it (formal). e.g. I wish I were rich. OR I wish I was rich.","src":"WB 61","kind":"book"},{"ar":"سؤال الكتاب: أي الجمل تمنٍّ عن الحاضر أو المستقبل؟ (الجمل 2 و3 و4 في ex.a)","en":"Which sentences express a wish about the present or future?","src":"SB 78 ex.b #2","kind":"book"}]},"signals":{"keywords":["now","right now","today","tonight","can't","don't / doesn't","isn't / am"],"items":[{"ar":"موقف حاضر (don't know) ← wish + ماضٍ بسيط","en":"I don't know how to dance. I wish I …………………….. (know) how to dance.","src":"SB 78 ex.c #4","kind":"book"},{"ar":"موقف حاضر مستمر (isn't shining) ← were + V-ing","en":"The sun isn't shining right now. I wish the sun …………………… (be) shining.","src":"SB 78 ex.c #2","kind":"book"}]}},"questions":[{"type":"fill","q":"Our classroom doesn't have coloured walls. I wish our classroom ………………… (have) coloured walls.","answers":["had"],"src":"SB 78 ex.c #1","origin":"book","explain_ar":"موقف حاضر ← ماضٍ بسيط بعد wish."},{"type":"fill","q":"The sun isn't shining right now. I wish the sun …………………… (be) shining.","answers":["were","was"],"src":"SB 78 ex.c #2","origin":"book","explain_ar":"isn't shining ← were shining (أو was)."},{"type":"fill","q":"I don't know how to dance. I wish I …………………….. (know) how to dance.","answers":["knew"],"src":"SB 78 ex.c #4","origin":"book","explain_ar":"don't know ← knew."},{"type":"fill","q":"I can't go with you tomorrow but I wish I …………………….. (go) with you.","answers":["could go"],"src":"SB 78 ex.c #5","origin":"book","explain_ar":"can't ← could + مصدر."},{"type":"fill","q":"Our flat is rather small. I wish …………………………(it/be) a bit bigger.","answers":["it were","it was"],"src":"WB 66 Progress Test 2 Grammar a #6","origin":"book","explain_ar":"موقف حاضر (is small) ← it were (أو was)."},{"type":"fill","q":"What might you say? Begin I wish / If only … : to someone who can't help you","answers":["I wish you could help me.","If only you could help me."],"src":"WB 62 ex.a #2","origin":"book","explain_ar":"can't ← could."},{"type":"mcq","q":"He wishes he ………….. back and see the Norias in Hama.","options":["could travel","could have travelled","could to travel"],"answer":0,"src":"SB 82 Review 2 ex.3 #2","origin":"book","explain_ar":"تمنٍّ عن الحاضر ← could + مصدر (ومتوازٍ مع and see)."},{"type":"mcq","q":"It's a fantastic novel! I have almost finished it. I wish it …………….. longer.","options":["had been","were / was","would be"],"answer":1,"src":"SB 82 Review 2 ex.3 #8","origin":"book","explain_ar":"موقف حاضر (الرواية قصيرة الآن) ← were / was."},{"type":"mcq","q":"We are having such a lovely time in Homs. If only it …………. all the time.","options":["hadn't rained","had rained","rained"],"answer":2,"src":"SB 82 Review 2 ex.3 #6","origin":"book","explain_ar":"all the time = حاضر ← if only + ماضٍ بسيط."},{"type":"tf","statement":"We use “I wish + subject + past simple” to express a regret about a present situation.","answer":true,"src":"WB 61","origin":"book","explain_ar":"نص قاعدة الكتاب."},{"type":"tf","statement":"“I am very tired today. I wish I weren't so tired.” The speaker is not tired.","answer":false,"src":"SB 78 ex.a #4","origin":"adapted","explain_ar":"التمني عكس الواقع: هو متعب ويتمنى ألا يكون."},{"type":"tf","statement":"“I wish I was rich.” is wrong; only “were” is possible after wish.","answer":false,"src":"WB 61","origin":"adapted","explain_ar":"الكتاب: I wish I were rich. OR I wish I was rich. (were رسمية)."}],"flags":[{"type":"unsure","ar":"Review 2 ex.3 #6: السياق «We are having such a lovely time» لا يتفق مع تمني المطر طوال الوقت؛ نحوياً الجواب rained (تمنٍّ عن الحاضر)، لكن المعنى غريب وربما في الجملة خطأ من الكتاب.","src":"SB 82 Review 2 ex.3 #6"},{"type":"unsure","ar":"Review 2 ex.3 #8: الخيار b في الكتاب «were , was» (خياران في خيار واحد)، نقلناه كما هو.","src":"SB 82 Review 2 ex.3 #8"},{"type":"unsure","ar":"SB 82 Review 2 ex.3 #6 «lovely time … If only it ___ all the time»: الخيارات الثلاثة ما بتركب مع المعنى تماماً، والكتاب ما عطى مفتاح. اخترنا rained لأنو الوحيد اللي بيعبّر عن أمنية بالحاضر.","src":"SB 82 Review 2 ex.3 #6"}]},{"id":"u8-wish-past","name_en":"Wish in the past: I wish + subject + past perfect","name_ar":"التمني في الماضي: wish + ماضٍ تام","branches":{"form":{"summary_ar":"wish أو if only + ماضٍ تام: للتعبير عن ندم على شيء حدث (أو لم يحدث) في الماضي.","structure":"S + wish(es) / If only + S + had (not) + V3","items":[{"ar":"الصيغة والاستعمال","en":"Wish in the past: I wish + subject + past perfect. We use “I wish + subject + past perfect” to express a regret about a past situation. e.g. Michel didn't revise his lessons for the exam. Michel: I wish I had revised my lessons.","src":"WB 61","kind":"book"},{"ar":"ندم على شيء حدث","en":"I regret that I started smoking. I wish I hadn't started smoking.","src":"SB 78 ex.a #1","kind":"book"},{"ar":"مثال تمرين الكتاب","en":"I spent all my money. I wish now that I had saved it.","src":"WB 62 ex.b (example)","kind":"book"}]},"negative":{"structure":"S + wish + S + hadn't + V3","verb_change_ar":"الماضي البسيط يرجع إلى الماضي التام، والإثبات والنفي يتعاكسان: started ← hadn't started، didn't revise ← had revised.","items":[{"ar":"started ← hadn't started","en":"I wish I hadn't started smoking.","src":"SB 78 ex.a #1","kind":"book"},{"ar":"قول شيء غبي ← hadn't said","en":"It was a stupid thing to say. I wish I hadn't said it.","src":"WB 65 Progress Test 2 Grammar a #2","kind":"derived"}]},"question":{"structure":"Do / Does + S + wish + S + had + V3 … ?","aux_ar":"do / does على wish، والجملة بعدها تبقى بالماضي التام. الكتاب لم يعطِ سؤالاً بهذه الصيغة؛ أسئلته تُجاب بها.","items":[{"ar":"سؤال الكتاب، وجوابه بالتمني في الماضي: I wish I had saved it.","en":"Didn't you save your friend's phone number?","src":"SB 78 ex.d #5","kind":"book"}],"notes":[{"ar":"أسئلة الفهم وأجوبتها في الكتاب","en":"a Did he start smoking? (Yes, he did.) b Is he happy he is a smoker? (No, he isn't. He wishes he hadn't started smoking.)","src":"SB 78 ex.a #1","kind":"book"},{"ar":"سؤال الكتاب: أي جملة تمنٍّ عن الماضي؟ (الجملة 1 في ex.a)","en":"Which sentence expresses a wish about the past?","src":"SB 78 ex.b #3","kind":"book"}]},"signals":{"keywords":["yesterday","last week","I regret that","I should have …","earlier","instead","before they started","missed / refused / didn't"],"items":[{"ar":"should have + V3 ← I wish + had + V3","en":"I should have listened to you. I wish ………………… (I/take) your advice.","src":"WB 66 Progress Test 2 Grammar a #3","kind":"book"},{"ar":"موقف ماضٍ (last week) ← had + V3","en":"I didn't go shopping last week. I wish I ………………………… (go) shopping.","src":"SB 78 ex.c #3","kind":"book"}]}},"questions":[{"type":"fill","q":"I didn't go shopping last week. I wish I ………………………… (go) shopping.","answers":["had gone"],"src":"SB 78 ex.c #3","origin":"book","explain_ar":"موقف ماضٍ ← had + V3."},{"type":"fill","q":"It was a stupid thing to say. I wish I …………………(not / say) it.","answers":["hadn't said","had not said"],"src":"WB 65 Progress Test 2 Grammar a #2","origin":"book","explain_ar":"ندم على الماضي ← hadn't + V3."},{"type":"fill","q":"I should have listened to you. I wish ………………… (I/take) your advice.","answers":["I had taken","I'd taken"],"src":"WB 66 Progress Test 2 Grammar a #3","origin":"book","explain_ar":"should have = ندم على الماضي ← had taken."},{"type":"fill","q":"Use: accepted, caught, found, played, saved, stayed. I missed the flight. I really wish ……………… .","answers":["I had caught it","I had caught the flight","I'd caught it"],"src":"WB 62 ex.b #1","origin":"book","explain_ar":"missed ← had caught."},{"type":"fill","q":"Use: accepted, caught, found, played, saved, stayed. Lama refused to sign the contract. But her parents wish ……………… .","answers":["she had accepted it","she had accepted the contract","Lama had accepted it"],"src":"WB 62 ex.b #3","origin":"book","explain_ar":"refused ← had accepted."},{"type":"fill","q":"Use: accepted, caught, found, played, saved, stayed. I looked everywhere for my key. I wish ……………… .","answers":["I had found it","I'd found it","I had found my key"],"src":"WB 62 ex.b #4","origin":"book","explain_ar":"لم يجده ← had found."},{"type":"mcq","q":"If only they …………….. you for help before they started.","options":["would ask","had asked","asked"],"answer":1,"src":"SB 82 Review 2 ex.3 #1","origin":"book","explain_ar":"before they started = ماضٍ ← had + V3."},{"type":"mcq","q":"It took us a long time to arrive. I wish we ……………….. the train instead.","options":["would catch","caught","had caught"],"answer":2,"src":"SB 82 Review 2 ex.3 #4","origin":"book","explain_ar":"It took us (ماضٍ) ← had caught."},{"type":"mcq","q":"I am so tired. I wish I …………. home earlier.","options":["had gone","went","would have gone"],"answer":0,"src":"SB 82 Review 2 ex.3 #5","origin":"book","explain_ar":"الندم على وقت مضى (earlier) ← had gone."},{"type":"tf","statement":"We use “I wish + subject + past perfect” to express a regret about a past situation.","answer":true,"src":"WB 61","origin":"book","explain_ar":"نص قاعدة الكتاب."},{"type":"tf","statement":"“I regret that I started smoking. I wish I hadn't started smoking.” The speaker didn't start smoking.","answer":false,"src":"SB 78 ex.a #1","origin":"adapted","explain_ar":"جواب الكتاب: Did he start smoking? (Yes, he did.)"},{"type":"tf","statement":"“I wish I hadn't started smoking.” expresses a wish about the past.","answer":true,"src":"SB 78 ex.b #3","origin":"adapted","explain_ar":"wish + ماضٍ تام = تمنٍّ عن الماضي."}],"flags":[{"type":"unsure","ar":"بنود WB 62 ex.a #3 (didn't do the laundry ← had done) وex.b #2، #5 لم تدخل الأسئلة بسبب الحد الأعلى 12 سؤالاً؛ هي من نفس النمط.","src":"WB 62"},{"type":"book_typo","ar":"SB 82 Review 2 ex.3 #3 و#4: الخيار الأخير مطبوع بنقطة بالآخر (had caught. / wouldn't have left.). شلنا النقطة لأنها بتدل عالجواب.","src":"SB 82 Review 2 ex.3"}]},{"id":"u8-wish-would","name_en":"Wish in the future: I wish + subject + would + infinitive","name_ar":"التمني في المستقبل: wish + would + مصدر","branches":{"form":{"summary_ar":"wish أو if only + would + مصدر: للتعبير عن انزعاج من تصرف ما أو رغبة في التغيير في المستقبل القريب.","structure":"S + wish(es) / If only + S + would (not) + V0","items":[{"ar":"الصيغة والاستعمال","en":"Wish in the future: I wish + subject + would + infinitive. We use “I wish + subject + would + infinitive” to express annoyance or a desire for change in the near future. e.g. James is a heavy smoker. His wife wants him to stop smoking. I wish James would stop smoking.","src":"WB 61","kind":"book"},{"ar":"رغبة قوية في التغيير","en":"I have a strong desire that our head teacher limits absence in our school. I wish our head teacher would limit absence in our school.","src":"SB 78 ex.a #2","kind":"book"},{"ar":"انزعاج من تصرف متكرر ('d = would)","en":"to someone who never answers your emails → I wish you'd answer my emails.","src":"WB 61 ex.a (example)","kind":"book"}]},"negative":{"structure":"S + wish / If only + S + wouldn't + V0","verb_change_ar":"would لا تتغير مع الفاعل، والفعل بعدها مصدر. النفي wouldn't + مصدر.","items":[{"ar":"If only + wouldn't + مصدر","en":"If only the children wouldn't leave their books on the floor. I am always falling over them.","src":"SB 82 Review 2 ex.3 #3","kind":"book"},{"ar":"جواب بند الكتاب","en":"to someone who makes fun of people → I wish you wouldn't make fun of people.","src":"WB 62 ex.a #1","kind":"derived"}]},"question":{"structure":"Do / Does + S + wish + S + would + V0 … ?","aux_ar":"do / does على wish. الكتاب لم يعطِ سؤالاً بهذه الصيغة؛ أسئلته تسأل عن معنى التمني.","items":[{"ar":"أسئلة الفهم في الكتاب على جملة would","en":"a Does the head teacher fight absence at school? b Is the speaker in favour of or against absence?","src":"SB 78 ex.a #2","kind":"book"}],"notes":[{"ar":"if only أقوى قليلاً من wish","en":"If only is usually a bit stronger than wish.","src":"WB 61","kind":"book"}]},"signals":{"keywords":["annoy(s)","I am always …","never","wants him to stop","a strong desire","stop + -ing"],"items":[{"ar":"انزعاج من تصرف الآخرين ← would","en":"I wish our neighbours ……………… arguing. They annoy us.","src":"SB 82 Review 2 ex.3 #7","kind":"book"},{"ar":"never + تصرف متكرر ← I wish you'd","en":"to someone who never answers your emails","src":"WB 61 ex.a (example)","kind":"book"}]}},"questions":[{"type":"mcq","q":"If only the children ………… their books on the floor. I am always falling over them.","options":["wouldn't leave","left","wouldn't have left"],"answer":0,"src":"SB 82 Review 2 ex.3 #3","origin":"book","explain_ar":"انزعاج من تصرف متكرر ← wouldn't + مصدر."},{"type":"mcq","q":"I wish our neighbours ……………… arguing. They annoy us.","options":["stopped","had stopped","would stop"],"answer":2,"src":"SB 82 Review 2 ex.3 #7","origin":"book","explain_ar":"They annoy us = انزعاج ← would stop."},{"type":"mcq","q":"James is a heavy smoker. His wife wants him to stop smoking. I wish James ______ smoking.","options":["would stop","had stopped","stops"],"answer":0,"src":"WB 61","origin":"adapted","explain_ar":"رغبة في التغيير ← would + مصدر."},{"type":"fill","q":"What might you say? Begin I wish / If only … : to someone who makes fun of people","answers":["I wish you wouldn't make fun of people.","If only you wouldn't make fun of people.","I wish you would stop making fun of people."],"src":"WB 62 ex.a #1","origin":"book","explain_ar":"انزعاج من تصرف ← wouldn't + مصدر."},{"type":"fill","q":"What might you say? Begin I wish / If only … : to someone who blows cigarette smoke in your face","answers":["I wish you wouldn't blow cigarette smoke in my face.","If only you wouldn't blow cigarette smoke in my face."],"src":"WB 62 ex.a #5","origin":"book","explain_ar":"انزعاج ← wouldn't + مصدر (your face تصبح my face)."},{"type":"fill","q":"What might you say? Begin I wish / If only … : to someone who isn't telling you the truth","answers":["I wish you would tell me the truth.","I wish you'd tell me the truth.","If only you would tell me the truth.","I wish you were telling me the truth."],"src":"WB 62 ex.a #4","origin":"book","explain_ar":"رغبة في تغيير تصرفه ← would tell (ويصح were telling كتمنٍّ عن الحاضر)."},{"type":"tf","statement":"We use “I wish + subject + would + infinitive” to express annoyance or a desire for change in the near future.","answer":true,"src":"WB 61","origin":"book","explain_ar":"نص قاعدة الكتاب."},{"type":"tf","statement":"“I wish our head teacher would limit absence in our school.” The speaker is in favour of absence.","answer":false,"src":"SB 78 ex.a #2","origin":"adapted","explain_ar":"يريد أن يحد المدير من الغياب، فهو ضد الغياب."},{"type":"tf","statement":"“I wish our head teacher would limit absence in our school.” expresses a wish about the present or future.","answer":true,"src":"SB 78 ex.b #2","origin":"adapted","explain_ar":"wish + would = تغيير مرغوب في المستقبل القريب."}],"flags":[{"type":"unsure","ar":"WB 62 ex.a #4 (someone who isn't telling you the truth): يصلح wish + would أو wish + were telling؛ الكتاب بلا أجوبة، وضعنا الاثنين.","src":"WB 62 ex.a #4"}]}]}]},{"module":5,"module_title":"Module 5 Culture","units":[{"unit":9,"unit_title":"Citizenship","grammar_title":"Paired Conjunctions","pages":{"sb":[92,93,124],"wb":[70,71,99]},"rules":[{"id":"u9-both-and","name_en":"both ... and","name_ar":"both … and (كِلا … و…)","branches":{"form":{"summary_ar":"تربط اسمين أو صفتين أو فعلين للتأكيد على الاثنين معاً. إذا ربطت فاعلين يكون الفعل جمعاً.","structure":"Both + S1 + and + S2 + plural verb  |  both + X + and + Y","items":[{"ar":"فاعلان مربوطان بـ both…and والفعل جمع (are).","en":"Both my mother and my sister are here.","src":"SB 92 (a)","kind":"book"},{"ar":"قاعدة الكتاب: الفاعلان بعد both…and يأخذان فعلاً جمعاً.","en":"Two subjects connected by both ... and take a plural verb, as in (a)","src":"SB 92","kind":"book"}]},"negative":{"structure":"Both … and + فعل جمع مثبت  (نفي الاثنين = Neither … nor)","verb_change_ar":"الفعل بعد both…and جمع دائماً (are / have / like) مهما كان الاسم الأقرب. وحين يريد الكتاب نفي الأمر عن الاثنين لا يستعمل both…and، بل يحوّل الجملة المنفية إلى neither…nor بفعل مثبت.","items":[{"ar":"جملة منفية عن شخصين يطلب الكتاب تحويلها بـ neither…nor لا بـ both…and.","en":"Richard and John didn't keep her secret. (neither...nor)","src":"SB 93 #10","kind":"book"},{"ar":"لا يضع الكتاب not مع both…and في أي مثال؛ النفي المزدوج يأتي دائماً بـ neither…nor.","en":"","src":"SB 92–93","kind":"derived"}]},"question":{"structure":"لا يعرض الكتاب سؤالاً بـ both … and","aux_ar":"لا تحتاج both…and فعلاً مساعداً خاصاً؛ الفعل أو المساعد يبقى حسب الزمن ويكون جمعاً مع فاعلين. المهم أن يأتي بعد both وبعد and الشكل النحوي نفسه (parallel structure): اسم واسم (time / money).","items":[{"ar":"اسمان من الشكل نفسه بعد both وبعد and.","en":"The research project will take both time and money.","src":"SB 92 (f)","kind":"book"}],"notes":[{"ar":"التوازي: الشكل النحوي نفسه بعد كل جزء من الأداة.","en":"Notice the parallel structure in the examples. The same grammatical forms should follow each part of the paired conjunctions.","src":"SB 92","kind":"book"},{"ar":"الأدوات المزدوجة للتأكيد، وتلفت الانتباه إلى الجزأين.","en":"Paired conjunctions are usually used for emphasis; they draw attention to both parts of the parallel structure.","src":"SB 92","kind":"book"}]},"signals":{"keywords":["both … and","So does …","… too","plural verb"],"items":[{"ar":"جملتان بالمعنى نفسه لشخصين والثانية «So does …» ← both…and.","en":"Fred likes helping his friends. So does Linda. (both...and)","src":"SB 93 #1","kind":"book"},{"ar":"الجملة الثانية تكرر الخبر نفسه مع «too» ← both…and والفعل جمع.","en":"The panda faces extinction. The koala faces extinction too.","src":"SB 124 Review 3 ex.3 #4","kind":"book"}]}},"questions":[{"type":"mcq","q":"Both the teacher and the student ____ here.","options":["is","are","has","have"],"answer":1,"src":"WB 70 ex.a #1 (is / are / have / has)","origin":"book","explain_ar":"فاعلان مربوطان بـ both…and يأخذان فعلاً جمعاً: are."},{"type":"mcq","q":"Hind enjoys swimming in the early morning. Hasan enjoys swimming in the early morning. → Both Hind and Hasan ____ swimming in the early morning.","options":["enjoys","enjoying","enjoy"],"answer":2,"src":"SB 124 Review 3 ex.3 #1","origin":"adapted","explain_ar":"بعد both…and الفعل جمع، فتسقط s: enjoy."},{"type":"tf","statement":"Two subjects connected by both ... and take a plural verb.","answer":true,"src":"SB 92","origin":"book","explain_ar":"هذه قاعدة الكتاب نفسها."},{"type":"tf","statement":"Both my mother and my sister is here.","answer":false,"src":"SB 92 (a)","origin":"adapted","explain_ar":"الصحيح are لأن both…and تأخذ فعلاً جمعاً."},{"type":"fill","q":"He felt disappointed. He felt misunderstood. (both...and) → ____","answers":["He felt both disappointed and misunderstood."],"src":"SB 93 #6","origin":"book","explain_ar":"صفتان من الشكل نفسه بعد both وبعد and (parallel structure)."},{"type":"fill","q":"A true friend is someone who is caring and loving. (both...and) → ____","answers":["A true friend is someone who is both caring and loving."],"src":"SB 93 #8","origin":"book","explain_ar":"نضع both قبل الصفة الأولى وand قبل الثانية."},{"type":"fill","q":"Sham wants to ask her teacher a question. Hala wants to ask the teacher a question. (both…and) → ____","answers":["Both Sham and Hala want to ask the teacher a question.","Both Sham and Hala want to ask their teacher a question."],"src":"SB 124 Review 3 ex.3 #8","origin":"book","explain_ar":"فاعلان بـ both…and ← الفعل جمع want بلا s."},{"type":"fill","q":"July bought a dress. She bought a jumper. (both … and) → ____","answers":["July bought both a dress and a jumper."],"src":"WB 99 Progress Test 3 ex.b #4","origin":"book","explain_ar":"مفعولان من الشكل نفسه (a dress / a jumper) بعد both وand."}],"flags":[]},{"id":"u9-not-only-but-also","name_en":"not only ... but also","name_ar":"not only … but also (ليس فقط … بل أيضاً)","branches":{"form":{"summary_ar":"تربط شيئين للتأكيد أو لإظهار الدهشة. إذا ربطت فاعلين يتفق الفعل مع الفاعل الأقرب إليه (بعد but also).","structure":"Not only + S1 + but also + S2 + verb (حسب S2)  |  not only + X + but also + Y","items":[{"ar":"الفاعل الأقرب my sister مفرد ← is.","en":"Not only my mother but also my sister is here.","src":"SB 92 (b)","kind":"book"},{"ar":"الفاعل الأقرب my parents جمع ← are.","en":"Not only my sister but also my parents are here.","src":"SB 92 (c)","kind":"book"},{"ar":"تربط مفعولين أيضاً.","en":"Sue saw not only a fox in the woods but also a bear.","src":"SB 92 (g)","kind":"book"}]},"negative":{"structure":"Not only + S1 + but also + S2 + verb ← الفعل يتفق مع S2","verb_change_ar":"الفعل يتفق مع الفاعل الأقرب إليه: my sister ← is، my parents ← are، my sister ← has. لا يعرض الكتاب شكلاً منفياً لهذه الأداة؛ معناها إضافة وتأكيد، ونفي الأمر عن الاثنين يكون بـ neither…nor.","items":[{"ar":"قاعدة الفاعل الأقرب.","en":"When two subjects are connected by not only...but also, either...or, or neither...nor, the subject that is closer to the verb determines whether the verb is singular or plural.","src":"SB 92","kind":"book"},{"ar":"النفي عن الاثنين لا يكون بـ not only…but also بل بـ neither…nor.","en":"","src":"SB 92–93","kind":"derived"}]},"question":{"structure":"Not only + auxiliary + S + verb …  (في أول الجملة قبل فعل = قلب، الوحدة 12)","aux_ar":"داخل الجملة لا تحتاج الأداة فعلاً مساعداً. أما إذا بدأت الجملة بـ Not only قبل فعل (لا قبل فاعل اسم) فيتقدم الفعل المساعد على الفاعل كما في السؤال، وهذا درس القلب (Inversion) في الوحدة 12.","items":[{"ar":"Not only في أول الجملة قبل فعل مضارع بسيط ← قلب بـ does.","en":"Not only does he speak English, he speaks French.","src":"SB 120 ex.a #3","kind":"book"},{"ar":"قلب مع was.","en":"Not only was Jack famous for helping people, but he was also the first man to establish a charity in his country.","src":"WB 94","kind":"book"}],"notes":[{"ar":"تستعمل للتأكيد أو لإظهار الدهشة.","en":"Not only...but also is used for emphasis or to indicate surprise.","src":"SB 92","kind":"book"},{"ar":"التوازي: الشكل النحوي نفسه بعد كل جزء من الأداة.","en":"Notice the parallel structure in the examples. The same grammatical forms should follow each part of the paired conjunctions.","src":"SB 92","kind":"book"}]},"signals":{"keywords":["not only … but also","also","not the only …","emphasis","surprise"],"items":[{"ar":"الجملة الثانية فيها also تضيف شيئاً للأول ← not only…but also.","en":"Wind power is renewable. Solar power is also renewable.","src":"SB 124 Review 3 ex.3 #6","kind":"book"},{"ar":"«… was not the only … She also …» ← not only…but also.","en":"Breaking the silence was not the only good thing she did. She also said something very useful.","src":"WB 71 ex.b #4","kind":"book"}]}},"questions":[{"type":"mcq","q":"Not only the teacher but also the student ____ here.","options":["is","are","has","have"],"answer":0,"src":"WB 70 ex.a #3 (is / are / have / has)","origin":"book","explain_ar":"الفاعل الأقرب the student مفرد ← is."},{"type":"mcq","q":"Not only my brother but also my sister ____ a doctorate in science.","options":["is","are","has","have"],"answer":2,"src":"WB 70 ex.a #4 (is / are / have / has)","origin":"book","explain_ar":"المعنى «يملك» والفاعل الأقرب my sister مفرد ← has."},{"type":"tf","statement":"Not only...but also is used for emphasis or to indicate surprise.","answer":true,"src":"SB 92","origin":"book","explain_ar":"هذه ملاحظة الكتاب نفسها."},{"type":"tf","statement":"With not only...but also, the first subject determines whether the verb is singular or plural.","answer":false,"src":"SB 92","origin":"adapted","explain_ar":"الذي يحدد هو الفاعل الأقرب إلى الفعل (بعد but also)، لا الأول."},{"type":"fill","q":"We should learn to accept our weaknesses and our strengths. (not only...but also) → ____","answers":["We should learn to accept not only our weaknesses but also our strengths."],"src":"SB 93 #3","origin":"book","explain_ar":"not only قبل المفعول الأول وbut also قبل الثاني، بالشكل نفسه."},{"type":"fill","q":"I've betrayed your trust. I've betrayed your love for me. (not only...but also) → ____","answers":["I've betrayed not only your trust but also your love for me.","I have betrayed not only your trust but also your love for me."],"src":"SB 93 #5","origin":"book","explain_ar":"الفعل مشترك فنكتبه مرة واحدة، ثم not only X but also Y."},{"type":"fill","q":"The film was funny. It was exciting. (not only … but also) → ____","answers":["The film was not only funny but also exciting."],"src":"WB 99 Progress Test 3 ex.b #2","origin":"book","explain_ar":"صفتان بعد not only وbut also (parallel structure)."}],"flags":[]},{"id":"u9-either-or","name_en":"either ... or","name_ar":"either … or (إما … أو)","branches":{"form":{"summary_ar":"تعني «إما … أو»: اختيار واحد من اثنين. إذا ربطت فاعلين يتفق الفعل مع الفاعل الأقرب إليه.","structure":"Either + S1 + or + S2 + verb (حسب S2)  |  either + X + or + Y","items":[{"ar":"اختيار بين مادتين.","en":"I'll take either chemistry or physics next quarter.","src":"SB 92 (h)","kind":"book"},{"ar":"قاعدة الفاعل الأقرب تشمل either…or.","en":"When two subjects are connected by not only...but also, either...or, or neither...nor, the subject that is closer to the verb determines whether the verb is singular or plural.","src":"SB 92","kind":"book"}]},"negative":{"structure":"Either + S1 + or + S2 + فعل مثبت يتفق مع S2","verb_change_ar":"الفعل حسب الفاعل الأقرب: the teacher (مفرد) ← is، the students (جمع) ← have. الأداة معناها اختيار وليست نفياً، ونفي الأمر عن الاثنين يكون بـ neither…nor.","items":[{"ar":"إذا كان الأقرب جمعاً فالفعل جمع، وإذا كان مفرداً فالفعل مفرد: تطبيق قاعدة الكتاب على جمل تمرين WB 70 (#5 و#6).","en":"","src":"SB 92 + WB 70 ex.a","kind":"derived"}]},"question":{"structure":"لا يعرض الكتاب سؤالاً بـ either … or","aux_ar":"لا فعل مساعد خاص بالأداة؛ الفعل يبقى حسب الزمن ويتفق مع الأقرب. المهم أن يأتي بعد either وبعد or الشكل نفسه: اسم واسم، أو فعل وفعل.","items":[{"ar":"التوازي في تمرين الكتاب: فعلان مصدران بعد either وبعد or.","en":"Rachel should apologise or leave. (either...or)","src":"SB 93 #9","kind":"book"}],"notes":[{"ar":"التوازي: الشكل النحوي نفسه بعد كل جزء من الأداة.","en":"Notice the parallel structure in the examples. The same grammatical forms should follow each part of the paired conjunctions.","src":"SB 92","kind":"book"},{"ar":"الأدوات المزدوجة للتأكيد، وتلفت الانتباه إلى الجزأين.","en":"Paired conjunctions are usually used for emphasis; they draw attention to both parts of the parallel structure.","src":"SB 92","kind":"book"}]},"signals":{"keywords":["either … or","or","Or was it …?","I don't care"],"items":[{"ar":"شك بين شخصين «Or was it …?» ← either…or.","en":"Harry used to help Ann. Or was it Helen? (either...or)","src":"SB 93 #2","kind":"book"},{"ar":"إذا كانت الجملة الأصلية تعرض خيارين مربوطين بـ or (… or we can …) فالأداة المناسبة either…or.","en":"","src":"SB 93 #9 + SB 124 Review 3 ex.3 #3","kind":"derived"}]}},"questions":[{"type":"mcq","q":"Either the students or the teacher ____ planning to come.","options":["is","are","has","have"],"answer":0,"src":"WB 70 ex.a #5 (is / are / have / has)","origin":"book","explain_ar":"الفاعل الأقرب the teacher مفرد، وplanning تحتاج be ← is."},{"type":"mcq","q":"Either the teacher or the students ____ planned to come.","options":["is","are","has","have"],"answer":3,"src":"WB 70 ex.a #6 (is / are / have / has)","origin":"book","explain_ar":"planned (تصريف ثالث) تحتاج have/has، والأقرب the students جمع ← have."},{"type":"tf","statement":"When two subjects are connected by either...or, the subject that is closer to the verb determines whether the verb is singular or plural.","answer":true,"src":"SB 92","origin":"book","explain_ar":"هذه قاعدة الكتاب: الفاعل الأقرب يحدد."},{"type":"tf","statement":"Two subjects connected by either...or always take a plural verb.","answer":false,"src":"SB 92","origin":"adapted","explain_ar":"الفعل الجمع دائماً قاعدة both…and فقط؛ مع either…or يتفق الفعل مع الأقرب."},{"type":"fill","q":"Either my brother or my sister ____ going to tutor me in science. (is / are / have / has)","answers":["is"],"src":"WB 70 ex.a #7","origin":"book","explain_ar":"الأقرب my sister مفرد، وgoing to تحتاج be ← is."},{"type":"fill","q":"Rachel should apologise or leave. (either...or) → ____","answers":["Rachel should either apologise or leave."],"src":"SB 93 #9","origin":"book","explain_ar":"either قبل الفعل الأول وor قبل الثاني، والفعلان مصدران بعد should."},{"type":"fill","q":"We can fix dinner for our guests here, or we can take them to a restaurant. (either…or) → ____","answers":["We can either fix dinner for our guests here or take them to a restaurant."],"src":"SB 124 Review 3 ex.3 #3","origin":"book","explain_ar":"الفاعل والفعل المساعد مشتركان فنكتبهما مرة، ثم either + فعل or + فعل."},{"type":"fill","q":"She is at the office. She is at the airport. (either … or) → ____","answers":["She is either at the office or at the airport."],"src":"WB 99 Progress Test 3 ex.b #1","origin":"book","explain_ar":"مكانان من الشكل نفسه (at the …) بعد either وor."},{"type":"fill","q":"A hammer might help us with this kind of work. In fact, a piece of stone might also work. (Rewrite using paired conjunctions) → ____","answers":["Either a hammer or a piece of stone might help us with this kind of work.","Not only a hammer but also a piece of stone might help us with this kind of work."],"src":"WB 71 ex.b #2","origin":"book","explain_ar":"الكتاب لم يحدد الأداة؛ المعنى أن أياً منهما يصلح ← either…or (وتقبل not only…but also)."},{"type":"fill","q":"You can take Sally or any other person with you. I really don't care that much. (Rewrite using paired conjunctions) → ____","answers":["You can take either Sally or any other person with you."],"src":"WB 71 ex.b #6","origin":"book","explain_ar":"اختيار بين اثنين «لا يهمني» ← either…or."}],"flags":[]},{"id":"u9-neither-nor","name_en":"neither ... nor","name_ar":"neither … nor (لا … ولا)","branches":{"form":{"summary_ar":"تعني «لا … ولا»: تنفي الأمر عن الاثنين معاً. الفعل بعدها مثبت ويتفق مع الفاعل الأقرب إليه.","structure":"Neither + S1 + nor + S2 + positive verb (حسب S2)","items":[{"ar":"الأقرب my sister مفرد ← is.","en":"Neither my mother nor my sister is here.","src":"SB 92 (d)","kind":"book"},{"ar":"قاعدة الفاعل الأقرب تشمل neither…nor.","en":"When two subjects are connected by not only...but also, either...or, or neither...nor, the subject that is closer to the verb determines whether the verb is singular or plural.","src":"SB 92","kind":"book"}]},"negative":{"structure":"Neither … nor + فعل مثبت (بلا not ولا don't)","verb_change_ar":"neither…nor هي نفسها نفي، فالفعل يكون مثبتاً: doesn't lie ← lies، didn't keep ← kept، isn't ← is. ويتفق الفعل مع الاسم الأقرب: Paul (مفرد) ← lies، my parents (جمع) ← are.","items":[{"ar":"جملتان منفيتان تصبحان جملة واحدة بفعل مثبت يتفق مع الأقرب: doesn't lie ← lies.","en":"Tom doesn't lie to his friends. Paul doesn't either. → Neither Tom nor Paul lies to their friends.","src":"SB 93 (example)","kind":"book"},{"ar":"الأقرب my parents جمع ← are.","en":"Neither my sister nor my parents are here","src":"SB 92 (e)","kind":"book"}]},"question":{"structure":"لا يعرض الكتاب سؤالاً بـ neither … nor","aux_ar":"لا نضيف don't/doesn't ولا not لأن الأداة منفية بذاتها، والكلمات بعد neither وبعد nor من الشكل نفسه (صفة وصفة).","items":[{"ar":"صفتان بعد neither وnor.","en":"That book is neither interesting nor accurate.","src":"SB 92 (i)","kind":"book"}],"notes":[{"ar":"التوازي: الشكل النحوي نفسه بعد كل جزء من الأداة.","en":"Notice the parallel structure in the examples. The same grammatical forms should follow each part of the paired conjunctions.","src":"SB 92","kind":"book"},{"ar":"الأدوات المزدوجة للتأكيد، وتلفت الانتباه إلى الجزأين.","en":"Paired conjunctions are usually used for emphasis; they draw attention to both parts of the parallel structure.","src":"SB 92","kind":"book"}]},"signals":{"keywords":["neither … nor","… doesn't either","Neither is …","never … or","not … not"],"items":[{"ar":"جملة منفية ثم «Neither is …» ← neither…nor.","en":"Brian isn't very considerate. Neither is Tom. (neither...nor)","src":"SB 93 #7","kind":"book"},{"ar":"جملتان منفيتان بالخبر نفسه لشخصين ← neither…nor بفعل مثبت.","en":"Sua'ad is not in class today. Waleed is not in class today.","src":"SB 124 Review 3 ex.3 #2","kind":"book"}]}},"questions":[{"type":"mcq","q":"Neither the teacher nor the student ____ here.","options":["is","are","has","have"],"answer":0,"src":"WB 70 ex.a #2 (is / are / have / has)","origin":"book","explain_ar":"الأقرب the student مفرد ← is."},{"type":"mcq","q":"Neither my brother nor my sisters ____ teachers.","options":["is","are","has","have"],"answer":1,"src":"WB 70 ex.a #8 (is / are / have / has)","origin":"book","explain_ar":"الأقرب my sisters جمع ← are."},{"type":"tf","statement":"Neither my mother nor my sister is here.","answer":true,"src":"SB 92 (d)","origin":"book","explain_ar":"جملة الكتاب: الفعل مفرد لأن الأقرب my sister مفرد."},{"type":"tf","statement":"Neither Brian nor Tom isn't very considerate.","answer":false,"src":"SB 93 #7","origin":"adapted","explain_ar":"neither…nor منفية بذاتها فلا نضيف not: Neither Brian nor Tom is very considerate."},{"type":"fill","q":"He never listens to or advises his friends when they have a problem. (neither...nor) → ____","answers":["He neither listens to nor advises his friends when they have a problem."],"src":"SB 93 #4","origin":"book","explain_ar":"never تختفي لأن neither…nor تحمل النفي، والفعلان مثبتان ومن الشكل نفسه."},{"type":"fill","q":"Richard and John didn't keep her secret. (neither...nor) → ____","answers":["Neither Richard nor John kept her secret."],"src":"SB 93 #10","origin":"book","explain_ar":"didn't keep ← kept: الفعل مثبت لأن الأداة منفية."},{"type":"fill","q":"This website doesn't have the topic I need. That website doesn't have the topic I need either. (neither…nor) → ____","answers":["Neither this website nor that website has the topic I need."],"src":"SB 124 Review 3 ex.3 #5","origin":"book","explain_ar":"فعل مثبت يتفق مع الأقرب that website (مفرد) ← has."},{"type":"fill","q":"Rayan doesn't know where Hani is. Nadeem doesn't know either. (neither…nor) → ____","answers":["Neither Rayan nor Nadeem knows where Hani is."],"src":"SB 124 Review 3 ex.3 #7","origin":"book","explain_ar":"doesn't know ← knows: مثبت ومفرد لأن الأقرب Nadeem."},{"type":"fill","q":"The English team didn't play well. The Scottish team didn't play well. (neither … nor) → ____","answers":["Neither the English team nor the Scottish team played well."],"src":"WB 99 Progress Test 3 ex.b #3","origin":"book","explain_ar":"didn't play ← played: الفعل مثبت في الماضي."},{"type":"fill","q":"I didn't need to visit the Cathedral. You didn't need to either. (Rewrite using paired conjunctions) → ____","answers":["Neither you nor I needed to visit the Cathedral.","Neither I nor you needed to visit the Cathedral."],"src":"WB 71 ex.b #1","origin":"book","explain_ar":"جملتان منفيتان ← neither…nor بفعل مثبت needed."},{"type":"fill","q":"Peter didn't like the idea of going for a walk. His wife seemed quite unwilling too. (Rewrite using paired conjunctions) → ____","answers":["Neither Peter nor his wife liked the idea of going for a walk."],"src":"WB 71 ex.b #5","origin":"book","explain_ar":"الاثنان رافضان ← neither…nor، والفعل مثبت liked."}],"flags":[]}]},{"unit":10,"unit_title":"Culture Shock","grammar_title":"Modals - Obligation / Lack of Obligation","pages":{"sb":[101,103,124],"wb":[77,78,79]},"rules":[{"id":"u10-must-have-to","name_en":"must / have to (obligation)","name_ar":"الإلزام: must و have to","branches":{"form":{"summary_ar":"للتعبير عن الإلزام. must حين يأتي الإلزام من المتكلم نفسه (إلزام شخصي، قواعد وتعليمات مكتوبة، رأي، ما هو ضروري)، وhave to حين يأتي الإلزام من الخارج (قانون، نظام في المدرسة أو العمل، ظرف).","structure":"S + must + V0  |  S + have to / has to + V0","items":[{"ar":"must: الإلزام من المتكلم؛ للقواعد والتعليمات المكتوبة ولإبداء الرأي وقول ما هو ضروري.","en":"Obligation comes from speaker. We use it for written rules and instructions and giving opinions and saying what is necessary.","src":"WB 77","kind":"book"},{"ar":"تعليمات مكتوبة فرضتها شركة الطيران.","en":"Passengers must fasten their seat belts. (The obligation is imposed by the airline who wrote the notice.)","src":"WB 77","kind":"book"},{"ar":"إلزام شخصي: المتكلم يرى بنفسه أن الاتصال ضروري.","en":"I haven't spoken to Sandra for ages. I must call her.","src":"WB 77","kind":"book"},{"ar":"have to: الإلزام من الخارج (موعد الطائرة هو السبب).","en":"We have to get up early tomorrow to catch the plane. (The time of the plane is the reason for the obligation","src":"WB 77","kind":"book"}]},"negative":{"structure":"S + mustn't + V0 (منع)  |  S + don't / doesn't have to + V0 (لا ضرورة)","verb_change_ar":"must لا تأخذ s ولا do، ونفيها mustn't + مصدر. have to تُنفى بـ don't/doesn't، وhas ترجع have بعد doesn't. وانتبه: النفي يغيّر المعنى؛ mustn't منع وdon't have to عدم ضرورة (تفصيلها في الخريطة التالية).","items":[{"ar":"mustn't = منع.","en":"You mustn't wait here. (You are not allowed to wait here) = negative obligation","src":"WB 77","kind":"book"},{"ar":"don't have to = لا ضرورة.","en":"You don't have to wait here. (It is not necessary for you to wait here, but you can if you want to) = no obligation","src":"WB 77","kind":"book"}]},"question":{"structure":"Must + S + V0 …?  |  Do / Does + S + have to + V0 …?","aux_ar":"must فعل مساعد فيتقدم على الفاعل بلا do (Must I …?). أما have to فتحتاج do/does، وdid في الماضي (Do I have to …? / Did you have to …?). ولا يجوز الجمع بين do وmust.","items":[{"ar":"must تتقدم على الفاعل في السؤال (أحد خياري تمرين الكتاب).","en":"Must I take my laptop computer with me?","src":"WB 78 ex.b #3","kind":"book"},{"ar":"سؤال have to بـ did في الماضي.","en":"Did you have to get a visa?","src":"WB 77","kind":"book"}],"notes":[{"ar":"mustn't ليست مثل don't have to.","en":"mustn't is not the same as don't have to","src":"WB 77","kind":"book"},{"ar":"must + perfect infinitive لا تعبّر عن إلزام في الماضي؛ للماضي نستعمل had to.","en":"Must + perfect infinitive is not used to talk about past obligation.","src":"WB 77","kind":"book"}]},"signals":{"keywords":["obligation","personal obligation","necessary","written rules","a law","a rule at school or work","obligatory"],"items":[{"ar":"قانون أو نظام مدرسة أو عمل ← have to (إلزام عام).","en":"a law, a rule at school or work","src":"SB 101 ex.a #2","kind":"book"},{"ar":"المتكلم يقرر الضرورة بنفسه (جوع، اشتياق) ← must (إلزام شخصي).","en":"I'm very hungry.","src":"SB 101 ex.b #3","kind":"book"},{"ar":"«It is obligatory» ← must.","en":"It is obligatory.","src":"SB 124 Review 3 ex.1 #6","kind":"book"}]}},"questions":[{"type":"mcq","q":"Each driver (should, must) have health insurance. It is obligatory.","options":["should","must"],"answer":1,"src":"SB 124 Review 3 ex.1 #6","origin":"book","explain_ar":"«It is obligatory» إلزام لا نصيحة ← must."},{"type":"mcq","q":"Chris: Do ____ to wear a uniform?","options":["I must","I have"],"answer":1,"src":"WB 78 ex.b #1 (Cross out the wrong form)","origin":"book","explain_ar":"السؤال بـ do يكون مع have to (Do I have to)؛ must لا تأتي بعد do."},{"type":"mcq","q":"Chris: I don't get a ticket for the train this evening. (…) a seat, though. I ____ stand all the way to Scotland.","options":["should","have to"],"answer":1,"src":"WB 78 ex.b #7","origin":"book","explain_ar":"عدم وجود مقعد محجوز ظرف خارجي يفرض الوقوف ← have to، لا نصيحة."},{"type":"mcq","q":"Miranda: Yes, don't worry. But ____ switch it off during the school day.","options":["you should","you must"],"answer":1,"src":"WB 78 ex.b #9","origin":"book","explain_ar":"إطفاء الهاتف خلال الدوام قاعدة في الكلية، لا مجرد نصيحة ← must."},{"type":"tf","statement":"have to: obligation comes from outside.","answer":true,"src":"WB 77","origin":"book","explain_ar":"هذا وصف الكتاب لـ have to."},{"type":"tf","statement":"Use must to express general obligation: a law, a rule at school or work.","answer":false,"src":"SB 101 ex.a #1–2","origin":"adapted","explain_ar":"في الكتاب: have to للإلزام العام (قانون، نظام)، وmust للإلزام الشخصي. ملاحظة: كتاب الأنشطة ص77 بيقول must للقواعد والتعليمات المكتوبة (الإلزام من الجهة اللي كتبتها) وhave to للإلزام من برّا. بتمرين SB 101 الجواب have to لأنو must أخدت «personal obligation»."},{"type":"fill","q":"Use ____ to express personal obligation.","answers":["must"],"src":"SB 101 ex.a #1","origin":"book","explain_ar":"الإلزام الشخصي (من المتكلم) ← must."},{"type":"fill","q":"Use ____ to express general obligation: a law, a rule at school or work.","answers":["have to"],"src":"SB 101 ex.a #2","origin":"book","explain_ar":"الإلزام العام من الخارج ← have to. ملاحظة: كتاب الأنشطة ص77 بيقول must للقواعد والتعليمات المكتوبة (الإلزام من الجهة اللي كتبتها) وhave to للإلزام من برّا. بتمرين SB 101 الجواب have to لأنو must أخدت «personal obligation»."},{"type":"fill","q":"( ) In Britain, you ____ drive on the left.","answers":["have to"],"src":"SB 101 ex.b #1","origin":"book","explain_ar":"قانون بلد = إلزام عام (القاعدة 2) ← have to."},{"type":"fill","q":"( ) I'm very hungry. I ____ eat something.","answers":["must"],"src":"SB 101 ex.b #3","origin":"book","explain_ar":"المتكلم يشعر بالحاجة بنفسه = إلزام شخصي (القاعدة 1) ← must."},{"type":"fill","q":"(Squash club: it is important for all club members to have a shower and wear clean clothes.) You ____ have a shower, and you ____ wear clean clothes.","answers":["have to, have to","must, must"],"src":"SB 101 ex.c #5","origin":"book","explain_ar":"قاعدة النادي إلزام ← have to (إلزام من الخارج)، وتقبل must لأن الكتاب يستعملها للقواعد المكتوبة."}],"flags":[{"type":"unsure","ar":"تمرين SB 101 ex.c: الكتاب يعرّف have to للإلزام العام (SB 101) وmust للقواعد المكتوبة (WB 77)، فقبلنا الاثنين لقواعد النادي.","src":"SB 101 ex.c + WB 77"},{"type":"unsure","ar":"WB 78 ex.b البنود #2 و#4 و#5 تحتمل أكثر من جواب حسب السياق، فلم نأخذها أسئلة.","src":"WB 78 ex.b"},{"type":"book_typo","ar":"سياق WB 78 ex.b #6–7: «I don't get a ticket for the train this evening» صياغة غير سليمة في الكتاب (المقصود غالباً أنه لم يحصل على مقعد محجوز). نقلناها كما هي.","src":"WB 78 ex.b"},{"type":"unsure","ar":"SB 101 ex.a بيعطي الإلزام العام (قانون، نظام) لـ have to، وWB 77 بيعطي القواعد المكتوبة لـ must. كتبنا الفرق بشرح السؤالين.","src":"SB 101 + WB 77"}]},{"id":"u10-mustnt-dont-have-to","name_en":"mustn't / don't have to","name_ar":"المنع وعدم الضرورة: mustn't و don't have to","branches":{"form":{"summary_ar":"mustn't للمنع (غير مسموح، ضد القواعد)، وdon't/doesn't have to لعدم الضرورة (لستَ مضطراً، ويمكنك أن تفعل إن أردت). المعنيان مختلفان تماماً.","structure":"S + mustn't + V0 (منع)  |  S + don't / doesn't have to + V0 (لا ضرورة)","items":[{"ar":"mustn't = منع = إلزام منفي.","en":"mustn't= prohibition. You mustn't wait here. (You are not allowed to wait here) = negative obligation","src":"WB 77","kind":"book"},{"ar":"don't have to = لا ضرورة.","en":"don't/ doesn't have to= absence of necessity= there is no need to do this. You don't have to wait here. (It is not necessary for you to wait here, but you can if you want to) = no obligation","src":"WB 77","kind":"book"},{"ar":"مثال الكتاب يجمع الاثنين في جملة واحدة.","en":"You mustn't disturb other players, but you don't have to be silent.","src":"SB 101 ex.c #1 (example)","kind":"book"}]},"negative":{"structure":"mustn't + V0  |  don't / doesn't have to + V0","verb_change_ar":"بعد mustn't يأتي المصدر بلا to. وبعد don't/doesn't have to يأتي المصدر أيضاً؛ doesn't مع he/she/it، وhas ترجع have لأن does أخذت علامة المفرد (he has to ← he doesn't have to).","items":[{"ar":"الكتاب يكتب الصيغتين المنفيتين: don't مع I/you/we/they وdoesn't مع he/she/it.","en":"don't/ doesn't have to","src":"WB 77","kind":"book"},{"ar":"he has to ← he doesn't have to: الفعل have بلا s بعد doesn't.","en":"","src":"WB 77","kind":"derived"}]},"question":{"structure":"Do / Does + S + have to + V0 …?  →  No, S + don't / doesn't (have to).","aux_ar":"السؤال عن الضرورة يكون بـ Do/Does … have to؟ والجواب بالنفي يعني لا ضرورة، لا منعاً. ولا يعرض الكتاب سؤالاً بـ mustn't.","items":[{"ar":"إذا كان الجواب «لا ضرورة» نقول: No, you don't have to.","en":"","src":"WB 77","kind":"derived"}],"notes":[{"ar":"ملاحظة الكتاب: mustn't ليست مثل don't have to.","en":"mustn't is not the same as don't have to","src":"WB 77","kind":"book"},{"ar":"عدم الضرورة يعني أنك تستطيع أن تفعل إن أردت.","en":"It is not necessary for you to wait here, but you can if you want to","src":"WB 77","kind":"book"}]},"signals":{"keywords":["not allowed","against the rules","forbidden","No talking","No … allowed","not necessary","no need","if you don't want to","plenty of time","Entry possible"],"items":[{"ar":"منع صريح (forbidden / No … / not allowed) ← mustn't.","en":"Smoking is forbidden in this restaurant.","src":"SB 124 Review 3 ex.1 #1","kind":"book"},{"ar":"وقت كافٍ / إن لم ترد / ممكن وليس مفروضاً ← don't have to.","en":"There is plenty of time.","src":"SB 124 Review 3 ex.1 #2","kind":"book"},{"ar":"لافتة «No late arrivals allowed» ← mustn't، ولافتة «Entry possible 30 minutes before» ← don't have to.","en":"Entry possible 30 minutes before the concert. No late arrivals allowed.","src":"WB 78 ex.c","kind":"book"}]}},"questions":[{"type":"mcq","q":"You (mustn't / don't have to) smoke here. Smoking is forbidden in this restaurant.","options":["mustn't","don't have to"],"answer":0,"src":"SB 124 Review 3 ex.1 #1","origin":"book","explain_ar":"forbidden = منع ← mustn't."},{"type":"mcq","q":"There is plenty of time. We (mustn't / don't have to) be at the meeting until 9.00.","options":["mustn't","don't have to"],"answer":1,"src":"SB 124 Review 3 ex.1 #2","origin":"book","explain_ar":"الوقت كافٍ فلا ضرورة للوصول قبل 9 ← don't have to."},{"type":"tf","statement":"mustn't is not the same as don't have to.","answer":true,"src":"WB 77","origin":"book","explain_ar":"mustn't منع، وdon't have to عدم ضرورة."},{"type":"tf","statement":"You don't have to wait here. = You are not allowed to wait here.","answer":false,"src":"WB 77","origin":"adapted","explain_ar":"«not allowed» معنى mustn't؛ don't have to تعني ليس ضرورياً ويمكنك إن أردت."},{"type":"fill","q":"____ is used to express absence of obligation.","answers":["don't have to","doesn't have to","don't/doesn't have to"],"src":"SB 101 ex.a #5","origin":"book","explain_ar":"غياب الإلزام ← don't/doesn't have to."},{"type":"fill","q":"____ means you are not allowed to do this, it's against the rules.","answers":["mustn't","must not"],"src":"SB 101 ex.a #6","origin":"book","explain_ar":"غير مسموح، ضد القواعد ← mustn't."},{"type":"fill","q":"( ) You ____ use your mobile phone in a gas station.","answers":["mustn't","must not"],"src":"SB 101 ex.b #4","origin":"book","explain_ar":"استعمال الهاتف في محطة الوقود ممنوع (القاعدة 6) ← mustn't."},{"type":"fill","q":"( ) If he has a credit card, he ____ pay for something in cash. He can use the card.","answers":["doesn't have to","does not have to"],"src":"SB 101 ex.b #6","origin":"book","explain_ar":"يستطيع الدفع بالبطاقة فلا ضرورة للنقد (القاعدة 5) ← doesn't have to مع he."},{"type":"fill","q":"(Squash club: finish on time.) You ____ finish on time, but you ____ start on time.","answers":["have to, don't have to","must, don't have to"],"src":"SB 101 ex.c #2","origin":"book","explain_ar":"الانتهاء في الوقت مفروض، أما البدء في الوقت فغير مفروض ← don't have to."},{"type":"fill","q":"(Squash club: taking club balls home is not allowed.) You ____ play with club balls, but if you do, you ____ take them home.","answers":["don't have to, mustn't"],"src":"SB 101 ex.c #3","origin":"book","explain_ar":"اللعب بكرات النادي غير مفروض ← don't have to، وأخذها إلى البيت ممنوع ← mustn't."},{"type":"fill","q":"(Squash club: eating or drinking outside the canteen is not allowed.) You ____ eat or drink outside the canteen, but you ____ buy your food in it if you don't want to.","answers":["mustn't, don't have to"],"src":"SB 101 ex.c #4","origin":"book","explain_ar":"الأكل خارج المقصف ممنوع ← mustn't، والشراء منه غير مفروض «if you don't want to» ← don't have to."},{"type":"fill","q":"(Sign: LIBRARY — No talking) You ____ talk in the library.","answers":["mustn't","must not"],"src":"WB 78 ex.c #1","origin":"book","explain_ar":"«No talking» منع ← mustn't."}],"flags":[{"type":"book_typo","ar":"الخيار الثاني في SB 124 Review 3 ex.1 #1 مطبوع «don't have» بلا to، والصحيح «don't have to» (كما في البند #2). نقلناه كما هو والجواب mustn't لا يتأثر.","src":"SB 124 Review 3 ex.1 #1"}]},{"id":"u10-should-shouldnt","name_en":"should / shouldn't (advice)","name_ar":"النصيحة: should و shouldn't","branches":{"form":{"summary_ar":"should للنصيحة أو التوصية أو إبداء الرأي، وshouldn't للنصيحة بعدم فعل شيء لأنه سيئ أو خاطئ.","structure":"S + should + V0","items":[{"ar":"should للنصيحة أو التوصية.","en":"Advice or recommendations","src":"WB 77","kind":"book"},{"ar":"نصيحة.","en":"You should apologise to the boss for being late. (advice)","src":"WB 77","kind":"book"},{"ar":"توصية.","en":"You should get a good map of London before you go there. (recommendation)","src":"WB 77","kind":"book"}]},"negative":{"structure":"S + shouldn't + V0","verb_change_ar":"shouldn't = should not، وبعدها المصدر بلا to ولا s، ولا نحتاج don't/doesn't.","items":[{"ar":"النصيحة بعدم فعل شيء لأنه سيئ أو خاطئ.","en":"To advise not to do something, usually because it is bad or wrong. You shouldn't smoke.","src":"WB 77","kind":"book"}]},"question":{"structure":"Should + S + V0 …?","aux_ar":"should فعل مساعد يتقدم على الفاعل بلا do (Should I …?)، ويطلب بها المتكلم النصيحة أو يعرض فعل شيء.","items":[{"ar":"طلب النصيحة.","en":"What do you think I should do?","src":"SB 103 (Asking for advice)","kind":"book"},{"ar":"صيغة أخرى لطلب النصيحة.","en":"Do you think I should…?","src":"SB 103 (Asking for advice)","kind":"book"}],"notes":[{"ar":"في المحادثة لا نقول عادة I advise you… لأنها رسمية جداً، بل نستعمل You should/shouldn't أو If I were you, I would…","en":"In a conversation, it's not common to say 'I advise you to do this' or 'I recommend that you do this'. These are very formal and are mostly used in writing. Use one of the phrases below. • You should/ shouldn't… • If I were you, I would … • Make sure (that) you… • The best thing is to…","src":"SB 103","kind":"book"}]},"signals":{"keywords":["advice","recommendation","opinion","negative advice","Can you give me any more advice?"],"items":[{"ar":"مشكلة صحية أو تقصير ← نصيحة بـ should/shouldn't.","en":"He has a backache. / Tom doesn't study enough.","src":"SB 101 ex.b #2, #5","kind":"book"},{"ar":"طلب نصيحة صريح ← should.","en":"Can you give me any more advice?","src":"WB 78 ex.b #10","kind":"book"}]}},"questions":[{"type":"mcq","q":"You (should, may) see a doctor for that serious cut on your arm.","options":["should","may"],"answer":0,"src":"SB 124 Review 3 ex.1 #4","origin":"book","explain_ar":"نصيحة بزيارة الطبيب ← should."},{"type":"mcq","q":"(We don't have to / We'd better not) talk for too long. These calls are expensive.","options":["We don't have to","We'd better not"],"answer":1,"src":"SB 124 Review 3 ex.1 #3","origin":"book","explain_ar":"السبب (المكالمات غالية) يجعلها نصيحة بعدم الإطالة ← We'd better not؛ don't have to تعني «لا ضرورة» فقط."},{"type":"mcq","q":"These books are on the wrong shelf. They (shouldn't / mustn't) be here.","options":["shouldn't","mustn't"],"answer":0,"src":"SB 124 Review 3 ex.1 #8","origin":"book","explain_ar":"الكتب في غير مكانها = وضع خاطئ ← shouldn't (ليست منعاً بقانون)."},{"type":"mcq","q":"Miranda: ____ give you a ring later and see how things are going?","options":["Should I","Must I"],"answer":0,"src":"WB 78 ex.b #8","origin":"book","explain_ar":"عرض واستشارة لا إلزام ← Should I."},{"type":"mcq","q":"Chris: Ok. Can you give me any more advice? Miranda: Yes. You ____ visit the lake near the collage. It's beautiful.","options":["must","should"],"answer":1,"src":"WB 78 ex.b #10","origin":"book","explain_ar":"طلب نصيحة وتوصية بمكان جميل ← should."},{"type":"tf","statement":"shouldn't is used to advise not to do something, usually because it is bad or wrong.","answer":true,"src":"WB 77","origin":"book","explain_ar":"هذا وصف الكتاب لـ shouldn't."},{"type":"tf","statement":"Use should to express absence of obligation.","answer":false,"src":"SB 101 ex.a #3, #5","origin":"adapted","explain_ar":"should للرأي والتوصية؛ غياب الإلزام ← don't have to."},{"type":"fill","q":"Use ____ to give an opinion or a recommendation.","answers":["should"],"src":"SB 101 ex.a #3","origin":"book","explain_ar":"الرأي والتوصية ← should."},{"type":"fill","q":"____ expresses negative advice.","answers":["shouldn't","should not"],"src":"SB 101 ex.a #4","origin":"book","explain_ar":"النصيحة المنفية ← shouldn't."},{"type":"fill","q":"( ) He has a backache. He ____ carry heavy things.","answers":["shouldn't","should not"],"src":"SB 101 ex.b #2","origin":"book","explain_ar":"نصيحة بعدم حمل الأثقال (القاعدة 4) ← shouldn't."},{"type":"fill","q":"( ) Tom doesn't study enough. He ____ study harder.","answers":["should"],"src":"SB 101 ex.b #5","origin":"book","explain_ar":"توصية برأي المتكلم (القاعدة 3) ← should."}],"flags":[{"type":"unsure","ar":"SB 124 Review 3 ex.1 #8 (shouldn't / mustn't): وضعنا shouldn't لأن الكتب في غير مكانها خطأ لا منع، لكن بعض المعلمين قد يقبلون mustn't.","src":"SB 124 Review 3 ex.1 #8"},{"type":"book_typo","ar":"WB 78 ex.b #10: «the collage» والصحيح «the college». وفي #3 مطبوع «Should l» بحرف l بدل I.","src":"WB 78 ex.b"},{"type":"unsure","ar":"SB 124 Review 3 ex.1 #3 يستعمل «We'd better not»، وhad better غير مشروحة في قاعدة الوحدة 10؛ أبقينا السؤال لأنه من الكتاب.","src":"SB 124 Review 3 ex.1 #3"}]},{"id":"u10-past-modals","name_en":"Past forms: had to / didn't have to / should have / must have","name_ar":"الماضي: had to و should have و must have","branches":{"form":{"summary_ar":"للماضي: had to للإلزام في الماضي، وshould have + التصريف الثالث لانتقاد فعل في الماضي (الفاعل لم يفعل الصواب)، وmust have + التصريف الثالث للاستنتاج عن الماضي لا للإلزام.","structure":"S + had to + V0  |  S + should have + p.p.  |  S + must have + p.p. (deduction)","items":[{"ar":"الإلزام في الماضي بـ had to.","en":"To express obligation in the past, use had to: I had to report the incident to the police.","src":"WB 77","kind":"book"},{"ar":"انتقاد فعل ماضٍ: لم أبقَ في البيت وكان تصرفي خاطئاً.","en":"I should have stayed at home. (= I didn't stay at home and my behaviour was wrong.)","src":"WB 77","kind":"book"},{"ar":"must have + p.p. للاستنتاج عن الماضي.","en":"She must have left early.","src":"WB 77","kind":"book"},{"ar":"مثال الكتاب: كانت في جدول السبت فعملت.","en":"Jenny had to work on Saturday.","src":"WB 79 ex.d (example)","kind":"book"}]},"negative":{"structure":"S + didn't have to + V0  |  S + shouldn't have + p.p.","verb_change_ar":"نفي had to يكون didn't have to: did تأخذ الماضي فترجع had إلى have. ونفي should have يكون shouldn't have + التصريف الثالث (فعلتَه وكان خطأً). الفرق: didn't have to = لم يكن ضرورياً، shouldn't have = حدث وكان خطأً.","items":[{"ar":"لم يكن مضطراً للعمل لأنه ليس في جدول السبت.","en":"Colin didn't have to work on Saturday.","src":"WB 79 ex.d (example)","kind":"book"},{"ar":"should have + p.p. ← shouldn't have + p.p. بالمعنى المعاكس: الفعل حدث وكان خطأً.","en":"","src":"WB 77","kind":"derived"}]},"question":{"structure":"Did + S + have to + V0 …?","aux_ar":"سؤال had to يكون بـ did والفعل have مصدر: Did you have to …?","items":[{"ar":"سؤال الإلزام في الماضي.","en":"Did you have to get a visa?","src":"WB 77","kind":"book"}],"notes":[{"ar":"should في الماضي تعني أن الفاعل لم يفعل الصواب.","en":"To criticise actions in the past, use should + perfect infinitive. Should in the past means that the subject did not do the right thing.","src":"WB 77","kind":"book"},{"ar":"must + perfect infinitive ليست للإلزام في الماضي بل للاستنتاج.","en":"Must + perfect infinitive is not used to talk about past obligation. It is used to make deductions about the past.","src":"WB 77","kind":"book"}]},"signals":{"keywords":["last term","last weekend","Now it's not …","but she was ill","had to","didn't have to","should have","must have"],"items":[{"ar":"زمن ماضٍ ونتيجة سيئة الآن ← should have + p.p.","en":"… harder for the exam last term. Your results are too bad.","src":"SB 124 Review 3 ex.1 #7","kind":"book"},{"ar":"كان مطلوباً ولم يعمل لسبب ← should have worked … but …","en":"Carol should have worked on Sunday but she was ill.","src":"WB 79 ex.d (example)","kind":"book"},{"ar":"في الجدول وعمل ← had to؛ ليس في جدول ذلك اليوم ← didn't have to.","en":"","src":"WB 79 ex.d","kind":"derived"}]}},"questions":[{"type":"mcq","q":"You (didn't have to tell me / shouldn't have told me) about the party. Now it's not a surprise.","options":["didn't have to tell me","shouldn't have told me"],"answer":1,"src":"SB 124 Review 3 ex.1 #5","origin":"book","explain_ar":"أخبرتني وكان ذلك خطأً (ضاعت المفاجأة) ← shouldn't have told me."},{"type":"mcq","q":"You (should study, should have studied) harder for the exam last term. Your results are too bad.","options":["should study","should have studied"],"answer":1,"src":"SB 124 Review 3 ex.1 #7","origin":"book","explain_ar":"last term ماضٍ وانتقاد لما لم يحدث ← should have + p.p."},{"type":"mcq","q":"Chris: I don't get a ticket for the train this evening. ____ a seat, though.","options":["I should have reserved","I must have reserved"],"answer":0,"src":"WB 78 ex.b #6","origin":"book","explain_ar":"يلوم نفسه على عدم الحجز ← should have + p.p.؛ must have للاستنتاج لا للوم."},{"type":"tf","statement":"Must + perfect infinitive is not used to talk about past obligation. It is used to make deductions about the past.","answer":true,"src":"WB 77","origin":"book","explain_ar":"هذه ملاحظة الكتاب نفسها؛ الإلزام في الماضي ← had to."},{"type":"tf","statement":"I should have stayed at home. = I stayed at home and it was the right thing to do.","answer":false,"src":"WB 77","origin":"adapted","explain_ar":"معناها في الكتاب: لم أبقَ في البيت وكان تصرفي خاطئاً."},{"type":"fill","q":"Table — Saturday: Jenny ✓, Brian ill, Joan ill, Daniel ✓ / Sunday: Colin ✓, Mary ✓, Derek ill, Carol ill. (Colin/ Sunday) ____ .","answers":["Colin had to work on Sunday."],"src":"WB 79 ex.d #1","origin":"book","explain_ar":"في جدول الأحد وعمل ← had to."},{"type":"fill","q":"Table — Saturday: Jenny ✓, Brian ill, Joan ill, Daniel ✓ / Sunday: Colin ✓, Mary ✓, Derek ill, Carol ill. (Joan/ Sunday) ____ .","answers":["Joan didn't have to work on Sunday.","Joan did not have to work on Sunday."],"src":"WB 79 ex.d #2","origin":"book","explain_ar":"ليست في جدول الأحد ← didn't have to."},{"type":"fill","q":"Table — Saturday: Jenny ✓, Brian ill, Joan ill, Daniel ✓ / Sunday: Colin ✓, Mary ✓, Derek ill, Carol ill. (Derek/ Sunday) ____ but he was ill.","answers":["Derek should have worked on Sunday"],"src":"WB 79 ex.d #3","origin":"book","explain_ar":"كان في جدول الأحد ولم يعمل لمرضه ← should have worked."},{"type":"fill","q":"Table — Saturday: Jenny ✓, Brian ill, Joan ill, Daniel ✓ / Sunday: Colin ✓, Mary ✓, Derek ill, Carol ill. (Mary/ Saturday) ____ .","answers":["Mary didn't have to work on Saturday.","Mary did not have to work on Saturday."],"src":"WB 79 ex.d #4","origin":"book","explain_ar":"ليست في جدول السبت ← didn't have to."},{"type":"fill","q":"Table — Saturday: Jenny ✓, Brian ill, Joan ill, Daniel ✓ / Sunday: Colin ✓, Mary ✓, Derek ill, Carol ill. (Brian/ Saturday) ____ but he was ill.","answers":["Brian should have worked on Saturday"],"src":"WB 79 ex.d #5","origin":"book","explain_ar":"في جدول السبت ولم يعمل لمرضه ← should have worked."},{"type":"fill","q":"Table — Saturday: Jenny ✓, Brian ill, Joan ill, Daniel ✓ / Sunday: Colin ✓, Mary ✓, Derek ill, Carol ill. (Daniel/ Saturday) ____ .","answers":["Daniel had to work on Saturday."],"src":"WB 79 ex.d #6","origin":"book","explain_ar":"في جدول السبت وعمل ← had to."},{"type":"fill","q":"Table — Saturday: Jenny ✓, Brian ill, Joan ill, Daniel ✓ / Sunday: Colin ✓, Mary ✓, Derek ill, Carol ill. (Derek/ Saturday) ____ .","answers":["Derek didn't have to work on Saturday.","Derek did not have to work on Saturday."],"src":"WB 79 ex.d #8","origin":"book","explain_ar":"ليس في جدول السبت ← didn't have to."}],"flags":[{"type":"unsure","ar":"WB 77 يشرح should have + p.p. للانتقاد، لكن تمرين WB 79 ex.d يستعملها لمن كان مطلوباً منه العمل ولم يعمل لمرضه (بلا لوم). اتبعنا نموذج الكتاب في الأجوبة.","src":"WB 77 + WB 79 ex.d"},{"type":"unsure","ar":"الكتاب في الوحدة 10 لا يشرح الاستنتاج في الحاضر (must be / can't be) ولا ought to ولا might/can't have؛ يذكر فقط must have + p.p. للاستنتاج عن الماضي (WB 77). لم نضف ما ليس في الكتاب.","src":"SB 101 + WB 77"}]}]}]},{"module":6,"module_title":"Module 6 Technology","units":[{"unit":11,"unit_title":"Artificial Intelligence","grammar_title":"Reported Speech","pages":{"sb":[112,113,124],"wb":[85,86,94,95,99,110]},"rules":[{"id":"u11-reported-statements","name_en":"Reported statements","name_ar":"نقل الجملة الخبرية","branches":{"form":{"summary_ar":"ننقل كلام شخص بمعناه لا بكلماته نفسها: فعل نقل ماضٍ (said / told) ثم that (يمكن حذفها)، ويرجع زمن الفعل خطوة إلى الماضي، وتتغير الضمائر وظروف الزمان والمكان.","structure":"S + said (that) + S + V (خطوة للماضي)  |  S + told + object + (that) + S + V","items":[{"ar":"طريقتان لنقل الكلام: مباشر وغير مباشر. في المباشر نكرر كلمات المتكلم نفسها.","en":"There are two ways of reporting what a person has said: direct and indirect. In direct speech, we repeat the original speaker
